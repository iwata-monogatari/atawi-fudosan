<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>課税明細書の見本図｜所在地・地番の確認</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px 12px; background: #edf5f8; color: #173e50; font-family: "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; }
    main { max-width: 720px; margin: 0 auto; }
    h1 { margin: 0 0 12px; font-size: 22px; }
    .return-guide { margin: 0 0 16px; padding: 16px; background: #fff; border: 2px solid #176480; border-radius: 10px; font-size: 18px; font-weight: 700; line-height: 1.8; }
    img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <main>
    <h1>課税明細書の見本図</h1>
    <p class="return-guide">見終わったらこのタブを閉じると、入力途中のフォームに戻れます。</p>
    <picture>
      <source media="(max-width: 600px)" srcset="/assets/property-tax-statement-example-mobile.svg" width="480" height="640">
      <img src="/assets/property-tax-statement-example.svg" width="720" height="600" alt="課税明細書の架空の見本。土地の所在（所在地）と地番を太枠と矢印で示しています。地番123番4は枝番4まで入力します。">
    </picture>
  </main>
</body>
</html>
