<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">売却後の資料は三つに分けて残す</title><desc id="desc">不動産売却の申告資料を整理する図。契約書等の計算根拠、最終的に提出した申告内容、提出方法に応じた記録の三つを分けて保存し、複写式の控えに頼らず保管先を決める。</desc><rect width="800" height="720" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="54" font-size="27" font-weight="bold">売却後の資料は三つに分けて残す</text><rect x="30" y="90" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="133" r="23" fill="#0e5c8a"/><text x="69" y="142" text-anchor="middle" fill="white" font-size="26">1</text><text x="109" y="140" font-size="27" font-weight="bold">計算の根拠</text><text x="109" y="191" font-size="25">契約書・精算書・領収書など</text><text x="109" y="230" font-size="23">何の金額か分かる資料を保存</text><rect x="30" y="285" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="328" r="23" fill="#0e5c8a"/><text x="69" y="337" text-anchor="middle" fill="white" font-size="26">2</text><text x="109" y="335" font-size="27" font-weight="bold">提出した内容</text><text x="109" y="386" font-size="25">最終版の申告書と添付資料</text><text x="109" y="425" font-size="23">作成途中の版と取り違えない</text><rect x="30" y="480" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="523" r="23" fill="#0e5c8a"/><text x="69" y="532" text-anchor="middle" fill="white" font-size="26">3</text><text x="109" y="530" font-size="27" font-weight="bold">提出の記録</text><text x="109" y="581" font-size="25">提出方法に応じた記録を確認</text><text x="109" y="620" font-size="23">保存先と確認できる人を決める</text><text x="40" y="704" font-size="17">2026年10月23日確認｜本文の出典と個別条件を照合</text></g></svg>