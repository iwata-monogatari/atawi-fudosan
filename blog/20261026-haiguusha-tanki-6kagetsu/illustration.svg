<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">配偶者短期居住権：起算日を分ける</title><desc id="desc">配偶者短期居住権の成立条件を確認したうえで、共同相続人間の遺産分割では帰属確定日と相続開始から6か月の遅い日、それ以外は取得者による消滅の申入れから6か月を確認する説明図。</desc><rect width="800" height="720" rx="16" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="30" y="52" font-size="26" font-weight="bold">配偶者短期居住権：起算日を分ける</text><rect x="25" y="85" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="128" r="23" fill="#0e5c8a"/><text x="62" y="137" text-anchor="middle" fill="white" font-size="26">1</text><text x="102" y="136" font-size="27" font-weight="bold">まず成立条件を確認</text><text x="45" y="190" font-size="26">相続開始時の所有者と居住状況</text><text x="45" y="231" font-size="23">無償使用だったか、専門家へ確認</text><rect x="25" y="280" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="323" r="23" fill="#0e5c8a"/><text x="62" y="332" text-anchor="middle" fill="white" font-size="26">2</text><text x="102" y="331" font-size="27" font-weight="bold">共同相続人で建物を分割</text><text x="45" y="385" font-size="26">帰属確定日と相続開始から6か月</text><text x="45" y="426" font-size="23">原則、この二つの遅い日まで</text><rect x="25" y="475" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="518" r="23" fill="#0e5c8a"/><text x="62" y="527" text-anchor="middle" fill="white" font-size="26">3</text><text x="102" y="526" font-size="27" font-weight="bold">それ以外の場合</text><text x="45" y="580" font-size="26">取得者による消滅の申入れの日</text><text x="45" y="621" font-size="23">その日から6か月が基準</text><text x="30" y="702" font-size="17">2026年10月26日確認｜個別条件と本文の出典を照合</text></g></svg>