<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">火災警報器は、確認・記録・引継ぎの順に</title><desc id="desc">空き家の火災警報器を機器ごとに作動確認し、設置年と交換履歴を記録して、売買時は買主へ状態と費用負担の合意を引き継ぐ三段階を示す図</desc><rect width="1000" height="440" rx="20" fill="#e9f5fc"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#1e3f55"><text x="500" y="70" text-anchor="middle" font-size="31" font-weight="bold">火災警報器は、確認・記録・引継ぎの順に</text><rect x="40" y="135" width="280" height="225" rx="18" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="180" cy="184" r="25" fill="#0e5c8a"/><text x="180" y="194" fill="white" font-size="28" text-anchor="middle">1</text><text x="180" y="244" font-size="25" text-anchor="middle" font-weight="bold">作動を確認</text><text x="180" y="289" font-size="22" text-anchor="middle">機器ごとに試験</text><text x="180" y="326" font-size="19" text-anchor="middle">説明書の方法に従う</text><path d="M328 245h23m-9-9 9 9-9 9" fill="none" stroke="#2E9BD4" stroke-width="4"/><rect x="360" y="135" width="280" height="225" rx="18" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="500" cy="184" r="25" fill="#0e5c8a"/><text x="500" y="194" fill="white" font-size="28" text-anchor="middle">2</text><text x="500" y="244" font-size="25" text-anchor="middle" font-weight="bold">日付を記録</text><text x="500" y="289" font-size="22" text-anchor="middle">設置年・交換歴</text><text x="500" y="326" font-size="19" text-anchor="middle">不明は不明のまま残す</text><path d="M648 245h23m-9-9 9 9-9 9" fill="none" stroke="#2E9BD4" stroke-width="4"/><rect x="680" y="135" width="280" height="225" rx="18" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="820" cy="184" r="25" fill="#0e5c8a"/><text x="820" y="194" fill="white" font-size="28" text-anchor="middle">3</text><text x="820" y="244" font-size="25" text-anchor="middle" font-weight="bold">買主へ引継ぎ</text><text x="820" y="289" font-size="22" text-anchor="middle">状態と負担を合意</text><text x="820" y="326" font-size="19" text-anchor="middle">設備表と履歴を渡す</text><text x="500" y="407" text-anchor="middle" font-size="20">10年は交換の目安。売却時の一律交換義務とは別です。</text></g></svg>