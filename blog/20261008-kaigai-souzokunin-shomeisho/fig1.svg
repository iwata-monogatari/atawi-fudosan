<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#e9f5fc"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="60" y="80" font-size="38" font-weight="bold">海外相続人へ頼む前の 3 確認</text><text x="60" y="124" font-size="23">日本側で整理 → 司法書士と確認 → 海外本人へ依頼</text><rect x="55" y="175" width="330" height="270" rx="18" fill="white" stroke="#2E9BD4" stroke-width="3"/><circle cx="103" cy="224" r="27" fill="#16709f"/><text x="94" y="235" font-size="30" fill="white">1</text><text x="80" y="295" font-size="29" font-weight="bold">提出先と用途</text><text x="80" y="350" font-size="24">誰の、何の手続か</text><text x="80" y="392" font-size="24">誰に確認を頼むか</text><rect x="435" y="175" width="330" height="270" rx="18" fill="white" stroke="#2E9BD4" stroke-width="3"/><circle cx="483" cy="224" r="27" fill="#16709f"/><text x="474" y="235" font-size="30" fill="white">2</text><text x="460" y="295" font-size="29" font-weight="bold">署名と住所</text><text x="460" y="350" font-size="24">証明する事項を分ける</text><text x="460" y="392" font-size="24">必要な形式を確認</text><rect x="815" y="175" width="330" height="270" rx="18" fill="white" stroke="#2E9BD4" stroke-width="3"/><circle cx="863" cy="224" r="27" fill="#16709f"/><text x="854" y="235" font-size="30" fill="white">3</text><text x="840" y="295" font-size="29" font-weight="bold">取得から受領</text><text x="840" y="350" font-size="24">取得・送付の担当</text><text x="840" y="392" font-size="24">到着後の確認担当</text><rect x="55" y="485" width="1090" height="105" rx="16" fill="#0e5c8a"/><text x="88" y="528" font-size="28" fill="white">売却の決断と、資料を確認する準備は分ける。</text><text x="88" y="568" font-size="22" fill="white">未確認の欄は推測で埋めず、専門家への質問にする。</text></g></svg>