<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">残った募集広告は、記録から反映確認まで</title><desc id="desc">売却後も残る募集広告のURLと日時と会社を記録し、仲介担当から掲載元や連携先へ削除を依頼して、募集終了の反映を再確認する三段階の図</desc><rect width="1000" height="440" rx="20" fill="#e9f5fc"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#1e3f55"><text x="500" y="70" text-anchor="middle" font-size="31" font-weight="bold">残った募集広告は、記録から反映確認まで</text><rect x="40" y="135" width="280" height="225" rx="18" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="180" cy="184" r="25" fill="#0e5c8a"/><text x="180" y="194" fill="white" font-size="28" text-anchor="middle">1</text><text x="180" y="244" font-size="25" text-anchor="middle" font-weight="bold">記録を残す</text><text x="180" y="289" font-size="22" text-anchor="middle">URL・日時・会社</text><text x="180" y="326" font-size="19" text-anchor="middle">募集ページを確認</text><path d="M328 245h23m-9-9 9 9-9 9" fill="none" stroke="#2E9BD4" stroke-width="4"/><rect x="360" y="135" width="280" height="225" rx="18" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="500" cy="184" r="25" fill="#0e5c8a"/><text x="500" y="194" fill="white" font-size="28" text-anchor="middle">2</text><text x="500" y="244" font-size="25" text-anchor="middle" font-weight="bold">担当へ照会</text><text x="500" y="289" font-size="22" text-anchor="middle">掲載元へ削除依頼</text><text x="500" y="326" font-size="19" text-anchor="middle">転載・連携先も確認</text><path d="M648 245h23m-9-9 9 9-9 9" fill="none" stroke="#2E9BD4" stroke-width="4"/><rect x="680" y="135" width="280" height="225" rx="18" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="820" cy="184" r="25" fill="#0e5c8a"/><text x="820" y="194" fill="white" font-size="28" text-anchor="middle">3</text><text x="820" y="244" font-size="25" text-anchor="middle" font-weight="bold">反映を確認</text><text x="820" y="289" font-size="22" text-anchor="middle">募集終了を再確認</text><text x="820" y="326" font-size="19" text-anchor="middle">未了は担当と日時を決定</text><text x="500" y="407" text-anchor="middle" font-size="20">削除の依頼と、実際に募集が終わった確認は別の作業です。</text></g></svg>