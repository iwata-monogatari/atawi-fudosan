<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">情報提供の同意：署名前の4項目</title><desc id="desc">自治体から外部へ情報を渡す前に、提供元の目的、提供先の範囲、提供先の目的、渡す情報の内容の4項目を確認し、売却依頼とは分ける図</desc><rect width="960" height="430" rx="16" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="56" font-size="27" font-weight="bold">情報提供の同意：署名前の4項目</text><rect x="40" y="100" width="440" height="105" rx="12" fill="#e9f5fc" stroke="#2E9BD4"/><text x="60" y="140" font-size="18" fill="#16709f">01</text><text x="60" y="168" font-size="19"><tspan x="60" dy="0">提供元の目的</tspan></text><rect x="500" y="100" width="440" height="105" rx="12" fill="#e9f5fc" stroke="#2E9BD4"/><text x="520" y="140" font-size="18" fill="#16709f">02</text><text x="520" y="168" font-size="19"><tspan x="520" dy="0">提供先の範囲</tspan></text><rect x="40" y="230" width="440" height="105" rx="12" fill="#ffffff" stroke="#2E9BD4"/><text x="60" y="270" font-size="18" fill="#16709f">03</text><text x="60" y="298" font-size="19"><tspan x="60" dy="0">提供先の目的</tspan></text><rect x="500" y="230" width="440" height="105" rx="12" fill="#ffffff" stroke="#2E9BD4"/><text x="520" y="270" font-size="18" fill="#16709f">04</text><text x="520" y="298" font-size="19"><tspan x="520" dy="0">渡す情報の内容</tspan></text><text x="40" y="390" font-size="20">情報提供への同意と、売却を依頼する判断は別です</text></g></svg>