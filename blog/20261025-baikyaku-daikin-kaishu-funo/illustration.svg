<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">未回収の代金：相談用に分ける情報</title><desc id="desc">未回収の不動産売却代金について相談するための三つの情報を示す図。契約額・受領額・未入金額を分け、支払期限と請求や回答の経緯を残し、事実の発生日と確認日を整理して税理士や弁護士へ渡す。</desc><rect width="800" height="720" rx="16" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="30" y="52" font-size="26" font-weight="bold">未回収の代金：相談用に分ける情報</text><rect x="25" y="85" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="128" r="23" fill="#0e5c8a"/><text x="62" y="137" text-anchor="middle" fill="white" font-size="26">1</text><text x="102" y="136" font-size="27" font-weight="bold">金額</text><text x="45" y="190" font-size="26">契約額・受領額・未入金額</text><text x="45" y="231" font-size="23">未入金額をそのまま税額にしない</text><rect x="25" y="280" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="323" r="23" fill="#0e5c8a"/><text x="62" y="332" text-anchor="middle" fill="white" font-size="26">2</text><text x="102" y="331" font-size="27" font-weight="bold">経緯</text><text x="45" y="385" font-size="26">支払期限・請求・相手方の回答</text><text x="45" y="426" font-size="23">入金遅れと回収不能を分ける</text><rect x="25" y="475" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="518" r="23" fill="#0e5c8a"/><text x="62" y="527" text-anchor="middle" fill="white" font-size="26">3</text><text x="102" y="526" font-size="27" font-weight="bold">日付</text><text x="45" y="580" font-size="26">事実が起きた日と確認した日</text><text x="45" y="621" font-size="23">申告・請求の期限は専門家に確認</text><text x="30" y="702" font-size="17">2026年10月25日確認｜個別条件と本文の出典を照合</text></g></svg>