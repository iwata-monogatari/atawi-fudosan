<svg xmlns="http://www.w3.org/2000/svg" width="400" height="749" viewBox="0 0 400 749" role="img" aria-labelledby="t d">
<title id="t">代理人売却の書類</title>
<desc id="d">委任状、印鑑証明書、本人確認をそろえ、司法書士の意思確認を経て決済へ進む。</desc>
<rect width="400" height="749" rx="18" fill="#eef3f7"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#1e4f6b">代理人売却の書類</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#7da7bb"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#1e4f6b">委任状を作る</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">不動産と権限の範囲を具体的に</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">書き、本人の実印を押す</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#2e7396" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#7da7bb"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#1e4f6b">証明書をそろえる</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">本人の印鑑証明書と、代理人の</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">本人確認書類を用意する</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#2e7396" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#fff" stroke="#7da7bb"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#1e4f6b">意思確認を受ける</text>
<text x="36" y="454" font-size="20" fill="#1e3f55">司法書士が本人へ直接、売却の</text>
<text x="36" y="482" font-size="20" fill="#1e3f55">意思を確認する</text>
<path d="M200 517v12m-5-5 5 5 5-5" fill="none" stroke="#2e7396" stroke-width="2"/>
<rect x="20" y="531" width="360" height="136" rx="12" fill="#1e4f6b"/>
<text x="36" y="567" font-size="24" font-weight="bold" fill="#fff">決済・登記へ</text>
<text x="36" y="607" font-size="20" font-weight="bold" fill="#fff">代理人が契約と決済に臨み、</text>
<text x="36" y="635" font-size="20" font-weight="bold" fill="#fff">所有権移転登記を行う</text>
<text x="24" y="703" font-size="20" fill="#1e3f55">意思確認ができない場合は成年後見へ。</text>
<text x="24" y="731" font-size="20" fill="#4e7288">出典：法務省・成年後見制度の案内をもとに作成</text>
</g></svg>
