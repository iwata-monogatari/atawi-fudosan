<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">収用の特例は金額・人・日付を照合</title><desc id="desc">収用の5000万円控除について、固定資産と補償内訳、最初の買取り申出日と対象者、年をまたぐ売却と確定申告書類を照合する三段階の図。控除と補償金の総額を区別する。</desc><rect width="800" height="720" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="54" font-size="27" font-weight="bold">収用の特例は金額・人・日付を照合</text><rect x="30" y="90" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="133" r="23" fill="#0e5c8a"/><text x="69" y="142" text-anchor="middle" fill="white" font-size="26">1</text><text x="109" y="140" font-size="27" font-weight="bold">対象と金額</text><text x="109" y="191" font-size="25">固定資産・補償の内訳を確認</text><text x="109" y="230" font-size="23">控除は補償総額ではなく譲渡所得から</text><rect x="30" y="285" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="328" r="23" fill="#0e5c8a"/><text x="69" y="337" text-anchor="middle" fill="white" font-size="26">2</text><text x="109" y="335" font-size="27" font-weight="bold">申出日と対象者</text><text x="109" y="386" font-size="25">最初の申出から6か月を確認</text><text x="109" y="425" font-size="23">死亡による承継は資料を税理士へ</text><rect x="30" y="480" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="523" r="23" fill="#0e5c8a"/><text x="69" y="532" text-anchor="middle" fill="white" font-size="26">3</text><text x="109" y="530" font-size="27" font-weight="bold">年と申告書類</text><text x="109" y="581" font-size="25">同じ事業の年またぎも確認</text><text x="109" y="620" font-size="23">証明書をそろえて確定申告</text><text x="40" y="704" font-size="17">2026年10月21日確認｜本文の出典と個別条件を照合</text></g></svg>