<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">徒歩分数は距離・計算・表示を照合</title><desc id="desc">不動産広告の徒歩分数を、距離の根拠の確認、80メートルで割る計算、端数切上げの順で示す図。460メートルを80で割ると5.75となり、広告には徒歩6分と表示する。</desc><rect width="800" height="720" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="54" font-size="27" font-weight="bold">徒歩分数は距離・計算・表示を照合</text><rect x="30" y="90" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="133" r="23" fill="#0e5c8a"/><text x="69" y="142" text-anchor="middle" fill="white" font-size="26">1</text><text x="109" y="140" font-size="27" font-weight="bold">距離の根拠</text><text x="109" y="191" font-size="25">経路・起点・終点を確認</text><text x="109" y="230" font-size="23">自分の歩いた時間とは分ける</text><rect x="30" y="285" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="328" r="23" fill="#0e5c8a"/><text x="69" y="337" text-anchor="middle" fill="white" font-size="26">2</text><text x="109" y="335" font-size="27" font-weight="bold">80メートルで割る</text><text x="109" y="386" font-size="25">460 ÷ 80 ＝ 5.75</text><text x="109" y="425" font-size="23">1分未満の端数を切り上げる</text><rect x="30" y="480" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="523" r="23" fill="#0e5c8a"/><text x="69" y="532" text-anchor="middle" fill="white" font-size="26">3</text><text x="109" y="530" font-size="27" font-weight="bold">表示は徒歩6分</text><text x="109" y="581" font-size="25">販売図面と掲載サイトを照合</text><text x="109" y="620" font-size="23">複数区画は範囲表示も確認</text><text x="40" y="704" font-size="17">2026年10月22日確認｜本文の出典と個別条件を照合</text></g></svg>