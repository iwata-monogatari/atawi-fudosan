<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">相続の戸籍：請求できる人から窓口を決める</title><desc id="desc">祖父母と父母から本人、子と孫へつながる直系と、本人の配偶者を示す。請求の資格を確認し、磐田市本庁市民課へ行く。代理と郵便の広域交付は対象外。</desc><rect width="960" height="600" rx="24" fill="#f2f9fe"/><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;fill:#1e3f55;font-size:24px}.heading{font-size:32px;font-weight:700;fill:#0e5c8a}.small{font-size:20px}.label{font-size:26px;font-weight:700}</style><text x="44" y="64" class="heading">相続の戸籍：請求できる人から窓口を決める</text>
<path d="M245 185 V405 M245 290 H410" stroke="#2e9bd4" stroke-width="7"/>
<g fill="white" stroke="#cde2f0"><rect x="92" y="110" width="305" height="80" rx="12"/><rect x="92" y="250" width="305" height="80" rx="12"/><rect x="92" y="390" width="305" height="80" rx="12"/><rect x="410" y="250" width="145" height="80" rx="12"/></g>
<text x="139" y="159">父母・祖父母</text><text x="205" y="300" class="label">本人</text><text x="174" y="439">子・孫</text><text x="442" y="300">配偶者</text>
<path d="M565 290 H602" stroke="#0e5c8a" stroke-width="7"/><path d="M588 278 l15 12 -15 12" fill="none" stroke="#0e5c8a" stroke-width="5"/>
<rect x="615" y="170" width="300" height="235" rx="16" fill="#e9f5fc" stroke="#2e9bd4" stroke-width="2"/><text x="648" y="225" class="label">磐田市本庁</text><text x="648" y="268" class="label">市民課へ直接</text><text x="644" y="321" class="small">顔写真付き本人確認書類</text><text x="644" y="360" class="small">本籍地・筆頭者を確認</text>
<text x="50" y="520" class="small">代理・郵便・支所は広域交付の対象外。戸籍の附票も対象外です。</text><text x="44" y="566" class="small">筆者作成の模式図。個別設備・手続・税額の診断を示す図ではありません。</text></svg>