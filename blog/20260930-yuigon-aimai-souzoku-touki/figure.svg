<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">不動産と取得者の特定から司法書士への確認につなぐ図</title><desc id="d">遺言書が見つかったことと、売却の日程を約束できることは別だ。</desc><rect width="800" height="520" fill="#fff"/><style>text{font-family:Yu Gothic,Meiryo,sans-serif;font-size:23px;fill:#1e3f55}.title{font-size:28px;font-weight:bold}.head{font-size:25px;font-weight:bold}.small{font-size:19px}text[fill="white"]{fill:white}</style><text x="40" y="54" class="title">遺言書の原文を、2方向から照合する</text><rect x="270" y="85" width="260" height="64" rx="12" fill="#0e5c8a"/><text x="400" y="126" text-anchor="middle" fill="white" class="head">遺言書の原文</text><path d="M400 149V181H210V208M400 181H590V208" fill="none" stroke="#2e9bd4" stroke-width="4"/><rect x="40" y="210" width="345" height="137" rx="14" fill="#e9f5fc"/><rect x="415" y="210" width="345" height="137" rx="14" fill="#e9f5fc"/><text x="65" y="251" class="head">① どの不動産？</text><text x="65" y="292">土地と建物の資料</text><text x="65" y="324" class="small">候補が複数なら両方を残す</text><text x="440" y="251" class="head">② 誰が取得する？</text><text x="440" y="292">名前・続柄と家族関係</text><text x="440" y="324" class="small">家族の理解は別紙に書く</text><path d="M210 350V372H590V350M400 372V395" fill="none" stroke="#2e9bd4" stroke-width="4"/><text x="400" y="424" text-anchor="middle" class="head">司法書士へ、登記できる内容か確認</text><text x="400" y="475" text-anchor="middle" class="small">家族だけで有効・無効や売却日程を確定しない。</text></svg>