<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">道路の質問は、内容で窓口を分ける</title><desc id="desc">道路台帳で見る路線名と幅員は道路河川課、指定道路については建築住宅課へ確認する担当分担を示す図。地番と図面を用意し、2026年11月2日以後の来庁時間も確認する。</desc><rect width="1000" height="560" rx="22" fill="#e9f5fc"/><g font-family="Yu Gothic,Meiryo,sans-serif"><text x="50" y="70" font-size="20" fill="#16709f">大石浩之の不動産実務メモ</text><text x="50" y="132" font-size="32" font-weight="bold" fill="#0e5c8a">道路の質問は、内容で窓口を分ける</text><rect x="65" y="190" width="370" height="80" rx="15" fill="white" stroke="#cde2f0" stroke-width="2"/><text x="250" y="240" text-anchor="middle" font-size="30" fill="#1e3f55">路線名・幅員</text><path d="M465 230h55m-10-10 10 10-10 10" fill="none" stroke="#2e9bd4" stroke-width="4"/><rect x="555" y="190" width="370" height="80" rx="15" fill="white" stroke="#cde2f0" stroke-width="2"/><text x="740" y="240" text-anchor="middle" font-size="30" fill="#0e5c8a">道路河川課</text><rect x="65" y="305" width="370" height="80" rx="15" fill="white" stroke="#cde2f0" stroke-width="2"/><text x="250" y="355" text-anchor="middle" font-size="30" fill="#1e3f55">指定道路</text><path d="M465 345h55m-10-10 10 10-10 10" fill="none" stroke="#2e9bd4" stroke-width="4"/><rect x="555" y="305" width="370" height="80" rx="15" fill="white" stroke="#cde2f0" stroke-width="2"/><text x="740" y="355" text-anchor="middle" font-size="30" fill="#0e5c8a">建築住宅課</text><rect x="45" y="430" width="910" height="70" rx="14" fill="#0e5c8a"/><text x="500" y="475" text-anchor="middle" font-size="28" fill="white">11月2日から窓口受付 9:00〜16:30</text><text x="950" y="535" text-anchor="end" font-size="16" fill="#4e7288">2026年10月16日確認｜個別判断は専門家へ</text></g></svg>