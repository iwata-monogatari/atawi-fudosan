<svg xmlns="http://www.w3.org/2000/svg" width="400" height="749" viewBox="0 0 400 749" role="img" aria-labelledby="t d">
<title id="t">検査済証がないとき</title>
<desc id="d">概要書と台帳記載事項証明で履歴を確かめ、買主へ契約前に説明する。</desc>
<rect width="400" height="749" rx="18" fill="#eef3f7"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#1e4f6b">検査済証がないとき</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#7da7bb"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#1e4f6b">履歴を調べる</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">建築計画概要書の閲覧で、</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">確認済証の番号と日付を見る</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#2e7396" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#7da7bb"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#1e4f6b">証明を取る</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">台帳記載事項証明書で、完了</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">検査の履歴を書面にする</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#2e7396" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#fff" stroke="#7da7bb"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#1e4f6b">先に説明する</text>
<text x="36" y="454" font-size="20" fill="#1e3f55">検査済証がない事実と、ローン</text>
<text x="36" y="482" font-size="20" fill="#1e3f55">への影響を買主へ伝える</text>
<path d="M200 517v12m-5-5 5 5 5-5" fill="none" stroke="#2e7396" stroke-width="2"/>
<rect x="20" y="531" width="360" height="136" rx="12" fill="#1e4f6b"/>
<text x="36" y="567" font-size="24" font-weight="bold" fill="#fff">契約へ進む</text>
<text x="36" y="607" font-size="20" font-weight="bold" fill="#fff">説明した内容を書面に残し、</text>
<text x="36" y="635" font-size="20" font-weight="bold" fill="#fff">売買契約を結ぶ</text>
<text x="24" y="703" font-size="20" fill="#1e3f55">再発行は不可、履歴の証明で補う。</text>
<text x="24" y="731" font-size="20" fill="#4e7288">出典：国土交通省・建築基準法の案内をもとに作成</text>
</g></svg>
