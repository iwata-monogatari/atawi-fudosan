<svg xmlns="http://www.w3.org/2000/svg" width="400" height="749" viewBox="0 0 400 749" role="img" aria-labelledby="t d">
<title id="t">定期借地権の売却</title>
<desc id="d">契約の種類と残存期間を確認し、地主の譲渡承諾と承諾料を確かめ、満了時の更地返還を前提に価格を置く。</desc>
<rect width="400" height="749" rx="18" fill="#f4f2fa"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#4a3a8c">定期借地権の売却</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#a493d6"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#4a3a8c">契約の種類を確認</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">一般定期か事業用か</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">契約書と公正証書を見る</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#5d4ba8" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#a493d6"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#4a3a8c">残存期間を数える</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">満了で更地返還が前提</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">残りが価格の土台になる</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#5d4ba8" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#fff" stroke="#a493d6"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#4a3a8c">地主の承諾を取る</text>
<text x="36" y="454" font-size="20" fill="#1e3f55">譲渡承諾と承諾料を</text>
<text x="36" y="482" font-size="20" fill="#1e3f55">売り出し前に確かめる</text>
<path d="M200 517v12m-5-5 5 5 5-5" fill="none" stroke="#5d4ba8" stroke-width="2"/>
<rect x="20" y="531" width="360" height="136" rx="12" fill="#4a3a8c"/>
<text x="36" y="567" font-size="24" font-weight="bold" fill="#fff">ローンの可否も見る</text>
<text x="36" y="607" font-size="20" font-weight="bold" fill="#fff">残存期間が短いと</text>
<text x="36" y="635" font-size="20" font-weight="bold" fill="#fff">買主の融資が絞られる</text>
<text x="24" y="703" font-size="20" fill="#1e3f55">更新なし・買取請求なしが原則</text>
<text x="24" y="731" font-size="20" fill="#4e7288">出典：借地借家法11月確認</text>
</g></svg>
