<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 560" role="img" aria-labelledby="title desc"><title id="title">登録した後にも、二つの確認</title><desc id="desc">磐田市の固定資産税をWeb口座振替にする三段階。納税通知書と口座情報を準備して申し込み、受付結果メールを保存して開始期を確認し、振替日には通帳で実際の引落しを確かめる。</desc><rect width="320" height="560" fill="white"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="16" y="32" font-size="20" font-weight="bold">登録した後にも、二つの確認</text><rect x="12" y="100" width="296" height="112" rx="12" fill="#e9f5fc"/><text x="26" y="129" font-size="19" font-weight="bold">1 申し込む</text><text x="26" y="159" font-size="16">納税通知書と口座情報を準備</text><rect x="12" y="230" width="296" height="112" rx="12" fill="#e9f5fc"/><text x="26" y="259" font-size="19" font-weight="bold">2 受付を確かめる</text><text x="26" y="289" font-size="16">結果メールを保存・開始期を確認</text><rect x="12" y="360" width="296" height="112" rx="12" fill="#e9f5fc"/><text x="26" y="389" font-size="19" font-weight="bold">3 支払いを確かめる</text><text x="26" y="419" font-size="16">振替日に通帳で引落しを確認</text><text x="16" y="515" font-size="16">出典：本文末の一次情報</text><text x="16" y="541" font-size="16">2026年11月7日確認／大石浩之</text></g></svg>