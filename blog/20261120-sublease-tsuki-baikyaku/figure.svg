<svg xmlns="http://www.w3.org/2000/svg" width="400" height="749" viewBox="0 0 400 749" role="img" aria-labelledby="t d">
<title id="t">サブリース付き売却の確認点</title>
<desc id="d">残り期間、家賃見直し条項、解約条項を契約書で確かめ、地位承継の手続きを管理会社とそろえて売る。</desc>
<rect width="400" height="749" rx="18" fill="#eef2fa"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#2b4d8f">サブリース付き売却の確認点</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#849fd0"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#2b4d8f">残り期間を見る</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">契約期間と更新条件を</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">契約書で確かめる</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#3a5fa3" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#849fd0"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#2b4d8f">家賃条項を読む</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">見直し・減額条項の有無と</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">次回見直し時期を確認</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#3a5fa3" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#fff" stroke="#849fd0"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#2b4d8f">解約条項を読む</text>
<text x="36" y="454" font-size="20" fill="#1e3f55">オーナー側解約の条件と</text>
<text x="36" y="482" font-size="20" fill="#1e3f55">違約金の定めを確認</text>
<path d="M200 517v12m-5-5 5 5 5-5" fill="none" stroke="#3a5fa3" stroke-width="2"/>
<rect x="20" y="531" width="360" height="136" rx="12" fill="#2b4d8f"/>
<text x="36" y="567" font-size="24" font-weight="bold" fill="#fff">承継をそろえる</text>
<text x="36" y="607" font-size="20" font-weight="bold" fill="#fff">買主への地位承継手続きを</text>
<text x="36" y="635" font-size="20" font-weight="bold" fill="#fff">管理会社と事前に確認</text>
<text x="24" y="703" font-size="20" fill="#1e3f55">契約書の3条項が、価格を決める</text>
<text x="24" y="731" font-size="20" fill="#4e7288">出典：サブリース契約実務・借地借家法11月確認</text>
</g></svg>
