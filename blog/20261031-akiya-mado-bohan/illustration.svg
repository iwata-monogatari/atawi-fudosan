<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">空き家の窓防犯、二つの役割</title><desc id="desc">補助錠は取付けと施錠、フィルムはガラスとの適合と全面施工を確認する比較図。実製品の施工位置を指定する図ではない。</desc><rect width="960" height="600" rx="24" fill="#f2f9fe"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#1e3f55"><text x="480" y="60" text-anchor="middle" font-size="32" font-weight="bold">窓の防犯は、役割と施工条件で比べる</text><rect x="36" y="90" width="432" height="390" rx="18" fill="white" stroke="#cde2f0"/><rect x="492" y="90" width="432" height="390" rx="18" fill="white" stroke="#cde2f0"/><text x="252" y="140" text-anchor="middle" font-size="28" font-weight="bold">補助錠</text><text x="708" y="140" text-anchor="middle" font-size="28" font-weight="bold">防犯フィルム</text><g stroke="#446d84" stroke-width="8"><rect x="142" y="170" width="220" height="200" fill="#e9f5fc"/><path d="M252 170V370"/><rect x="598" y="170" width="220" height="200" fill="white"/><path d="M708 170V370"/></g><g fill="#8acbe8" fill-opacity=".6" stroke="#16709f" stroke-width="2"><rect x="607" y="180" width="92" height="180"/><rect x="717" y="180" width="92" height="180"/></g><rect x="236" y="260" width="32" height="20" rx="4" fill="#708a99"/><rect x="230" y="205" width="44" height="30" rx="6" fill="#16709f"/><path d="M274 220H325" stroke="#16709f" stroke-width="3"/><text x="252" y="415" text-anchor="middle" font-size="23">取付けられるか・施錠できるか</text><text x="252" y="450" text-anchor="middle" font-size="20">固定方法と開閉後の確認</text><text x="708" y="415" text-anchor="middle" font-size="23">適合するか・全面施工か</text><text x="708" y="450" text-anchor="middle" font-size="20">製品名だけでなく貼る範囲</text><text x="480" y="528" text-anchor="middle" font-size="25" font-weight="bold">どちらも、侵入を完全に防ぐ保証ではありません</text><text x="480" y="567" text-anchor="middle" font-size="19">模式図です。実際の施工方法はメーカー・施工業者に確認してください。</text></g></svg>