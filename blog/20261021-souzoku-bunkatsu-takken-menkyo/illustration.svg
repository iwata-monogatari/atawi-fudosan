<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">相続取得だけで免許不要と決めない</title><desc id="desc">相続土地を区画に分けて売る前に、販売計画を記録し、国土交通省の五つの判断項目と照合し、分筆等の費用を支払う前に免許担当窓口へ確認する流れを示す図。</desc><rect width="800" height="720" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="54" font-size="27" font-weight="bold">相続取得だけで免許不要と決めない</text><rect x="30" y="90" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="133" r="23" fill="#0e5c8a"/><text x="69" y="142" text-anchor="middle" fill="white" font-size="26">1</text><text x="109" y="140" font-size="27" font-weight="bold">販売計画を書く</text><text x="109" y="191" font-size="25">何区画を、誰へ、誰が売るか</text><text x="109" y="230" font-size="23">相続は総合判断の一要素</text><rect x="30" y="285" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="328" r="23" fill="#0e5c8a"/><text x="69" y="337" text-anchor="middle" fill="white" font-size="26">2</text><text x="109" y="335" font-size="27" font-weight="bold">5項目を照合</text><text x="109" y="386" font-size="25">対象者・目的・取得経緯を整理</text><text x="109" y="425" font-size="23">取引態様・反復継続性も確認</text><rect x="30" y="480" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="523" r="23" fill="#0e5c8a"/><text x="69" y="532" text-anchor="middle" fill="white" font-size="26">3</text><text x="109" y="530" font-size="27" font-weight="bold">費用を払う前に相談</text><text x="109" y="581" font-size="25">免許担当窓口へ具体案を示す</text><text x="109" y="620" font-size="23">仲介依頼だけで解決と判断しない</text><text x="40" y="704" font-size="17">2026年10月21日確認｜本文の出典と個別条件を照合</text></g></svg>