<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640"><rect width="960" height="640" rx="24" fill="#eef7fb"/><g font-family="sans-serif" fill="#15546b"><text x="48" y="65" font-size="32" font-weight="bold">自宅の夫婦間贈与　決める前の4確認</text><text x="48" y="105" font-size="22">最高2000万円の控除額だけで、名義変更を決めない</text><rect x="40" y="140" width="880" height="95" rx="12" fill="white"/><text x="65" y="184" font-size="32" font-weight="bold">1</text><text x="125" y="176" font-size="26" font-weight="bold">婚姻期間20年以上</text><text x="125" y="212" font-size="21">婚姻日と贈与予定日を確認</text><rect x="40" y="250" width="880" height="95" rx="12" fill="white"/><text x="65" y="294" font-size="32" font-weight="bold">2</text><text x="125" y="286" font-size="26" font-weight="bold">対象は居住用不動産等</text><text x="125" y="322" font-size="21">土地・建物・取得資金の内容を確認</text><rect x="40" y="360" width="880" height="95" rx="12" fill="white"/><text x="65" y="404" font-size="32" font-weight="bold">3</text><text x="125" y="396" font-size="26" font-weight="bold">2027年3月15日までの実際の居住</text><text x="125" y="432" font-size="21">2026年贈与の例。その後も住み続ける見込みが必要</text><rect x="40" y="470" width="880" height="95" rx="12" fill="white"/><text x="65" y="514" font-size="32" font-weight="bold">4</text><text x="125" y="506" font-size="26" font-weight="bold">必要書類を添えて贈与税を申告</text><text x="125" y="542" font-size="21">同じ配偶者からの利用は一生に一度</text><text x="48" y="610" font-size="18">国税庁No.4452に基づく整理／2026年10月確認。個別判断は税理士等へ。</text></g></svg>