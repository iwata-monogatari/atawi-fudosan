<svg xmlns="http://www.w3.org/2000/svg" width="400" height="749" viewBox="0 0 400 749" role="img" aria-labelledby="t d">
<title id="t">定期借家の節目の手順</title>
<desc id="d">終了通知の時期を押さえ、再契約は新しい契約として結び直し、中途解約は法律と特約の範囲で読む。</desc>
<rect width="400" height="749" rx="18" fill="#eef2fa"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#2b4d8f">定期借家の節目の手順</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#849fd0"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#2b4d8f">終了通知を出す</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">期間1年以上は満了の1年前から</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">6か月前までに通知が必要</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#3a5fa3" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#849fd0"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#2b4d8f">再契約を結ぶ</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">更新ではなく新しい契約として</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">書面と事前説明をやり直す</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#3a5fa3" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#fff" stroke="#849fd0"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#2b4d8f">中途解約を読む</text>
<text x="36" y="454" font-size="20" fill="#1e3f55">原則は不可。やむを得ない事情の</text>
<text x="36" y="482" font-size="20" fill="#1e3f55">借主解約権と特約を確認</text>
<path d="M200 517v12m-5-5 5 5 5-5" fill="none" stroke="#3a5fa3" stroke-width="2"/>
<rect x="20" y="531" width="360" height="136" rx="12" fill="#2b4d8f"/>
<text x="36" y="567" font-size="24" font-weight="bold" fill="#fff">売却と合わせる</text>
<text x="36" y="607" font-size="20" font-weight="bold" fill="#fff">満了・再契約の時期が</text>
<text x="36" y="635" font-size="20" font-weight="bold" fill="#fff">買主への引き渡し条件になる</text>
<text x="24" y="703" font-size="20" fill="#1e3f55">再契約は、条件を見直せる唯一の節目</text>
<text x="24" y="731" font-size="20" fill="#4e7288">出典：借地借家法第38条11月確認</text>
</g></svg>
