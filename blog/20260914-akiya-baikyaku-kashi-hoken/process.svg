<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="t d"><title id="t">空き家売却の瑕疵保険、加入前の3確認</title><desc id="d">対象部位、免責、費用負担を確かめてから、売買契約と保証書を照合する。</desc><rect width="1000" height="420" rx="20" fill="#e9f5fc"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="53" font-size="29" font-weight="700">保証の名前より、残る負担を確認する</text><g fill="#fff" stroke="#cde2f0" stroke-width="2"><rect x="35" y="85" width="290" height="215" rx="14"/><rect x="355" y="85" width="290" height="215" rx="14"/><rect x="675" y="85" width="290" height="215" rx="14"/></g><g fill="#0e5c8a" font-size="28" font-weight="700"><text x="58" y="130">1 対象部位</text><text x="378" y="130">2 免責</text><text x="698" y="130">3 費用負担</text></g><g font-size="22"><text x="58" y="179">構造・雨水が基本</text><text x="58" y="222">設備は条件を確認</text><text x="58" y="265">原因でも判断が変わる</text><text x="378" y="179">対象外の損害</text><text x="378" y="222">差し引く免責金額</text><text x="378" y="265">期間と支払上限</text><text x="698" y="179">保険料・検査料</text><text x="698" y="222">加入前の修理代</text><text x="698" y="265">誰が負担するか</text></g><rect x="100" y="328" width="800" height="62" rx="12" fill="#0e5c8a"/><text x="500" y="368" text-anchor="middle" fill="white" font-size="26">最後に、売買契約と保証書を照合する</text></g></svg>
