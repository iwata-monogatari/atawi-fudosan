<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600" role="img" aria-labelledby="t d">
<title id="t">2026年分の所得税等</title>
<desc id="d">通常の納期限：2027年3月15日。先に納付：納める税額の半分以上。延納の期限：2027年5月31日</desc>
<rect width="400" height="600" rx="18" fill="#f2f9fe"/>
<text x="24" y="44" font-family="Yu Gothic,Meiryo,sans-serif" font-size="25" font-weight="bold" fill="#0e5c8a">2026年分の所得税等</text>
<rect x="20" y="72" width="360" height="108" rx="12" fill="#fff" stroke="#2e9bd4"/>
<text x="36" y="108" font-family="Yu Gothic,Meiryo,sans-serif" font-size="24" font-weight="bold" fill="#0e5c8a">通常の納期限</text>
<text x="36" y="148" font-family="Yu Gothic,Meiryo,sans-serif" font-size="20" fill="#1e3f55">2027年3月15日</text>
<path d="M200 183v12m-5-5 5 5 5-5" fill="none" stroke="#16709f" stroke-width="2"/>
<rect x="20" y="198" width="360" height="108" rx="12" fill="#fff" stroke="#2e9bd4"/>
<text x="36" y="234" font-family="Yu Gothic,Meiryo,sans-serif" font-size="24" font-weight="bold" fill="#0e5c8a">先に納付</text>
<text x="36" y="274" font-family="Yu Gothic,Meiryo,sans-serif" font-size="20" fill="#1e3f55">納める税額の半分以上</text>
<path d="M200 309v12m-5-5 5 5 5-5" fill="none" stroke="#16709f" stroke-width="2"/>
<rect x="20" y="324" width="360" height="108" rx="12" fill="#fff" stroke="#2e9bd4"/>
<text x="36" y="360" font-family="Yu Gothic,Meiryo,sans-serif" font-size="24" font-weight="bold" fill="#0e5c8a">延納の期限</text>
<text x="36" y="400" font-family="Yu Gothic,Meiryo,sans-serif" font-size="20" fill="#1e3f55">2027年5月31日</text>
<text x="24" y="482" font-family="Yu Gothic,Meiryo,sans-serif" font-size="20" fill="#1e3f55">振替納税は振替日が基準</text>
<text x="24" y="510" font-family="Yu Gothic,Meiryo,sans-serif" font-size="20" fill="#1e3f55">延納には利子税もかかる</text>
<text x="24" y="552" font-family="Yu Gothic,Meiryo,sans-serif" font-size="20" fill="#4e7288">出典：国税庁</text><text x="24" y="582" font-family="Yu Gothic,Meiryo,sans-serif" font-size="20" fill="#4e7288">2026年11月確認</text></svg>