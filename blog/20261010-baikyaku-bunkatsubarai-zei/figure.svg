<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510"><rect width="1080" height="510" rx="24" fill="#e9f5fc"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="54" y="75" font-size="32" font-weight="bold">仮の売却代金1,200万円の受け取り方</text><rect x="45" y="130" width="310" height="235" rx="18" fill="white" stroke="#2E9BD4" stroke-width="2"/><circle cx="90" cy="178" r="23" fill="#0e5c8a"/><text x="90" y="187" text-anchor="middle" fill="white" font-size="24">1</text><text x="69" y="253" font-size="27" font-weight="bold">譲渡した年</text><text x="69" y="306" font-size="21">入金600万円（仮定）</text><rect x="385" y="130" width="310" height="235" rx="18" fill="white" stroke="#2E9BD4" stroke-width="2"/><circle cx="430" cy="178" r="23" fill="#0e5c8a"/><text x="430" y="187" text-anchor="middle" fill="white" font-size="24">2</text><text x="409" y="253" font-size="27" font-weight="bold">翌年</text><text x="409" y="306" font-size="21">入金600万円（仮定）</text><rect x="725" y="130" width="310" height="235" rx="18" fill="white" stroke="#2E9BD4" stroke-width="2"/><circle cx="770" cy="178" r="23" fill="#0e5c8a"/><text x="770" y="187" text-anchor="middle" fill="white" font-size="24">3</text><text x="749" y="253" font-size="27" font-weight="bold">税務上の収入</text><text x="749" y="306" font-size="21">譲渡年に1,200万円</text><text x="54" y="433" font-size="23">資料を分けて確認し、個別の判断は専門家へ</text><text x="54" y="476" font-size="18">大石浩之｜ATAWI FUDOSAN｜記事内容を整理した図解</text></g></svg>