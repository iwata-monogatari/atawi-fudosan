<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img"><title>安全な距離から記録 → 市・県へ相談／投棄中は警察 → 処分範囲と費用の確認</title><rect width="960" height="430" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic, Meiryo, sans-serif"><text x="35" y="59" font-size="31" fill="#0e5c8a" font-weight="700">磐田市の空き家：処分を頼む前に</text><rect x="35" y="112" width="270" height="214" rx="16" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="73" cy="152" r="22" fill="#0e5c8a"/><text x="66" y="161" font-size="25" fill="white" font-weight="700">1</text><text x="57" y="209" font-size="25" fill="#0e5c8a" font-weight="700">安全な場所から記録</text><text x="57" y="251" font-size="21" fill="#1e3f55" font-weight="400">場所・ごみの種類と量</text><text x="57" y="284" font-size="21" fill="#1e3f55" font-weight="400">写真・発見した日時</text><rect x="345" y="112" width="270" height="214" rx="16" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="383" cy="152" r="22" fill="#0e5c8a"/><text x="376" y="161" font-size="25" fill="white" font-weight="700">2</text><text x="367" y="209" font-size="25" fill="#0e5c8a" font-weight="700">市・県へ相談</text><text x="367" y="251" font-size="21" fill="#1e3f55" font-weight="400">投棄中なら警察へ</text><text x="367" y="284" font-size="21" fill="#1e3f55" font-weight="400">処分前の注意を聞く</text><rect x="655" y="112" width="270" height="214" rx="16" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="693" cy="152" r="22" fill="#0e5c8a"/><text x="686" y="161" font-size="25" fill="white" font-weight="700">3</text><text x="677" y="209" font-size="25" fill="#0e5c8a" font-weight="700">範囲と費用を確認</text><text x="677" y="251" font-size="21" fill="#1e3f55" font-weight="400">元の家財と分ける</text><text x="677" y="284" font-size="21" fill="#1e3f55" font-weight="400">見積り・日程・承認者</text><text x="311" y="233" font-size="29" fill="#1e3f55" font-weight="400">→</text><text x="621" y="233" font-size="29" fill="#1e3f55" font-weight="400">→</text><text x="35" y="382" font-size="23" fill="#1e3f55" font-weight="400">私有地の処理は原則として所有者・管理者。通報と回収は別です。</text></g></svg>