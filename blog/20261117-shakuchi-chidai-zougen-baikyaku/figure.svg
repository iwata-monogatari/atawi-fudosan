<svg xmlns="http://www.w3.org/2000/svg" width="400" height="749" viewBox="0 0 400 749" role="img" aria-labelledby="t d">
<title id="t">地代増減の確認点</title>
<desc id="d">税金と土地価格と近傍相場の3点を見て、増減請求の要件に当たるかを見て、協議と調停の順に進め、改定履歴を売却の資料に残す。</desc>
<rect width="400" height="749" rx="18" fill="#eef7f2"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#1e6b4a">地代増減の確認点</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#7dbb9c"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#1e6b4a">変動の3点を見る</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">租税公課、土地価格、</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">近傍の地代と比べる</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#2e8c63" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#7dbb9c"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#1e6b4a">特約を確認する</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">一定期間増額しない特約が</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">あれば増額請求はできない</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#2e8c63" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#fff" stroke="#7dbb9c"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#1e6b4a">協議から始める</text>
<text x="36" y="454" font-size="20" fill="#1e3f55">協議が整わなければ</text>
<text x="36" y="482" font-size="20" fill="#1e3f55">調停を申し立てる</text>
<path d="M200 517v12m-5-5 5 5 5-5" fill="none" stroke="#2e8c63" stroke-width="2"/>
<rect x="20" y="531" width="360" height="136" rx="12" fill="#1e6b4a"/>
<text x="36" y="567" font-size="24" font-weight="bold" fill="#fff">履歴を資料にする</text>
<text x="36" y="607" font-size="20" font-weight="bold" fill="#fff">改定の経緯と次回条件が</text>
<text x="36" y="635" font-size="20" font-weight="bold" fill="#fff">売却の説明資料になる</text>
<text x="24" y="703" font-size="20" fill="#1e3f55">請求の効力は将来に向かって生じる</text>
<text x="24" y="731" font-size="20" fill="#4e7288">出典：借地借家法11月確認</text>
</g></svg>
