<svg xmlns="http://www.w3.org/2000/svg" width="400" height="749" viewBox="0 0 400 749" role="img" aria-labelledby="t d">
<title id="t">定期借家の確認点</title>
<desc id="d">契約書面と事前説明の有無を見て、残り期間と終了通知の時期を確かめ、買主の使い方に合わせて売り方を選ぶ。</desc>
<rect width="400" height="749" rx="18" fill="#eef7f2"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#1e6b4a">定期借家の確認点</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#7dbb9c"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#1e6b4a">書面の要件を見る</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">公正証書などの契約書と</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">事前説明書面の写しをそろえる</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#2e8c63" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#7dbb9c"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#1e6b4a">残り期間を数える</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">満了まで何年あるかが</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">買主の層と価格を分ける</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#2e8c63" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#fff" stroke="#7dbb9c"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#1e6b4a">終了通知の時期を見る</text>
<text x="36" y="454" font-size="20" fill="#1e3f55">期間1年以上は満了の</text>
<text x="36" y="482" font-size="20" fill="#1e3f55">1年前から6か月前までに通知</text>
<path d="M200 517v12m-5-5 5 5 5-5" fill="none" stroke="#2e8c63" stroke-width="2"/>
<rect x="20" y="531" width="360" height="136" rx="12" fill="#1e6b4a"/>
<text x="36" y="567" font-size="24" font-weight="bold" fill="#fff">売り方を選ぶ</text>
<text x="36" y="607" font-size="20" font-weight="bold" fill="#fff">賃貸中か、満了後の</text>
<text x="36" y="635" font-size="20" font-weight="bold" fill="#fff">空家かで進め方が変わる</text>
<text x="24" y="703" font-size="20" fill="#1e3f55">定期借家は更新がなく期間満了で終了する</text>
<text x="24" y="731" font-size="20" fill="#4e7288">出典：借地借家法11月確認</text>
</g></svg>
