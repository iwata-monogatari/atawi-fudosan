<svg xmlns="http://www.w3.org/2000/svg" width="400" height="596" viewBox="0 0 400 596" role="img" aria-labelledby="t d">
<title id="t">都市計画税のポイント</title>
<desc id="d">課税は市街化区域内の土地・家屋、税率は条例で上限0.3％、固定資産税と一緒に通知される。</desc>
<rect width="400" height="596" rx="18" fill="#f2efe9"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#6b4f1e">都市計画税のポイント</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#bba87d"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#6b4f1e">課税される場所</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">市街化区域内の土地と家屋</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">市街化調整区域は原則対象外</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#96762e" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#bba87d"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#6b4f1e">税率と使い道</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">条例で決定、上限は0.3％</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">都市計画事業・区画整理の財源</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#96762e" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#6b4f1e"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#fff">通知と納付</text>
<text x="36" y="454" font-size="20" font-weight="bold" fill="#fff">固定資産税と合算で通知される</text>
<text x="36" y="482" font-size="20" font-weight="bold" fill="#fff">納期も固定資産税と同時期</text>
<text x="24" y="550" font-size="20" fill="#1e3f55">区域区分は都市計画図で確認できます。</text>
<text x="24" y="578" font-size="20" fill="#4e7288">出典：総務省「地方税制度」ほか</text>
</g></svg>
