<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">セットバックの表示は二段階で確認</title><desc id="desc">セットバックが必要な土地では10％未満でもその旨を表示し、おおむね10％以上なら後退部分の面積も表示するという二段階の確認と、道路・後退線・面積の根拠の照合を示した説明図。</desc><rect width="800" height="720" rx="16" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="30" y="52" font-size="26" font-weight="bold">セットバックの表示は二段階で確認</text><rect x="25" y="85" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="128" r="23" fill="#0e5c8a"/><text x="62" y="137" text-anchor="middle" fill="white" font-size="26">1</text><text x="102" y="136" font-size="27" font-weight="bold">後退が必要な土地</text><text x="45" y="190" font-size="26">セットバックを要する旨を表示</text><text x="45" y="231" font-size="23">10％未満でも省略できない</text><rect x="25" y="280" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="323" r="23" fill="#0e5c8a"/><text x="62" y="332" text-anchor="middle" fill="white" font-size="26">2</text><text x="102" y="331" font-size="27" font-weight="bold">おおむね10％以上</text><text x="45" y="385" font-size="26">後退が必要な旨に加えて面積も表示</text><text x="45" y="426" font-size="23">例：土地100.55㎡、後退12㎡要</text><rect x="25" y="475" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="518" r="23" fill="#0e5c8a"/><text x="62" y="527" text-anchor="middle" fill="white" font-size="26">3</text><text x="102" y="526" font-size="27" font-weight="bold">売出し前に照合</text><text x="45" y="580" font-size="26">道路の種類・後退線・面積の根拠</text><text x="45" y="621" font-size="23">個別の線や数値は現地資料で確認</text><text x="30" y="702" font-size="17">2026年10月26日確認｜個別条件と本文の出典を照合</text></g></svg>