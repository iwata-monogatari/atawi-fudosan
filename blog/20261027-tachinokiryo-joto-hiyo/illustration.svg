<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">立退料は支払目的から整理</title><desc id="desc">国税庁の立退料の4区分を、売却目的の譲渡費用、賃貸運営に関する必要経費、取得時の取得費、借地権の買戻しによる土地の取得費に分けて示す説明図。具体的な支出の区分は税理士へ確認する。</desc><rect width="800" height="720" rx="16" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="30" y="52" font-size="26" font-weight="bold">立退料は支払目的から整理</text><rect x="25" y="85" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="128" r="23" fill="#0e5c8a"/><text x="62" y="137" text-anchor="middle" fill="white" font-size="26">1</text><text x="102" y="136" font-size="27" font-weight="bold">貸家などを売るため</text><text x="45" y="190" font-size="26">譲渡所得の計算で控除する費用</text><text x="45" y="231" font-size="23">売却以外の支払と区別する</text><rect x="25" y="280" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="323" r="23" fill="#0e5c8a"/><text x="62" y="332" text-anchor="middle" fill="white" font-size="26">2</text><text x="102" y="331" font-size="27" font-weight="bold">賃貸運営／不動産の取得</text><text x="45" y="385" font-size="26">賃貸運営は必要経費となる場合</text><text x="45" y="426" font-size="23">取得時の支払は取得費等へ</text><rect x="25" y="475" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="518" r="23" fill="#0e5c8a"/><text x="62" y="527" text-anchor="middle" fill="white" font-size="26">3</text><text x="102" y="526" font-size="27" font-weight="bold">借地人の建物がある土地</text><text x="45" y="580" font-size="26">通常は借地権の買戻し対価</text><text x="45" y="621" font-size="23">土地の取得費として扱う説明</text><text x="30" y="702" font-size="17">2026年10月27日確認｜個別条件と本文の出典を照合</text></g></svg>