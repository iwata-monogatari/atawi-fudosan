<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">静岡県の中古戸建て在庫を読む</title><desc id="desc">中部圏不動産流通機構の資料から静岡県の中古戸建て在庫を比較した図。2025年9月は3598件、2026年8月は3978件、2026年9月は3975件。2026年9月は前年同月より377件増加、前月より3件減少。在庫の全件が長期の売れ残りという意味ではない。</desc><rect width="800" height="720" rx="16" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="30" y="52" font-size="26" font-weight="bold">静岡県の中古戸建て在庫を読む</text><rect x="25" y="85" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="128" r="23" fill="#0e5c8a"/><text x="62" y="137" text-anchor="middle" fill="white" font-size="26">1</text><text x="102" y="136" font-size="27" font-weight="bold">2026年9月の在庫</text><text x="45" y="190" font-size="26">3,975件</text><text x="45" y="231" font-size="23">成約件数は別の欄：81件</text><rect x="25" y="280" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="323" r="23" fill="#0e5c8a"/><text x="62" y="332" text-anchor="middle" fill="white" font-size="26">2</text><text x="102" y="331" font-size="27" font-weight="bold">前年同月と比較</text><text x="45" y="385" font-size="26">3,598件 → 3,975件</text><text x="45" y="426" font-size="23">377件増／約10.5％増</text><rect x="25" y="475" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="518" r="23" fill="#0e5c8a"/><text x="62" y="527" text-anchor="middle" fill="white" font-size="26">3</text><text x="102" y="526" font-size="27" font-weight="bold">前月と比較</text><text x="45" y="580" font-size="26">3,978件 → 3,975件</text><text x="45" y="621" font-size="23">3件減／売出期間はこの表にない</text><text x="30" y="702" font-size="17">2026年10月28日確認｜個別条件と本文の出典を照合</text></g></svg>