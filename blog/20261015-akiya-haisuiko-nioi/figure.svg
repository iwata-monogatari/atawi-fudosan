<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">排水口の臭いは、封水と破損を分けて確認</title><desc id="desc">左に封水をためる曲がった排水管、右に漏れの確認と設備業者への相談手順を示す。実物の形状を再現したものではない。</desc><rect width="960" height="600" rx="24" fill="#f2f9fe"/><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;fill:#1e3f55;font-size:24px}.heading{font-size:32px;font-weight:700;fill:#0e5c8a}.small{font-size:20px}.label{font-size:26px;font-weight:700}</style><text x="44" y="64" class="heading">排水口の臭いは、封水と破損を分けて確認</text>
<rect x="42" y="100" width="420" height="410" rx="16" fill="white" stroke="#cde2f0"/><text x="72" y="148" class="label">封水：臭いを遮る水</text>
<path d="M160 192 V336 A60 60 0 0 0 280 336 V254 H383" fill="none" stroke="#91b3c6" stroke-width="64"/><path d="M160 192 V336 A60 60 0 0 0 280 336 V254 H383" fill="none" stroke="white" stroke-width="42"/>
<path d="M160 324 V336 A60 60 0 0 0 280 336 V324" fill="none" stroke="#2e9bd4" stroke-width="40"/><text x="76" y="450" class="small">水が保たれている状態のイメージ</text><text x="76" y="481" class="small">通水できる状態かを先に確認</text>
<rect x="490" y="100" width="428" height="410" rx="16" fill="white" stroke="#cde2f0"/><text x="520" y="148" class="label">漏れ・割れ・臭いの再発</text>
<path d="M558 210 H844" stroke="#91b3c6" stroke-width="58"/><path d="M705 178 l-14 24 22 18 -18 23" fill="none" stroke="#bd6745" stroke-width="7"/><path d="M705 263 q-23 26 0 30 q23 -4 0 -30" fill="#2e9bd4"/>
<text x="522" y="350">無理に分解しない</text><text x="522" y="390">場所と状態を記録する</text><text x="522" y="430">設備業者へ診断を依頼</text><text x="522" y="479" class="small">清掃と補修は別に見積りを確認</text><text x="44" y="566" class="small">筆者作成の模式図。個別設備・手続・税額の診断を示す図ではありません。</text></svg>