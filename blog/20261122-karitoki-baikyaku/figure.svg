<svg xmlns="http://www.w3.org/2000/svg" width="400" height="749" viewBox="0 0 400 749" role="img" aria-labelledby="t d">
<title id="t">仮登記の確認手順</title>
<desc id="d">登記で仮登記の種類と権利者を見て、請求権の現状を確かめ、承諾を得て抹消し、消してから売る。</desc>
<rect width="400" height="749" rx="18" fill="#f5f0f8"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#5f3d80">仮登記の確認手順</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#a68cc4"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#5f3d80">登記簿を見る</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">仮登記の種類と権利者・</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">原因を確認する</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#7d5aa0" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#a68cc4"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#5f3d80">現状を確かめる</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">予約などの請求権が今も</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">残っているかを確認する</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#7d5aa0" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#fff" stroke="#a68cc4"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#5f3d80">承諾を得る</text>
<text x="36" y="454" font-size="20" fill="#1e3f55">権利者（相続人を含む）の</text>
<text x="36" y="482" font-size="20" fill="#1e3f55">抹消への協力を得る</text>
<path d="M200 517v12m-5-5 5 5 5-5" fill="none" stroke="#7d5aa0" stroke-width="2"/>
<rect x="20" y="531" width="360" height="136" rx="12" fill="#5f3d80"/>
<text x="36" y="567" font-size="24" font-weight="bold" fill="#fff">消してから売る</text>
<text x="36" y="607" font-size="20" font-weight="bold" fill="#fff">抹消登記を済ませ、契約の</text>
<text x="36" y="635" font-size="20" font-weight="bold" fill="#fff">条件に反映して売る</text>
<text x="24" y="703" font-size="20" fill="#1e3f55">本登記で順位が生きる。先に消す。</text>
<text x="24" y="731" font-size="20" fill="#4e7288">出典：不動産登記法第105条・第106条をもとに作成</text>
</g></svg>
