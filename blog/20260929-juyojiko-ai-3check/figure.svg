<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img"><title>調査根拠 → 宅建士の確認 → 訂正・再共有という人の確認経路</title><rect width="960" height="430" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic, Meiryo, sans-serif"><text x="35" y="59" font-size="31" fill="#0e5c8a" font-weight="700">重要事項説明にAI：売主から3つの質問</text><rect x="35" y="112" width="270" height="214" rx="16" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="73" cy="152" r="22" fill="#0e5c8a"/><text x="66" y="161" font-size="25" fill="white" font-weight="700">1</text><text x="57" y="209" font-size="25" fill="#0e5c8a" font-weight="700">調査の根拠は？</text><text x="57" y="251" font-size="21" fill="#1e3f55" font-weight="400">資料名と確認日</text><text x="57" y="284" font-size="21" fill="#1e3f55" font-weight="400">未確認を区別する</text><rect x="345" y="112" width="270" height="214" rx="16" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="383" cy="152" r="22" fill="#0e5c8a"/><text x="376" y="161" font-size="25" fill="white" font-weight="700">2</text><text x="367" y="209" font-size="25" fill="#0e5c8a" font-weight="700">確認する人は？</text><text x="367" y="251" font-size="21" fill="#1e3f55" font-weight="400">調査担当と宅建士</text><text x="367" y="284" font-size="21" fill="#1e3f55" font-weight="400">売主の現況と照合</text><rect x="655" y="112" width="270" height="214" rx="16" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="693" cy="152" r="22" fill="#0e5c8a"/><text x="686" y="161" font-size="25" fill="white" font-weight="700">3</text><text x="677" y="209" font-size="25" fill="#0e5c8a" font-weight="700">訂正の方法は？</text><text x="677" y="251" font-size="21" fill="#1e3f55" font-weight="400">連絡先・訂正する人</text><text x="677" y="284" font-size="21" fill="#1e3f55" font-weight="400">修正版を再共有</text><text x="311" y="233" font-size="29" fill="#1e3f55" font-weight="400">→</text><text x="621" y="233" font-size="29" fill="#1e3f55" font-weight="400">→</text><text x="35" y="382" font-size="23" fill="#1e3f55" font-weight="400">AIは補助。宅建士が責任を持って説明する前提は変わりません。</text></g></svg>