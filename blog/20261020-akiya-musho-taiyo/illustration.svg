<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">無償で貸す前の3つの合意</title><desc id="desc">空き家の無償貸与前に、修繕費の負担と承諾、鍵や点検など日常管理の担当、返還時期と建物の状態を順番に合意する図。</desc><rect width="800" height="720" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="54" font-size="27" font-weight="bold">無償で貸す前の3つの合意</text><rect x="30" y="90" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="133" r="23" fill="#0e5c8a"/><text x="69" y="142" text-anchor="middle" fill="white" font-size="26">1</text><text x="109" y="140" font-size="27" font-weight="bold">修繕費</text><text x="109" y="191" font-size="25">工事の承諾と費用負担</text><text x="109" y="230" font-size="23">見積り・支払者・追加工事を記録</text><rect x="30" y="285" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="328" r="23" fill="#0e5c8a"/><text x="69" y="337" text-anchor="middle" fill="white" font-size="26">2</text><text x="109" y="335" font-size="27" font-weight="bold">日常管理</text><text x="109" y="386" font-size="25">鍵・点検・近隣への連絡</text><text x="109" y="425" font-size="23">持ち主と利用者の担当を決める</text><rect x="30" y="480" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="523" r="23" fill="#0e5c8a"/><text x="69" y="532" text-anchor="middle" fill="white" font-size="26">3</text><text x="109" y="530" font-size="27" font-weight="bold">返還条件</text><text x="109" y="581" font-size="25">時期・残す物・戻す状態</text><text x="109" y="620" font-size="23">利用終了後の現地確認まで相談</text><text x="40" y="704" font-size="17">2026年10月20日確認｜本文の出典と個別条件を照合</text></g></svg>