<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">相談会までの準備</title><desc id="desc">申込み、所在地と名義の整理、質問を書き出す、相談後の宿題を持ち帰るという4つの手順を並べた図。</desc>
<rect width="960" height="520" rx="24" fill="#f2f9fe"/><text x="480" y="70" text-anchor="middle" font-size="32" font-family="sans-serif" fill="#0e5c8a">空き家相談の準備と、その後</text>
<g font-family="sans-serif" fill="#1e3f55" text-anchor="middle"><rect x="48" y="115" width="405" height="140" rx="14" fill="white" stroke="#2e9bd4" stroke-width="3"/><text x="250" y="160" font-size="25" font-weight="bold">1　受付に申込方法を確認</text><text x="250" y="205" font-size="21">11月17日 16時まで</text><rect x="507" y="115" width="405" height="140" rx="14" fill="white" stroke="#2e9bd4" stroke-width="3"/><text x="710" y="160" font-size="25" font-weight="bold">2　資料を整理</text><text x="710" y="205" font-size="21">所在地・名義・分からない点</text><rect x="48" y="300" width="405" height="140" rx="14" fill="white" stroke="#2e9bd4" stroke-width="3"/><text x="250" y="345" font-size="25" font-weight="bold">3　聞きたいことを書く</text><text x="250" y="390" font-size="21">売却・管理・費用・家族の希望</text><rect x="507" y="300" width="405" height="140" rx="14" fill="white" stroke="#2e9bd4" stroke-width="3"/><text x="710" y="345" font-size="25" font-weight="bold">4　相談後の宿題を整理</text><text x="710" y="390" font-size="21">誰が・何を・いつ確認するか</text></g></svg>
