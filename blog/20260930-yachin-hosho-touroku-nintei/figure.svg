<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">登録・認定の着眼点と契約条件の確認を分けた図</title><desc id="d">保証会社の肩書だけでは、親の家に残る負担は分からない。</desc><rect width="800" height="520" fill="#fff"/><style>text{font-family:Yu Gothic,Meiryo,sans-serif;font-size:23px;fill:#1e3f55}.title{font-size:28px;font-weight:bold}.head{font-size:25px;font-weight:bold}.small{font-size:19px}text[fill="white"]{fill:white}</style><text x="40" y="54" class="title">家賃保証は「業者」と「契約」を別々に確認</text><rect x="40" y="88" width="345" height="162" rx="16" fill="#e9f5fc"/><rect x="415" y="88" width="345" height="162" rx="16" fill="#e9f5fc"/><text x="64" y="128" class="head">登録</text><text x="64" y="171">業務体制・適正な運営</text><text x="64" y="212" class="small">保証業務を行う体制を見る</text><text x="440" y="128" class="head">認定</text><text x="440" y="171">要配慮者の利用しやすさ</text><text x="440" y="212" class="small">保証の利用条件に着目する</text><path d="M210 255V280H590V255M400 280V313" fill="none" stroke="#2e9bd4" stroke-width="4"/><rect x="40" y="318" width="720" height="118" rx="16" fill="#0e5c8a"/><text x="65" y="357" fill="white" class="head">別に確認する：今回の保証契約</text><text x="65" y="402" fill="white">対象費用 ／ 上限 ／ 請求期限 ／ 動く担当者</text><text x="40" y="479" class="small">登録・認定だけで、貸主の全費用が保証されるわけではありません。</text></svg>