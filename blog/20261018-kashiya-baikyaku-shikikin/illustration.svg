<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="title desc">
<title id="title">敷金は「義務」と「お金」を分ける</title><desc id="desc">通常売買による貸主交代の整理図。借主への返還義務の承継と、売主・買主間のお金の精算を分けて確認します。競売は別の確認が必要です。</desc>
<rect width="800" height="620" rx="24" fill="#eef7fc"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="40" y="60" font-size="32" font-weight="bold" fill="#0e5c8a">敷金は「義務」と「お金」を分ける</text>
<rect x="40" y="94" width="720" height="127" rx="18" fill="#ffffff" stroke="#92c9e6" stroke-width="2"/>
<circle cx="96" cy="154" r="30" fill="#16709f"/>
<text x="96" y="165" text-anchor="middle" font-size="30" fill="white">1</text>
<text x="148" y="143" font-size="32" font-weight="bold" fill="#0e5c8a">借主との関係</text>
<text x="148" y="188" font-size="26" fill="#1e3f55">新しい貸主が返還義務を承継</text>

<rect x="40" y="247" width="720" height="127" rx="18" fill="#ffffff" stroke="#92c9e6" stroke-width="2"/>
<circle cx="96" cy="307" r="30" fill="#16709f"/>
<text x="96" y="318" text-anchor="middle" font-size="30" fill="white">2</text>
<text x="148" y="296" font-size="32" font-weight="bold" fill="#0e5c8a">売主と買主の関係</text>
<text x="148" y="341" font-size="26" fill="#1e3f55">資金の精算方法を別に合意</text>

<rect x="40" y="400" width="720" height="127" rx="18" fill="#d9effb" stroke="#92c9e6" stroke-width="2"/>
<circle cx="96" cy="460" r="30" fill="#16709f"/>
<text x="96" y="471" text-anchor="middle" font-size="30" fill="white">3</text>
<text x="148" y="449" font-size="32" font-weight="bold" fill="#0e5c8a">確認する3資料</text>
<text x="148" y="494" font-size="26" fill="#1e3f55">契約書・預り記録・精算案</text>
<text x="40" y="578" font-size="24" fill="#365f78">通常売買の整理／競売は別途確認</text>
</g></svg>