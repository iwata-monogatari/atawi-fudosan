<svg xmlns="http://www.w3.org/2000/svg" width="400" height="640" viewBox="0 0 400 640" role="img" aria-labelledby="t d"><title id="t">決済前の3つの確認</title><desc id="d">買主が農地として使うかと第3条許可の対象を確認し、売主と買主の双方で申請し、許可書の交付を確認してから決済日を詰める。発行の目安は受付日翌月の16日過ぎ。</desc><rect width="400" height="640" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif"><text x="24" y="44" font-size="25" font-weight="bold" fill="#0e5c8a">決済前の3つの確認</text><rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#2e9bd4"/><text x="36" y="108" font-size="24" font-weight="bold" fill="#0e5c8a">使い方を確認</text><text x="36" y="148" font-size="20" fill="#1e3f55">買主は農地として使うか</text><text x="36" y="176" font-size="20" fill="#1e3f55">第3条許可の対象か</text><path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#16709f" stroke-width="2"/><rect x="20" y="226" width="360" height="136" rx="12" fill="#fff" stroke="#2e9bd4"/><text x="36" y="262" font-size="24" font-weight="bold" fill="#0e5c8a">双方で申請</text><text x="36" y="302" font-size="20" fill="#1e3f55">申請者は売主と買主</text><text x="36" y="330" font-size="20" fill="#1e3f55">書類と担当を分ける</text><path d="M200 365v12m-5-5 5 5 5-5" fill="none" stroke="#16709f" stroke-width="2"/><rect x="20" y="380" width="360" height="164" rx="12" fill="#fff" stroke="#2e9bd4"/><text x="36" y="416" font-size="24" font-weight="bold" fill="#0e5c8a">交付を確認</text><text x="36" y="456" font-size="20" fill="#1e3f55">許可書の交付を確認</text><text x="36" y="484" font-size="20" fill="#1e3f55">してから決済日を詰める</text><text x="36" y="512" font-size="20" fill="#1e3f55">発行目安は翌月16日過ぎ</text><text x="24" y="594" font-size="20" fill="#4e7288">出典：磐田市</text><text x="24" y="622" font-size="20" fill="#4e7288">2026年11月9日確認</text></g></svg>