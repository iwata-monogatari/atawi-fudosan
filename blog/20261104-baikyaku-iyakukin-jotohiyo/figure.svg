<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img"><title>二つの契約と支払いを並べる</title><rect width="640" height="440" rx="24" fill="#f2f6f8"/><g font-family="Meiryo,sans-serif"><text x="32" y="51" font-size="29" font-weight="bold" fill="#193f55">二つの契約と支払いを並べる</text><rect x="24" y="75" width="592" height="103" rx="14" fill="white"/><circle cx="62" cy="125" r="24" fill="#164569"/><text x="62" y="134" text-anchor="middle" font-size="24" fill="white">1</text><text x="106" y="116" font-size="26" font-weight="bold" fill="#164569">先の売買契約</text><text x="106" y="153" font-size="23" fill="#233d49">売価と契約日　／　当初の条件を記す</text><rect x="24" y="191" width="592" height="103" rx="14" fill="white"/><circle cx="62" cy="241" r="24" fill="#1a637e"/><text x="62" y="250" text-anchor="middle" font-size="24" fill="white">2</text><text x="106" y="232" font-size="26" font-weight="bold" fill="#1a637e">解除と支払い</text><text x="106" y="269" font-size="23" fill="#233d49">理由と金額　／　返した手付を分ける</text><rect x="24" y="307" width="592" height="103" rx="14" fill="white"/><circle cx="62" cy="357" r="24" fill="#23695f"/><text x="62" y="366" text-anchor="middle" font-size="24" fill="white">3</text><text x="106" y="348" font-size="26" font-weight="bold" fill="#23695f">次の売買契約</text><text x="106" y="385" font-size="23" fill="#233d49">売価と契約日　／　同じ土地か照合する</text></g></svg>