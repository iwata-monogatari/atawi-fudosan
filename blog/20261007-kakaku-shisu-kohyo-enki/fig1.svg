<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc"><title id="title">不動産価格指数の公表延期｜磐田の査定は？の確認図</title><desc id="desc">資料の公表日。取引・統計の対象時期。自宅との条件差。印刷した日と区別。公表日と対象月は別。道路・面積・建物状態</desc><rect width="960" height="510" rx="22" fill="#e9f5fc"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#1e3f55"><text x="48" y="58" font-size="28" font-weight="bold">査定書の根拠を三つに分ける</text><rect x="48" y="90" width="864" height="94" rx="12" fill="white" stroke="#cde2f0"/><circle cx="88" cy="136" r="23" fill="#0e5c8a"/><text x="88" y="145" text-anchor="middle" fill="white" font-size="26">1</text><text x="130" y="129" font-size="27" font-weight="bold">資料の公表日</text><text x="130" y="163" font-size="21">印刷した日と区別</text><rect x="48" y="204" width="864" height="94" rx="12" fill="white" stroke="#cde2f0"/><circle cx="88" cy="250" r="23" fill="#0e5c8a"/><text x="88" y="259" text-anchor="middle" fill="white" font-size="26">2</text><text x="130" y="243" font-size="27" font-weight="bold">取引・統計の対象時期</text><text x="130" y="277" font-size="21">公表日と対象月は別</text><rect x="48" y="318" width="864" height="94" rx="12" fill="white" stroke="#cde2f0"/><circle cx="88" cy="364" r="23" fill="#0e5c8a"/><text x="88" y="373" text-anchor="middle" fill="white" font-size="26">3</text><text x="130" y="357" font-size="27" font-weight="bold">自宅との条件差</text><text x="130" y="391" font-size="21">道路・面積・建物状態</text></g><text x="48" y="478" font-size="18" fill="#5b7488" font-family="Yu Gothic, Meiryo, sans-serif">大石浩之の確認案｜2026年10月7日｜個別の事情は担当者・専門家へ</text></svg>