<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img" aria-labelledby="title desc"><title id="title">空き家の水道を整理する順番</title><desc id="desc">停止の判断順を、次回使用日・契約者・届出日の3段で図解</desc><rect width="640" height="800" rx="20" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="32" y="62" font-size="29" font-weight="bold">空き家の水道を整理する順番</text><rect x="28" y="100" width="584" height="168" rx="15" fill="white" stroke="#9ccfe7" stroke-width="2"/><circle cx="65" cy="147" r="23" fill="#0e5c8a"/><text x="65" y="157" text-anchor="middle" font-size="28" fill="white">1</text><text x="103" y="156" font-size="28" font-weight="bold">次に水を使う日</text><text x="48" y="219" font-size="27">清掃・内覧・管理の予定を確認</text><path d="M320 278v22m-10-10 10 10 10-10" fill="none" stroke="#16709f" stroke-width="4"/><rect x="28" y="310" width="584" height="168" rx="15" fill="white" stroke="#9ccfe7" stroke-width="2"/><circle cx="65" cy="357" r="23" fill="#0e5c8a"/><text x="65" y="367" text-anchor="middle" font-size="28" fill="white">2</text><text x="103" y="366" font-size="28" font-weight="bold">契約と請求先</text><text x="48" y="429" font-size="27">契約者・請求元・連絡担当を整理</text><path d="M320 488v22m-10-10 10 10 10-10" fill="none" stroke="#16709f" stroke-width="4"/><rect x="28" y="520" width="584" height="168" rx="15" fill="white" stroke="#9ccfe7" stroke-width="2"/><circle cx="65" cy="567" r="23" fill="#0e5c8a"/><text x="65" y="577" text-anchor="middle" font-size="28" fill="white">3</text><text x="103" y="576" font-size="28" font-weight="bold">中止と再開の届出</text><text x="48" y="639" font-size="27">磐田市は希望日の3日前まで</text><text x="32" y="765" font-size="25">停止の届出と設備の管理は別です</text></g></svg>