<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">感震ブレーカーを選ぶ前の3確認</title><desc id="desc">感震ブレーカーの設置前に確認する三つの事項。第一に分電盤側か特定のコンセントかという遮断範囲、第二に既存の分電盤と漏電ブレーカーの適合、第三に電気工事の要否と地震後に相談する連絡先を整理した説明図。</desc><rect width="800" height="720" rx="16" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="30" y="52" font-size="26" font-weight="bold">感震ブレーカーを選ぶ前の3確認</text><rect x="25" y="85" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="128" r="23" fill="#0e5c8a"/><text x="62" y="137" text-anchor="middle" fill="white" font-size="26">1</text><text x="102" y="136" font-size="27" font-weight="bold">遮断する範囲</text><text x="45" y="190" font-size="26">分電盤側／特定のコンセント</text><text x="45" y="231" font-size="23">止まる設備を一緒に確認</text><rect x="25" y="280" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="323" r="23" fill="#0e5c8a"/><text x="62" y="332" text-anchor="middle" fill="white" font-size="26">2</text><text x="102" y="331" font-size="27" font-weight="bold">既存設備との適合</text><text x="45" y="385" font-size="26">分電盤の型番を業者に伝える</text><text x="45" y="426" font-size="23">後付け型は漏電ブレーカーも確認</text><rect x="25" y="475" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="518" r="23" fill="#0e5c8a"/><text x="62" y="527" text-anchor="middle" fill="white" font-size="26">3</text><text x="102" y="526" font-size="27" font-weight="bold">工事と管理の段取り</text><text x="45" y="580" font-size="26">設置方法・費用・連絡先</text><text x="45" y="621" font-size="23">地震後の対応も相談しておく</text><text x="30" y="702" font-size="17">2026年10月28日確認｜個別条件と本文の出典を照合</text></g></svg>