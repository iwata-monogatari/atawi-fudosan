<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" role="img" aria-labelledby="t d"><title id="t">遺言書の証明書を目的で選ぶ</title><desc id="d">親が亡くなった後、保管の有無は事実証明書、遺言の内容は情報証明書で確かめる。</desc><rect width="600" height="430" rx="18" fill="#eef6fa"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#173c54"><text x="32" y="51" font-size="29" font-weight="bold">どちらを知りたいですか？</text><path d="M55 90v218" stroke="#438da4" stroke-width="5"/><rect x="77" y="83" width="496" height="129" rx="13" fill="#fff"/><circle cx="55" cy="122" r="15" fill="#1b6784"/><text x="101" y="124" font-size="24">預けてあるかを確かめる</text><text x="101" y="174" font-weight="bold" font-size="32" fill="#125879">遺言書保管事実証明書</text><rect x="77" y="239" width="496" height="129" rx="13" fill="#fff"/><circle cx="55" cy="277" r="15" fill="#1b6784"/><text x="101" y="280" font-size="24">遺言に書かれた内容を読む</text><text x="101" y="329" font-weight="bold" font-size="32" fill="#125879">遺言書情報証明書</text><text x="32" y="401" font-size="20">いずれも遺言者の死亡後の手続です。</text></g></svg>