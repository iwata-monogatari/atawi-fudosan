<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">休眠抵当権の抹消で確認する3条件</title><desc id="desc">弁済期から30年と法人の解散日から30年の両方に、所定の所在調査が必要です。</desc><rect width="900" height="540" rx="20" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="45" y="60" font-size="30" font-weight="bold">「30年」を数える起点は2つ</text><rect x="45" y="90" width="390" height="140" rx="14" fill="#e9f5fc" stroke="#2E9BD4" stroke-width="2"/><rect x="465" y="90" width="390" height="140" rx="14" fill="#e9f5fc" stroke="#2E9BD4" stroke-width="2"/><text x="70" y="132" font-size="24">債権の弁済期（返済期限）</text><text x="70" y="192" font-size="36" fill="#0e5c8a" font-weight="bold">そこから30年</text><text x="490" y="132" font-size="24">法人の解散日</text><text x="490" y="192" font-size="36" fill="#0e5c8a" font-weight="bold">そこから30年</text><text x="450" y="270" text-anchor="middle" font-size="25" font-weight="bold">両方を満たす ＋ 所在調査</text><rect x="45" y="294" width="810" height="98" rx="14" fill="white" stroke="#cde2f0" stroke-width="2"/><text x="70" y="334" font-size="25">所定の調査でも清算人の所在が判明せず、</text><text x="70" y="370" font-size="25">法人と共同で抹消申請できない</text><text x="450" y="442" text-anchor="middle" font-size="28" fill="#0e5c8a" font-weight="bold">単独申請を検討 → 司法書士などへ確認</text><text x="450" y="494" text-anchor="middle" font-size="21">相続日・抵当権設定日から数える制度ではありません</text></g></svg>