<svg xmlns="http://www.w3.org/2000/svg" width="400" height="749" viewBox="0 0 400 749" role="img" aria-labelledby="t d">
<title id="t">心理的瑕疵の告知の判断</title>
<desc id="d">亡くなり方で線引きし、売買では期間の目安に頼らず、特殊清掃の有無も含めて告知書に正確に書く。</desc>
<rect width="400" height="749" rx="18" fill="#faf3ea"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#8f5a1e">心理的瑕疵の告知の判断</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#d0a87d"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#8f5a1e">死因で線引く</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">自然死・不慮の死は原則不要</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">事件性のある死亡は告知対象</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#a36c2a" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#d0a87d"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#8f5a1e">売買で読み直す</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">3年の目安は賃貸のもの</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">売買は事案の重さで判断</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#a36c2a" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#fff" stroke="#d0a87d"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#8f5a1e">告知書に書く</text>
<text x="36" y="454" font-size="20" fill="#1e3f55">事実と時期を正確に記載し</text>
<text x="36" y="482" font-size="20" fill="#1e3f55">特殊清掃の有無も示す</text>
<path d="M200 517v12m-5-5 5 5 5-5" fill="none" stroke="#a36c2a" stroke-width="2"/>
<rect x="20" y="531" width="360" height="136" rx="12" fill="#8f5a1e"/>
<text x="36" y="567" font-size="24" font-weight="bold" fill="#fff">価格に織り込む</text>
<text x="36" y="607" font-size="20" font-weight="bold" fill="#fff">告知の範囲を開示した上で</text>
<text x="36" y="635" font-size="20" font-weight="bold" fill="#fff">買主層を絞って売る</text>
<text x="24" y="703" font-size="20" fill="#1e3f55">迷ったら、告知する側に倒す</text>
<text x="24" y="731" font-size="20" fill="#4e7288">出典：国交省 告知ガイドライン11月確認</text>
</g></svg>
