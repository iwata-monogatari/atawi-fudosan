<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">蛍光灯の交換を決める前の確認</title><desc id="desc">空き家の蛍光灯について、製造と輸出入の規制は使用禁止とは異なること、型番と器具の状態を電器店へ確認すること、残す・交換・撤去の条件を記録することを順に示した説明図。</desc><rect width="800" height="720" rx="16" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="30" y="52" font-size="26" font-weight="bold">蛍光灯の交換を決める前の確認</text><rect x="25" y="85" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="128" r="23" fill="#0e5c8a"/><text x="62" y="137" text-anchor="middle" fill="white" font-size="26">1</text><text x="102" y="136" font-size="27" font-weight="bold">規制の対象</text><text x="45" y="190" font-size="26">製造・輸出入は種類別に規制</text><text x="45" y="231" font-size="23">使用・販売・購入は禁止されない</text><rect x="25" y="280" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="323" r="23" fill="#0e5c8a"/><text x="62" y="332" text-anchor="middle" fill="white" font-size="26">2</text><text x="102" y="331" font-size="27" font-weight="bold">設備の確認</text><text x="45" y="385" font-size="26">型番と器具の状態を電器店へ</text><text x="45" y="426" font-size="23">交換工事が必要な場合もある</text><rect x="25" y="475" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="518" r="23" fill="#0e5c8a"/><text x="62" y="527" text-anchor="middle" fill="white" font-size="26">3</text><text x="102" y="526" font-size="27" font-weight="bold">売却の条件</text><text x="45" y="580" font-size="26">残す・交換・撤去を記録する</text><text x="45" y="621" font-size="23">費用負担と実施時期を契約前に確認</text><text x="30" y="702" font-size="17">2026年10月26日確認｜個別条件と本文の出典を照合</text></g></svg>