<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">別払いは、三つの根拠をつなぐ</title><desc id="desc">不動産売却の出張費について、特別の依頼に対応する調査内容、出発前の費用負担への承諾、実費相当額の明細と精算を三つの欄で照合する図。どれか一つだけで判断しない。</desc><rect width="1200" height="640" rx="24" fill="#e9f5fc"/><g font-family="Yu Gothic,Meiryo,sans-serif"><text x="60" y="82" font-size="38" font-weight="bold" fill="#0e5c8a">別払いは、三つの根拠をつなぐ</text><rect x="50" y="130" width="330" height="350" rx="18" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="93" cy="172" r="24" fill="#0e5c8a"/><text x="93" y="181" text-anchor="middle" font-size="24" fill="white">1</text><g transform="translate(215,255)" fill="none" stroke="#16709f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M-26-40h38l17 17v65h-55zM10-40v19h19M-13-2h28M-13 11h28M-13 24h20"/></g><text x="215" y="360" text-anchor="middle" font-size="29" font-weight="bold" fill="#0e5c8a">特別の依頼</text><text x="215" y="416" text-anchor="middle" font-size="23" fill="#1e3f55">調査内容</text><path d="M392 300h27m-10-10 10 10-10 10" fill="none" stroke="#2e9bd4" stroke-width="4"/><rect x="435" y="130" width="330" height="350" rx="18" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="478" cy="172" r="24" fill="#0e5c8a"/><text x="478" y="181" text-anchor="middle" font-size="24" fill="white">2</text><g transform="translate(600,255)" fill="none" stroke="#16709f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="-33" y="-30" width="66" height="64" rx="7"/><path d="M-18 2l13 13 25-29"/></g><text x="600" y="360" text-anchor="middle" font-size="29" font-weight="bold" fill="#0e5c8a">事前の承諾</text><text x="600" y="416" text-anchor="middle" font-size="23" fill="#1e3f55">負担範囲</text><path d="M777 300h27m-10-10 10 10-10 10" fill="none" stroke="#2e9bd4" stroke-width="4"/><rect x="820" y="130" width="330" height="350" rx="18" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="863" cy="172" r="24" fill="#0e5c8a"/><text x="863" y="181" text-anchor="middle" font-size="24" fill="white">3</text><g transform="translate(985,255)" fill="none" stroke="#16709f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="-30" y="-38" width="60" height="80" rx="6"/><path d="M-18-23h36M-15 0h4m15 0h4m-23 15h4m15 0h4m-23 15h4m15 0h4"/></g><text x="985" y="360" text-anchor="middle" font-size="29" font-weight="bold" fill="#0e5c8a">実費相当</text><text x="985" y="416" text-anchor="middle" font-size="23" fill="#1e3f55">明細と精算</text><text x="600" y="553" text-anchor="middle" font-size="28" fill="#0e5c8a">「遠方だから一式」で終わらせず、依頼と明細を照合</text><text x="600" y="602" text-anchor="middle" font-size="18" fill="#5b7488">ATAWI FUDOSAN｜2026年10月8日確認・説明用の模式図</text></g></svg>