<svg xmlns="http://www.w3.org/2000/svg" width="400" height="749" viewBox="0 0 400 749" role="img" aria-labelledby="t d">
<title id="t">事前調査の段取り</title>
<desc id="d">書面調査と現地調査を行い、必要に応じて分析し、結果を報告・記録して工事へ進む。</desc>
<rect width="400" height="749" rx="18" fill="#f3efe7"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#6b531e">事前調査の段取り</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#bba77d"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#6b531e">書面調査</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">図面と建築年次から、石綿を</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">含み得る建材を洗い出す</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#96802e" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#bba77d"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#6b531e">現地調査</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">有資格者が建材を目視で確認し、</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">必要に応じて試料を採取する</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#96802e" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#fff" stroke="#bba77d"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#6b531e">分析と判定</text>
<text x="36" y="454" font-size="20" fill="#1e3f55">採取した試料を分析し、含有の</text>
<text x="36" y="482" font-size="20" fill="#1e3f55">有無と工事の対策を決める</text>
<path d="M200 517v12m-5-5 5 5 5-5" fill="none" stroke="#96802e" stroke-width="2"/>
<rect x="20" y="531" width="360" height="136" rx="12" fill="#6b531e"/>
<text x="36" y="567" font-size="24" font-weight="bold" fill="#fff">報告と記録</text>
<text x="36" y="607" font-size="20" font-weight="bold" fill="#fff">一定規模以上は行政へ報告し、</text>
<text x="36" y="635" font-size="20" font-weight="bold" fill="#fff">結果を記録して買主へも伝える</text>
<text x="24" y="703" font-size="20" fill="#1e3f55">調査結果の記録は3年間保存されます。</text>
<text x="24" y="731" font-size="20" fill="#4e7288">出典：環境省・厚生労働省の石綿飛散防止の案内をもとに作成</text>
</g></svg>
