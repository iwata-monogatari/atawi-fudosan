<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">11月2日以降の窓口と電話の受付時間を比べる図</title><desc id="d">売却資料集めは、役所へ行けば何とかなるでは済まない。書類ごとに行き先と時間を決める。</desc><rect width="800" height="520" fill="#fff"/><style>text{font-family:Yu Gothic,Meiryo,sans-serif;font-size:23px;fill:#1e3f55}.title{font-size:28px;font-weight:bold}.head{font-size:25px;font-weight:bold}.small{font-size:19px}text[fill="white"]{fill:white}</style><text x="40" y="54" class="title">磐田市：2026年11月2日から</text><text x="40" y="100" class="small">窓口の受付と電話の受付は、別の時間です。</text><rect x="40" y="139" width="720" height="104" rx="14" fill="#e9f5fc"/><text x="64" y="178" class="head">対象窓口</text><text x="64" y="218" class="head">9:00 〜 16:30</text><text x="356" y="180" class="small">16:30までに受付済みの</text><text x="356" y="216" class="small">手続き・相談は、その後も対応</text><rect x="40" y="268" width="720" height="104" rx="14" fill="#0e5c8a"/><text x="64" y="308" class="head" fill="white">電話受付（変更なし）</text><text x="64" y="348" class="head" fill="white">8:30 〜 17:15</text><text x="400" y="419" text-anchor="middle">木曜19時まで・第2日曜9時〜正午</text><text x="400" y="455" text-anchor="middle" class="head">延長・休日開庁は市民課・市民税課のみ</text><text x="400" y="491" text-anchor="middle" class="small">土地調査の部署まで夜間対応とは考えず、事前に確認を。</text></svg>