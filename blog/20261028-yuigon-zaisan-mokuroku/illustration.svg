<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">本文と財産目録を分けて確認</title><desc id="desc">自筆証書遺言の本文と添付する財産目録を分けた説明図。本文の相続先や配分は本人が手書きし、財産目録はパソコンや登記事項証明書等を利用できる。手書きでない目録は毎葉に本人が署名押印し、両面に記載がある場合は両面に必要と示している。</desc><rect width="800" height="720" rx="16" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="30" y="52" font-size="26" font-weight="bold">本文と財産目録を分けて確認</text><rect x="25" y="85" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="128" r="23" fill="#0e5c8a"/><text x="62" y="137" text-anchor="middle" fill="white" font-size="26">1</text><text x="102" y="136" font-size="27" font-weight="bold">本文は本人が手書き</text><text x="45" y="190" font-size="26">誰に・何を相続させるか</text><text x="45" y="231" font-size="23">目録の自書不要とは分けて考える</text><rect x="25" y="280" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="323" r="23" fill="#0e5c8a"/><text x="62" y="332" text-anchor="middle" fill="white" font-size="26">2</text><text x="102" y="331" font-size="27" font-weight="bold">添付する目録を作る</text><text x="45" y="385" font-size="26">パソコン／登記事項証明書等</text><text x="45" y="426" font-size="23">土地と建物を資料で照合する</text><rect x="25" y="475" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="518" r="23" fill="#0e5c8a"/><text x="62" y="527" text-anchor="middle" fill="white" font-size="26">3</text><text x="102" y="526" font-size="27" font-weight="bold">署名・押印を確認</text><text x="45" y="580" font-size="26">手書きでない目録の毎葉に</text><text x="45" y="621" font-size="23">両面に記載があるときは両面に</text><text x="30" y="702" font-size="17">2026年10月28日確認｜個別条件と本文の出典を照合</text></g></svg>