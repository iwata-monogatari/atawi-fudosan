<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img"><title>売主が契約前に共有する、届出の段取り</title><desc>磐田市の土地売買等届出の段取り図。契約前に区域、面積、買主側の担当者を確認する。対象取引は契約締結日を含めて2週間以内に買主等が届け出、決済や引渡しを待たない。2026年4月1日以降の届出には新様式を使う。</desc><rect width="1200" height="660" rx="24" fill="#e9f5fc"/><g font-family="Yu Gothic, sans-serif" fill="#1e3f55"><text x="60" y="80" font-size="34" font-weight="700">売主が契約前に共有する、届出の段取り</text><rect x="45" y="145" width="330" height="270" rx="16" fill="white" stroke="#2E9BD4" stroke-width="3"/><text x="210" y="210" text-anchor="middle" font-size="28" font-weight="700">契約前</text><text x="210" y="282" text-anchor="middle" font-size="28" font-weight="700">区域・面積を確認</text><text x="210" y="354" text-anchor="middle" font-size="20" font-weight="400">買主側の担当者を決める</text><path d="M387 263 l24 17 -24 17" fill="none" stroke="#16709f" stroke-width="5"/><rect x="435" y="145" width="330" height="270" rx="16" fill="white" stroke="#2E9BD4" stroke-width="3"/><text x="600" y="210" text-anchor="middle" font-size="28" font-weight="700">契約締結日</text><text x="600" y="282" text-anchor="middle" font-size="28" font-weight="700">当日を含めて数える</text><text x="600" y="354" text-anchor="middle" font-size="20" font-weight="400">決済・引渡しを待たない</text><path d="M777 263 l24 17 -24 17" fill="none" stroke="#16709f" stroke-width="5"/><rect x="825" y="145" width="330" height="270" rx="16" fill="white" stroke="#2E9BD4" stroke-width="3"/><text x="990" y="210" text-anchor="middle" font-size="28" font-weight="700">2週間以内</text><text x="990" y="282" text-anchor="middle" font-size="28" font-weight="700">買主等が届出</text><text x="990" y="354" text-anchor="middle" font-size="20" font-weight="400">新様式と必要書類で提出</text><text x="60" y="505" font-size="25">国土利用計画法に基づく事後届出。2026年9月17日確認。</text><text x="60" y="565" font-size="25">期限が土日祝日等の場合の扱いと提出方法は、磐田市へ確認。</text></g></svg>