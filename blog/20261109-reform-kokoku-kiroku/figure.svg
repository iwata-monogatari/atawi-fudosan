<svg xmlns="http://www.w3.org/2000/svg" width="400" height="612" viewBox="0 0 400 612" role="img" aria-labelledby="t d"><title id="t">広告に渡す2つの記録</title><desc id="d">工事内容はどの場所をどこまで工事したかを分け、実施時期は工事ごとに年月を根拠資料と組にする。広告案は部位・範囲・年月を記録と見比べる。</desc><rect width="400" height="612" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif"><text x="24" y="44" font-size="25" font-weight="bold" fill="#0e5c8a">広告に渡す2つの記録</text><rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#2e9bd4"/><text x="36" y="108" font-size="24" font-weight="bold" fill="#0e5c8a">記録1 工事内容</text><text x="36" y="148" font-size="20" fill="#1e3f55">どの場所をどこまで</text><text x="36" y="176" font-size="20" fill="#1e3f55">工事したかを分ける</text><path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#16709f" stroke-width="2"/><rect x="20" y="226" width="360" height="136" rx="12" fill="#fff" stroke="#2e9bd4"/><text x="36" y="262" font-size="24" font-weight="bold" fill="#0e5c8a">記録2 実施時期</text><text x="36" y="302" font-size="20" fill="#1e3f55">工事ごとに年月を</text><text x="36" y="330" font-size="20" fill="#1e3f55">根拠資料と組にする</text><path d="M200 365v12m-5-5 5 5 5-5" fill="none" stroke="#16709f" stroke-width="2"/><rect x="20" y="380" width="360" height="136" rx="12" fill="#fff" stroke="#2e9bd4"/><text x="36" y="416" font-size="24" font-weight="bold" fill="#0e5c8a">広告案で照合</text><text x="36" y="456" font-size="20" fill="#1e3f55">部位・範囲・年月を</text><text x="36" y="484" font-size="20" fill="#1e3f55">記録と見比べる</text><text x="24" y="566" font-size="20" fill="#4e7288">出典：首都圏不動産公正取引協議会</text><text x="24" y="594" font-size="20" fill="#4e7288">2026年11月9日確認</text></g></svg>