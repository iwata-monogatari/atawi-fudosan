<svg xmlns="http://www.w3.org/2000/svg" width="400" height="596" viewBox="0 0 400 596" role="img" aria-labelledby="t d">
<title id="t">新築住宅の減額期間</title>
<desc id="d">戸建て3年度分、マンション5年度分、長期優良住宅は戸建て5年・マンション7年。対象は家屋分のみ。</desc>
<rect width="400" height="596" rx="18" fill="#eef3f7"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#1e4f6b">新築住宅の減額期間</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#7da7bb"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#1e4f6b">対象は家屋の税額だけ</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">土地の固定資産税は減額対象外</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">減額は120平方メートル相当分まで</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#2e7396" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#7da7bb"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#1e4f6b">期間の目安</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">戸建て：新築後3年度分</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">マンション：新築後5年度分</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#2e7396" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#1e4f6b"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#fff">長期優良住宅なら延長</text>
<text x="36" y="454" font-size="20" font-weight="bold" fill="#fff">戸建て5年度分・マンション7年度分</text>
<text x="36" y="482" font-size="20" font-weight="bold" fill="#fff">認定通知の写し等の申告が必要</text>
<text x="24" y="550" font-size="20" fill="#1e3f55">期間が終わると本来の税額に戻ります。</text>
<text x="24" y="578" font-size="20" fill="#4e7288">出典：総務省・市町村の固定資産税の案内</text>
</g></svg>
