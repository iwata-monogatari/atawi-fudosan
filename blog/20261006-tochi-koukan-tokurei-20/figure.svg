<svg xmlns="http://www.w3.org/2000/svg" width="760" height="690" viewBox="0 0 760 690" role="img"><title>20％の計算と残る確認</title><desc>土地交換の仮定例で、時価1,000万円と800万円の差200万円を高い方の1,000万円で割ると20％になることを示す図。20％以内だけでは適用は決まらず、資産の種類や所有期間、用途、確定申告、交換差金の課税も確認する。</desc><rect width="760" height="690" fill="#f2f9fe"/><style>text{font-family:Yu Gothic,Meiryo,sans-serif;fill:#1e3f55}</style><rect width="760" height="98" fill="#0e5c8a"/><text x="34" y="62" font-size="30" font-weight="bold" style="fill:white">20％の計算と残る確認</text><rect x="24" y="122" width="712" height="150" rx="12" fill="white" stroke="#cde2f0"/><rect x="24" y="122" width="8" height="150" rx="4" fill="#2E9BD4"/><text x="50" y="160" font-size="26" font-weight="bold">時価の差を計算</text><text x="50" y="205" font-size="24">例：1,000万円 − 800万円 = 200万円</text><text x="50" y="245" font-size="24">200万円 ÷ 高い方1,000万円 = 20％</text><rect x="24" y="296" width="712" height="150" rx="12" fill="white" stroke="#cde2f0"/><rect x="24" y="296" width="8" height="150" rx="4" fill="#2E9BD4"/><text x="50" y="334" font-size="26" font-weight="bold">20％だけでは決まらない</text><text x="50" y="379" font-size="24">双方の固定資産・同じ種類・所有期間</text><text x="50" y="419" font-size="24">相手の取得目的・交換後の用途も確認</text><rect x="24" y="470" width="712" height="150" rx="12" fill="white" stroke="#cde2f0"/><rect x="24" y="470" width="8" height="150" rx="4" fill="#2E9BD4"/><text x="50" y="508" font-size="26" font-weight="bold">申告と交換差金</text><text x="50" y="553" font-size="24">特例を受けるためには確定申告が必要</text><text x="50" y="593" font-size="24">受け取る交換差金は課税対象</text><text x="30" y="664" font-size="18">2026年10月6日確認｜公式情報をもとに筆者作成</text></svg>