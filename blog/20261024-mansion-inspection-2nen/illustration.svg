<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">マンションの報告書を開いて確認</title><desc id="desc">マンションの建物状況調査報告書を使う前の確認図。RC造等の対象と調査年月日を確かめ、住戸内・住戸外の調査範囲と未調査部分を照合し、重要事項説明の予定日を踏まえて再調査の要否を相談する。</desc><rect width="800" height="720" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="54" font-size="27" font-weight="bold">マンションの報告書を開いて確認</text><rect x="30" y="90" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="133" r="23" fill="#0e5c8a"/><text x="69" y="142" text-anchor="middle" fill="white" font-size="26">1</text><text x="109" y="140" font-size="27" font-weight="bold">建物と日付</text><text x="109" y="191" font-size="25">RC造等か／調査年月日はいつか</text><text x="109" y="230" font-size="23">年だけで2年未満と決めない</text><rect x="30" y="285" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="328" r="23" fill="#0e5c8a"/><text x="69" y="337" text-anchor="middle" fill="white" font-size="26">2</text><text x="109" y="335" font-size="27" font-weight="bold">調べた範囲</text><text x="109" y="386" font-size="25">住戸内・住戸外の資料を照合</text><text x="109" y="425" font-size="23">調査者や未調査部分も確認</text><rect x="30" y="480" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="523" r="23" fill="#0e5c8a"/><text x="69" y="532" text-anchor="middle" fill="white" font-size="26">3</text><text x="109" y="530" font-size="27" font-weight="bold">売却の日程</text><text x="109" y="581" font-size="25">説明予定日までの期間を確認</text><text x="109" y="620" font-size="23">再調査の要否を相談する</text><text x="40" y="704" font-size="17">2026年10月24日確認｜本文の出典と個別条件を照合</text></g></svg>