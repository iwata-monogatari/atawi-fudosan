<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">売却未定でも、家の外から確認</title><desc id="desc">売却未定でも、家の外から確認。可燃物、落ち葉・段ボール・古い家具、片付けた日と残った物を記録。開口部、窓・勝手口・物置の扉、破損の補修と施錠を確認。引継ぎ、写真・確認日・次の担当、未完了の作業を次回へ渡す。筆者の確認手順を示した説明図。</desc><rect width="960" height="600" rx="22" fill="#e9f5fc"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#1e3f55"><text x="40" y="62" font-size="31" font-weight="700">売却未定でも、家の外から確認</text><rect x="32" y="92" width="896" height="130" rx="12" fill="white" stroke="#cde2f0"/><g transform="translate(42,104)" fill="none" stroke="#2e9bd4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 45 L45 14 L80 45 V90 H10Z M34 90V60H57V90"/></g><text x="160" y="128" font-size="25" font-weight="700">1　可燃物</text><text x="160" y="165" font-size="26">落ち葉・段ボール・古い家具</text><text x="160" y="200" font-size="22" fill="#5b7488">片付けた日と残った物を記録</text><rect x="32" y="242" width="896" height="130" rx="12" fill="white" stroke="#cde2f0"/><g transform="translate(42,254)" fill="none" stroke="#2e9bd4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="13" y="14" width="66" height="78"/><path d="M46 14V92 M13 52H79"/></g><text x="160" y="278" font-size="25" font-weight="700">2　開口部</text><text x="160" y="315" font-size="26">窓・勝手口・物置の扉</text><text x="160" y="350" font-size="22" fill="#5b7488">破損の補修と施錠を確認</text><rect x="32" y="392" width="896" height="130" rx="12" fill="white" stroke="#cde2f0"/><g transform="translate(42,404)" fill="none" stroke="#2e9bd4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="15" y="12" width="66" height="82" rx="5"/><path d="M28 36l7 7 13-16 M28 66l7 7 13-16 M55 38h14 M55 68h14"/></g><text x="160" y="428" font-size="25" font-weight="700">3　引継ぎ</text><text x="160" y="465" font-size="26">写真・確認日・次の担当</text><text x="160" y="500" font-size="22" fill="#5b7488">未完了の作業を次回へ渡す</text><text x="40" y="573" font-size="18" fill="#5b7488">大石浩之｜確認事項を整理するための筆者作成図</text></g></svg>