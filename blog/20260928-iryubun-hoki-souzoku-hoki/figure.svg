<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">二つの放棄は、対象と時期が違う</title><desc id="desc">遺留分放棄は最低限の取り分について生前に家庭裁判所の許可を受け、相続放棄は権利と義務を受け継がず自己のための自己のための相続開始を知ってから原則3か月以内に申述する比較図</desc><rect width="960" height="430" rx="16" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="56" font-size="27" font-weight="bold">二つの放棄は、対象と時期が違う</text><rect x="40" y="100" width="440" height="105" rx="12" fill="#e9f5fc" stroke="#2E9BD4"/><text x="60" y="140" font-size="18" fill="#16709f">01</text><text x="60" y="168" font-size="19"><tspan x="60" dy="0">遺留分放棄：最低限の取り分</tspan></text><rect x="500" y="100" width="440" height="105" rx="12" fill="#e9f5fc" stroke="#2E9BD4"/><text x="520" y="140" font-size="18" fill="#16709f">02</text><text x="520" y="168" font-size="19"><tspan x="520" dy="0">生前に家裁の許可</tspan></text><rect x="40" y="230" width="440" height="105" rx="12" fill="#ffffff" stroke="#2E9BD4"/><text x="60" y="270" font-size="18" fill="#16709f">03</text><text x="60" y="298" font-size="19"><tspan x="60" dy="0">相続放棄：権利も義務も</tspan></text><rect x="500" y="230" width="440" height="105" rx="12" fill="#ffffff" stroke="#2E9BD4"/><text x="520" y="270" font-size="18" fill="#16709f">04</text><text x="520" y="298" font-size="19"><tspan x="520" dy="0">自己のための相続開始を知ってから</tspan><tspan x="520" dy="25">原則3か月以内</tspan></text><text x="40" y="390" font-size="20">相続・代理の個別判断は専門家に確認を</text></g></svg>