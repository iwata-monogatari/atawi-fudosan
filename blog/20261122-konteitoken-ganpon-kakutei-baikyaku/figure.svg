<svg xmlns="http://www.w3.org/2000/svg" width="400" height="749" viewBox="0 0 400 749" role="img" aria-labelledby="t d">
<title id="t">根抵当権の売却手順</title>
<desc id="d">根抵当権の有無と極度額を登記で見て、元本確定の場面を確かめ、債務を精算して抹消する。</desc>
<rect width="400" height="749" rx="18" fill="#eef3f7"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#1e4f6b">根抵当権の売却手順</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#7da7bb"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#1e4f6b">登記簿を見る</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">根抵当権の登記と極度額・</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">債務者の名前を確認する</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#2e7396" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#7da7bb"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#1e4f6b">確定の場面を見る</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">確定期日・3年後の確定請求・</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">相続の有無を確かめる</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#2e7396" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#fff" stroke="#7da7bb"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#1e4f6b">債務を精算する</text>
<text x="36" y="454" font-size="20" fill="#1e3f55">確定した元本と利息を確定し</text>
<text x="36" y="482" font-size="20" fill="#1e3f55">銀行と精算の段取りを組む</text>
<path d="M200 517v12m-5-5 5 5 5-5" fill="none" stroke="#2e7396" stroke-width="2"/>
<rect x="20" y="531" width="360" height="136" rx="12" fill="#1e4f6b"/>
<text x="36" y="567" font-size="24" font-weight="bold" fill="#fff">抹消して売る</text>
<text x="36" y="607" font-size="20" font-weight="bold" fill="#fff">解除証書を受け取り、抹消</text>
<text x="36" y="635" font-size="20" font-weight="bold" fill="#fff">登記を済ませて引き渡す</text>
<text x="24" y="703" font-size="20" fill="#1e3f55">確定の前段を踏んでから抹消へ。</text>
<text x="24" y="731" font-size="20" fill="#4e7288">出典：民法第398条の19以下をもとに作成</text>
</g></svg>
