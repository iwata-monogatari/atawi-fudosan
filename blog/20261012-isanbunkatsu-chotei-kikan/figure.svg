<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">解決時期を決めつけず、３つを準備</title><desc id="desc">解決時期を決めつけず、３つを準備。資料、登記・評価・相続関係、不足と食い違いを一覧にする。管理費、税金・保険・管理の支出、支払者と領収書を残す。売却条件、査定・費用・引渡し条件、契約可能かは専門家へ確認。筆者の確認手順を示した説明図。</desc><rect width="960" height="600" rx="22" fill="#e9f5fc"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#1e3f55"><text x="40" y="62" font-size="31" font-weight="700">解決時期を決めつけず、３つを準備</text><rect x="32" y="92" width="896" height="130" rx="12" fill="white" stroke="#cde2f0"/><g transform="translate(42,104)" fill="none" stroke="#2e9bd4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12h45l16 16v68H20Z M65 12v18h16 M32 45h36 M32 62h36 M32 79h28"/></g><text x="160" y="128" font-size="25" font-weight="700">1　資料</text><text x="160" y="165" font-size="26">登記・評価・相続関係</text><text x="160" y="200" font-size="22" fill="#5b7488">不足と食い違いを一覧にする</text><rect x="32" y="242" width="896" height="130" rx="12" fill="white" stroke="#cde2f0"/><g transform="translate(42,254)" fill="none" stroke="#2e9bd4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="49" cy="52" r="35"/><path d="M49 27v28l19 13"/></g><text x="160" y="278" font-size="25" font-weight="700">2　管理費</text><text x="160" y="315" font-size="26">税金・保険・管理の支出</text><text x="160" y="350" font-size="22" fill="#5b7488">支払者と領収書を残す</text><rect x="32" y="392" width="896" height="130" rx="12" fill="white" stroke="#cde2f0"/><g transform="translate(42,404)" fill="none" stroke="#2e9bd4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 45L45 14 80 45V90H10Z M31 62h28 M31 76h28"/></g><text x="160" y="428" font-size="25" font-weight="700">3　売却条件</text><text x="160" y="465" font-size="26">査定・費用・引渡し条件</text><text x="160" y="500" font-size="22" fill="#5b7488">契約可能かは専門家へ確認</text><text x="40" y="573" font-size="18" fill="#5b7488">大石浩之｜確認事項を整理するための筆者作成図</text></g></svg>