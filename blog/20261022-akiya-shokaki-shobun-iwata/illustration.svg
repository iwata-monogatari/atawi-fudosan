<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">実家の消火器を引き渡すまでの確認</title><desc id="desc">空き家の消火器について、本数や状態を記録し、引取窓口へ費用と予約を確認し、最後に手配担当と完了記録を決める三段階の図。市の通常収集とは別の経路で相談する。</desc><rect width="800" height="720" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="54" font-size="27" font-weight="bold">実家の消火器を引き渡すまでの確認</text><rect x="30" y="90" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="133" r="23" fill="#0e5c8a"/><text x="69" y="142" text-anchor="middle" fill="white" font-size="26">1</text><text x="109" y="140" font-size="27" font-weight="bold">状態を伝える</text><text x="109" y="191" font-size="25">本数・種類・見える表示を記録</text><text x="109" y="230" font-size="23">状態が悪い物は動かす前に相談</text><rect x="30" y="285" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="328" r="23" fill="#0e5c8a"/><text x="69" y="337" text-anchor="middle" fill="white" font-size="26">2</text><text x="109" y="335" font-size="27" font-weight="bold">費用を確かめる</text><text x="109" y="386" font-size="25">持込み・引取り・予約を確認</text><text x="109" y="425" font-size="23">一括処分の対象か見積書で照合</text><rect x="30" y="480" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="523" r="23" fill="#0e5c8a"/><text x="69" y="532" text-anchor="middle" fill="white" font-size="26">3</text><text x="109" y="530" font-size="27" font-weight="bold">担当を決める</text><text x="109" y="581" font-size="25">家族・業者の誰がいつ手配するか</text><text x="109" y="620" font-size="23">引渡し前に完了の記録を残す</text><text x="40" y="704" font-size="17">2026年10月22日確認｜本文の出典と個別条件を照合</text></g></svg>