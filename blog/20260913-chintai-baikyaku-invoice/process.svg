<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img"><rect width="1000" height="340" rx="18" fill="#e9f5fc"/><g font-family="Yu Gothic, sans-serif" fill="#1e3f55"><text x="45" y="54" font-size="27" font-weight="bold">値引きの前に、3つの計算を順番に確認</text><rect x="35" y="90" width="285" height="175" rx="12" fill="white" stroke="#2E9BD4" stroke-width="2"/><circle cx="71" cy="125" r="20" fill="#0e5c8a"/><text x="64" y="133" fill="white" font-size="23">1</text><text x="55" y="179" font-size="25" font-weight="bold">売主の納税</text><text x="55" y="222" font-size="20">登録・課税売上を確認</text><path d="M329 169h20l-7 -7m7 7l-7 7" fill="none" stroke="#16709f" stroke-width="3"/><rect x="360" y="90" width="285" height="175" rx="12" fill="white" stroke="#2E9BD4" stroke-width="2"/><circle cx="396" cy="125" r="20" fill="#0e5c8a"/><text x="389" y="133" fill="white" font-size="23">2</text><text x="380" y="179" font-size="25" font-weight="bold">買主の控除</text><text x="380" y="222" font-size="20">用途と計算方式を確認</text><path d="M654 169h20l-7 -7m7 7l-7 7" fill="none" stroke="#16709f" stroke-width="3"/><rect x="685" y="90" width="285" height="175" rx="12" fill="white" stroke="#2E9BD4" stroke-width="2"/><circle cx="721" cy="125" r="20" fill="#0e5c8a"/><text x="714" y="133" fill="white" font-size="23">3</text><text x="705" y="179" font-size="25" font-weight="bold">価格の交渉</text><text x="705" y="222" font-size="20">両者の手取りで比較</text><text x="45" y="310" font-size="19">2026年10月からの70％は、物件価格に掛ける割合ではありません。</text></g></svg>