<svg xmlns="http://www.w3.org/2000/svg" width="400" height="749" viewBox="0 0 400 749" role="img" aria-labelledby="t d">
<title id="t">切り離しの確認手順</title>
<desc id="d">権利の形、界壁の構造、隣戸の同意、法適合の順に確認し、難しければ切り離さない売却へ切り替える。</desc>
<rect width="400" height="749" rx="18" fill="#f2f5ee"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#5a6b2f">切り離しの確認手順</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#a9bb7d"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#5a6b2f">権利の形を見る</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">長屋か区分所有かを</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">登記簿で確認する</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#7d9450" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#a9bb7d"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#5a6b2f">界壁を確かめる</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">壁の構造と、残す側の</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">防火・遮音の適合を見る</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#7d9450" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#fff" stroke="#a9bb7d"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#5a6b2f">隣戸と取り決める</text>
<text x="36" y="454" font-size="20" fill="#1e3f55">切り離しの同意と補修・</text>
<text x="36" y="482" font-size="20" fill="#1e3f55">費用分担を書面にする</text>
<path d="M200 517v12m-5-5 5 5 5-5" fill="none" stroke="#7d9450" stroke-width="2"/>
<rect x="20" y="531" width="360" height="136" rx="12" fill="#5a6b2f"/>
<text x="36" y="567" font-size="24" font-weight="bold" fill="#fff">売り方を決める</text>
<text x="36" y="607" font-size="20" font-weight="bold" fill="#fff">切り離し売却か、一戸の</text>
<text x="36" y="635" font-size="20" font-weight="bold" fill="#fff">まま・一括の売却かを選ぶ</text>
<text x="24" y="703" font-size="20" fill="#1e3f55">切り離しは両側の工事。同意は書面で残す。</text>
<text x="24" y="731" font-size="20" fill="#4e7288">出典：国土交通省・建築基準法をもとに作成</text>
</g></svg>
