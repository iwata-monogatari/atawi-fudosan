<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img"><rect width="1000" height="340" rx="18" fill="#e9f5fc"/><g font-family="Yu Gothic, sans-serif" fill="#1e3f55"><text x="45" y="54" font-size="27" font-weight="bold">所在調査から売却へ。3つの確認を分ける</text><rect x="35" y="90" width="285" height="175" rx="12" fill="white" stroke="#2E9BD4" stroke-width="2"/><circle cx="71" cy="125" r="20" fill="#0e5c8a"/><text x="64" y="133" fill="white" font-size="23">1</text><text x="55" y="179" font-size="25" font-weight="bold">所在の調査</text><text x="55" y="222" font-size="20">連絡経過と資料を残す</text><path d="M329 169h20l-7 -7m7 7l-7 7" fill="none" stroke="#16709f" stroke-width="3"/><rect x="360" y="90" width="285" height="175" rx="12" fill="white" stroke="#2E9BD4" stroke-width="2"/><circle cx="396" cy="125" r="20" fill="#0e5c8a"/><text x="389" y="133" fill="white" font-size="23">2</text><text x="380" y="179" font-size="25" font-weight="bold">管理人の選任</text><text x="380" y="222" font-size="20">家裁が適格性を判断</text><path d="M654 169h20l-7 -7m7 7l-7 7" fill="none" stroke="#16709f" stroke-width="3"/><rect x="685" y="90" width="285" height="175" rx="12" fill="white" stroke="#2E9BD4" stroke-width="2"/><circle cx="721" cy="125" r="20" fill="#0e5c8a"/><text x="714" y="133" fill="white" font-size="23">3</text><text x="705" y="179" font-size="25" font-weight="bold">必要な許可</text><text x="705" y="222" font-size="20">分割・売却の条件確認</text><text x="45" y="310" font-size="19">選任だけで売却はできません。売却後も財産管理が続く場合があります。</text></g></svg>