<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">売買代金1,000万円の場合の基本手数料</title><desc id="desc">仮に売買代金が1,000万円の場合、2倍の2,000万円を目的価額として手数料表に当てはめると基本手数料が26,000円となり、交付費用や登記費用は別に確認する計算図</desc><rect width="1000" height="440" rx="20" fill="#e9f5fc"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#1e3f55"><text x="500" y="70" text-anchor="middle" font-size="31" font-weight="bold">売買代金1,000万円の場合の基本手数料</text><rect x="40" y="135" width="280" height="225" rx="18" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="180" cy="184" r="25" fill="#0e5c8a"/><text x="180" y="194" fill="white" font-size="28" text-anchor="middle">1</text><text x="180" y="244" font-size="25" text-anchor="middle" font-weight="bold">売買代金</text><text x="180" y="289" font-size="22" text-anchor="middle">1,000万円</text><text x="180" y="326" font-size="19" text-anchor="middle">当事者が合意する代金</text><path d="M328 245h23m-9-9 9 9-9 9" fill="none" stroke="#2E9BD4" stroke-width="4"/><rect x="360" y="135" width="280" height="225" rx="18" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="500" cy="184" r="25" fill="#0e5c8a"/><text x="500" y="194" fill="white" font-size="28" text-anchor="middle">2</text><text x="500" y="244" font-size="25" text-anchor="middle" font-weight="bold">目的価額</text><text x="500" y="289" font-size="22" text-anchor="middle">2,000万円</text><text x="500" y="326" font-size="19" text-anchor="middle">売買代金 × 2</text><path d="M648 245h23m-9-9 9 9-9 9" fill="none" stroke="#2E9BD4" stroke-width="4"/><rect x="680" y="135" width="280" height="225" rx="18" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="820" cy="184" r="25" fill="#0e5c8a"/><text x="820" y="194" fill="white" font-size="28" text-anchor="middle">3</text><text x="820" y="244" font-size="25" text-anchor="middle" font-weight="bold">基本手数料</text><text x="820" y="289" font-size="22" text-anchor="middle">26,000円</text><text x="820" y="326" font-size="19" text-anchor="middle">交付などの費用は別</text><text x="500" y="407" text-anchor="middle" font-size="20">2025年10月1日施行の表。登記費用まで含む総額ではありません。</text></g></svg>