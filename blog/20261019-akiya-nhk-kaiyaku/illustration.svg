<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">空き家の受信契約を確認する順番</title><desc id="desc">空き家のNHK受信契約の確認手順。実家と施設などの移転先で受信機と配信利用を確認し、契約名義と住所を照合してから、NHKに事情を届け出て解約日と前払いの精算を確認する3段の整理図。</desc><rect width="800" height="720" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="54" font-size="27" font-weight="bold">空き家の受信契約を確認する順番</text><rect x="30" y="90" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="133" r="23" fill="#0e5c8a"/><text x="69" y="142" text-anchor="middle" fill="white" font-size="26">1</text><text x="109" y="140" font-size="27" font-weight="bold">実家と移転先を分けて確認</text><text x="109" y="191" font-size="25">受信機が残っているか</text><text x="109" y="230" font-size="23">配信を利用しているか</text><rect x="30" y="285" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="328" r="23" fill="#0e5c8a"/><text x="69" y="337" text-anchor="middle" fill="white" font-size="26">2</text><text x="109" y="335" font-size="27" font-weight="bold">契約名義と住所を照合</text><text x="109" y="386" font-size="25">誰の、どの住居の契約か</text><text x="109" y="425" font-size="23">施設入居だけで自動解約ではない</text><rect x="30" y="480" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="523" r="23" fill="#0e5c8a"/><text x="69" y="532" text-anchor="middle" fill="white" font-size="26">3</text><text x="109" y="530" font-size="27" font-weight="bold">NHKへ事情を届け出る</text><text x="109" y="581" font-size="25">契約を要しない状態を確認</text><text x="109" y="620" font-size="23">解約日と前払分の精算も照会</text><text x="40" y="704" font-size="17">2026年10月19日確認｜本文の出典と個別条件を照合</text></g></svg>