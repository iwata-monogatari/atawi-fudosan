<svg xmlns="http://www.w3.org/2000/svg" width="640" height="590" viewBox="0 0 640 590" role="img" aria-labelledby="t"><title id="t">普通車を一人が相続するときの書類選び</title><rect width="640" height="590" rx="22" fill="#eff5f8"/><g font-family="sans-serif" fill="#193954"><text x="32" y="48" font-size="29" font-weight="bold">協議で普通車を一人が継ぐ場合</text><rect x="28" y="77" width="584" height="94" rx="12" fill="#183e5b"/><text x="53" y="118" fill="white" font-size="24">車検証で所有者と車台番号を確認</text><text x="53" y="150" fill="white" font-size="21">家族で車の取得者に合意</text><path d="M320 171v30" stroke="#548398" stroke-width="4"/><rect x="28" y="201" width="584" height="154" rx="12" fill="#dbefe9"/><text x="52" y="243" font-weight="bold" font-size="26">査定額100万円以下の資料がある</text><text x="52" y="287" font-size="22">申立書を使う同意がある場合</text><text x="52" y="328" font-size="25">→ 遺産分割協議成立申立書も選べる</text><rect x="28" y="380" width="584" height="145" rx="12" fill="#fff"/><text x="52" y="425" font-weight="bold" font-size="26">100万円超、または査定資料がない</text><text x="52" y="473" font-size="25">→ 全員が実印を押した協議書を用意</text><text x="52" y="504" font-size="19">協議による相続の通常の手続</text><text x="32" y="565" font-size="20">100万円ちょうどは「以下」に含まれます。</text></g></svg>