<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">決める前に、期限と調査を整理</title><desc id="desc">熟慮期間の伸長を相談する準備として、相続を知った日の資料、実家と負債の未調査項目、期限内の家庭裁判所への申立てを順に整理した図。自動的な延長ではないことを示す。</desc><rect width="800" height="720" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="54" font-size="27" font-weight="bold">決める前に、期限と調査を整理</text><rect x="30" y="90" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="133" r="23" fill="#0e5c8a"/><text x="69" y="142" text-anchor="middle" fill="white" font-size="26">1</text><text x="109" y="140" font-size="27" font-weight="bold">起算日を相談</text><text x="109" y="191" font-size="25">知った日と通知・戸籍を整理</text><text x="109" y="230" font-size="23">死亡日と同じと決めつけない</text><rect x="30" y="285" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="328" r="23" fill="#0e5c8a"/><text x="69" y="337" text-anchor="middle" fill="white" font-size="26">2</text><text x="109" y="335" font-size="27" font-weight="bold">未調査を記録</text><text x="109" y="386" font-size="25">土地・建物・負債を一覧にする</text><text x="109" y="425" font-size="23">査定だけで相続全体を決めない</text><rect x="30" y="480" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="523" r="23" fill="#0e5c8a"/><text x="69" y="532" text-anchor="middle" fill="white" font-size="26">3</text><text x="109" y="530" font-size="27" font-weight="bold">期限内に申立て</text><text x="109" y="581" font-size="25">家庭裁判所と必要資料を確認</text><text x="109" y="620" font-size="23">自動延長でも必ず認める制度でもない</text><text x="40" y="704" font-size="17">2026年10月21日確認｜本文の出典と個別条件を照合</text></g></svg>