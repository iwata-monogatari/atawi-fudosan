<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">設備の記録は3段に分ける</title><desc id="desc">付帯設備表の記入を、引き渡す設備の有無、確認日と方法を含む作動確認、故障の記録と買主へ渡す書面の更新に分けた図。未確認を故障なしと扱わない。</desc><rect width="800" height="720" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="54" font-size="27" font-weight="bold">設備の記録は3段に分ける</text><rect x="30" y="90" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="133" r="23" fill="#0e5c8a"/><text x="69" y="142" text-anchor="middle" fill="white" font-size="26">1</text><text x="109" y="140" font-size="27" font-weight="bold">有無</text><text x="109" y="191" font-size="25">何を残して引き渡すか</text><text x="109" y="230" font-size="23">撤去する設備も別に記録</text><rect x="30" y="285" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="328" r="23" fill="#0e5c8a"/><text x="69" y="337" text-anchor="middle" fill="white" font-size="26">2</text><text x="109" y="335" font-size="27" font-weight="bold">作動確認</text><text x="109" y="386" font-size="25">いつ、誰が、何を試したか</text><text x="109" y="425" font-size="23">電気・水道停止など未確認理由も残す</text><rect x="30" y="480" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="523" r="23" fill="#0e5c8a"/><text x="69" y="532" text-anchor="middle" fill="white" font-size="26">3</text><text x="109" y="530" font-size="27" font-weight="bold">不具合と更新</text><text x="109" y="581" font-size="25">分かった故障を書面に反映</text><text x="109" y="620" font-size="23">買主へ渡した版と説明日を確認</text><text x="40" y="704" font-size="17">2026年10月20日確認｜本文の出典と個別条件を照合</text></g></svg>