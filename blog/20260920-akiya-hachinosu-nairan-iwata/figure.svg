<svg xmlns="http://www.w3.org/2000/svg" width="800" height="638" viewBox="0 0 800 638" role="img" aria-labelledby="title desc"><title id="title">蜂の巣発見から、内覧再開まで</title><desc id="desc">蜂の巣を発見した家族が仲介会社へ連絡し、仲介会社が買主側へ延期を伝え、売主が業者に費用と作業範囲を確認し、再開条件を共有して再予約する4段階の図</desc><rect width="800" height="638" rx="24" fill="#e9f5fc"/><g font-family="Yu Gothic,Meiryo,sans-serif"><text x="40" y="60" font-size="30" font-weight="bold" fill="#0e5c8a">蜂の巣発見から、内覧再開まで</text><rect x="35" y="90" width="730" height="102" rx="14" fill="white" stroke="#cde2f0"/><circle cx="80" cy="138" r="25" fill="#16709f"/><text x="80" y="148" text-anchor="middle" font-size="29" fill="white">1</text><text x="125" y="130" font-size="28" font-weight="bold" fill="#0e5c8a">発見した家族 → 仲介会社</text><text x="125" y="167" font-size="22" fill="#1e3f55">近づかず、場所と予約日時を伝える</text><rect x="35" y="212" width="730" height="102" rx="14" fill="white" stroke="#cde2f0"/><circle cx="80" cy="260" r="25" fill="#16709f"/><text x="80" y="270" text-anchor="middle" font-size="29" fill="white">2</text><text x="125" y="252" font-size="28" font-weight="bold" fill="#0e5c8a">仲介会社 → 買主側</text><text x="125" y="289" font-size="22" fill="#1e3f55">内覧の延期を伝え、連絡の到達を確認</text><rect x="35" y="334" width="730" height="102" rx="14" fill="white" stroke="#cde2f0"/><circle cx="80" cy="382" r="25" fill="#16709f"/><text x="80" y="392" text-anchor="middle" font-size="29" fill="white">3</text><text x="125" y="374" font-size="28" font-weight="bold" fill="#0e5c8a">売主・家族 → 駆除業者</text><text x="125" y="411" font-size="22" fill="#1e3f55">費用と作業範囲、再開条件を確認</text><rect x="35" y="456" width="730" height="102" rx="14" fill="white" stroke="#cde2f0"/><circle cx="80" cy="504" r="25" fill="#16709f"/><text x="80" y="514" text-anchor="middle" font-size="29" fill="white">4</text><text x="125" y="496" font-size="28" font-weight="bold" fill="#0e5c8a">売主・仲介会社 → 再予約</text><text x="125" y="533" font-size="22" fill="#1e3f55">業者の指示と案内経路を確認して決定</text></g></svg>