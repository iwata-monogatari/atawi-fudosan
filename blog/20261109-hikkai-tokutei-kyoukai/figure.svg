<svg xmlns="http://www.w3.org/2000/svg" width="400" height="640" viewBox="0 0 400 640" role="img" aria-labelledby="t d"><title id="t">筆界特定の費用は2種類</title><desc id="d">申請手数料は対象土地の価格で決まり、目安は400万円まで800円、2,000万円まで4,000円、4,000万円まで8,000円。測量などの費用は申請人が負担し、概算額の予納が必要。</desc><rect width="400" height="640" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif"><text x="24" y="44" font-size="25" font-weight="bold" fill="#0e5c8a">筆界特定の費用は2種類</text><rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#2e9bd4"/><text x="36" y="108" font-size="24" font-weight="bold" fill="#0e5c8a">申請手数料</text><text x="36" y="148" font-size="20" fill="#1e3f55">対象土地の価格で決まる</text><text x="36" y="176" font-size="20" fill="#1e3f55">合計4,000万円で8,000円</text><path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#16709f" stroke-width="2"/><rect x="20" y="226" width="360" height="164" rx="12" fill="#fff" stroke="#2e9bd4"/><text x="36" y="262" font-size="24" font-weight="bold" fill="#0e5c8a">手数料の目安</text><text x="36" y="302" font-size="20" fill="#1e3f55">400万円まで 800円</text><text x="36" y="330" font-size="20" fill="#1e3f55">2,000万円まで 4,000円</text><text x="36" y="358" font-size="20" fill="#1e3f55">4,000万円まで 8,000円</text><path d="M200 393v12m-5-5 5 5 5-5" fill="none" stroke="#16709f" stroke-width="2"/><rect x="20" y="408" width="360" height="136" rx="12" fill="#fff" stroke="#2e9bd4"/><text x="36" y="444" font-size="24" font-weight="bold" fill="#0e5c8a">測量などの費用</text><text x="36" y="484" font-size="20" fill="#1e3f55">申請人が負担する</text><text x="36" y="512" font-size="20" fill="#1e3f55">概算額の予納が必要</text><text x="24" y="594" font-size="20" fill="#4e7288">出典：法務局・政府広報オンライン</text><text x="24" y="622" font-size="20" fill="#4e7288">2026年11月9日確認</text></g></svg>