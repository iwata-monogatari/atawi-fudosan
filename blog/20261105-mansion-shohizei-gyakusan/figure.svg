<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-labelledby="t d"><title id="t">税額から購入時の建物代を求める</title><desc id="d">購入総額3,000万円の架空例。税額120万円を8％で割った建物本体は1,500万円。税込建物代1,620万円と土地代1,380万円の合計が購入総額になる。</desc><rect width="600" height="450" rx="18" fill="#f0f7fb"/><g font-family="Meiryo,sans-serif" fill="#163d56"><text x="28" y="45" font-size="28" font-weight="bold">購入代金3,000万円の内訳</text><text x="28" y="83" font-size="22">架空例　購入時の適用税率 8％</text><rect x="26" y="110" width="548" height="118" rx="12" fill="#fff"/><text x="45" y="155" font-size="23">建物本体　120万円 ÷ 0.08</text><text x="45" y="204" font-size="30" font-weight="bold">1,500万円</text><text x="28" y="272" font-size="22">税額120万円を足すと税込1,620万円</text><rect x="28" y="296" width="294" height="84" rx="6" fill="#145878"/><rect x="324" y="296" width="248" height="84" rx="6" fill="#326958"/><g fill="white" font-size="21" text-anchor="middle"><text x="175" y="329">税込の建物代</text><text x="175" y="364" font-size="26">1,620万円</text><text x="447" y="329">土地代</text><text x="447" y="364" font-size="26">1,380万円</text></g><text x="28" y="422" font-size="20">購入時の建物代は、減価償却を考慮する前の額。</text></g></svg>