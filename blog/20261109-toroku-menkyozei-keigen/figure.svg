<svg xmlns="http://www.w3.org/2000/svg" width="400" height="640" viewBox="0 0 400 640" role="img" aria-labelledby="t d"><title id="t">登録免許税の軽減税率</title><desc id="d">土地の売買による移転は本則2％が1.5％で令和11年3月31日までの登記、住宅用家屋の移転は本則2％が0.3％で令和9年3月31日までの取得。住宅用家屋証明書は登記申請に添付する。</desc><rect width="400" height="640" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif"><text x="24" y="44" font-size="25" font-weight="bold" fill="#0e5c8a">登録免許税の軽減税率</text><rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#2e9bd4"/><text x="36" y="108" font-size="24" font-weight="bold" fill="#0e5c8a">土地の売買による移転</text><text x="36" y="148" font-size="20" fill="#1e3f55">本則2％ → 軽減1.5％</text><text x="36" y="176" font-size="20" fill="#1e3f55">令和11年3月31日までの登記</text><path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#16709f" stroke-width="2"/><rect x="20" y="226" width="360" height="136" rx="12" fill="#fff" stroke="#2e9bd4"/><text x="36" y="262" font-size="24" font-weight="bold" fill="#0e5c8a">住宅用家屋の移転</text><text x="36" y="302" font-size="20" fill="#1e3f55">本則2％ → 軽減0.3％</text><text x="36" y="330" font-size="20" fill="#1e3f55">令和9年3月31日までの取得</text><path d="M200 365v12m-5-5 5 5 5-5" fill="none" stroke="#16709f" stroke-width="2"/><rect x="20" y="380" width="360" height="164" rx="12" fill="#fff" stroke="#2e9bd4"/><text x="36" y="416" font-size="24" font-weight="bold" fill="#0e5c8a">証明書は登記の前に</text><text x="36" y="456" font-size="20" fill="#1e3f55">住宅用家屋証明書を</text><text x="36" y="484" font-size="20" fill="#1e3f55">登記申請に添付する</text><text x="36" y="512" font-size="20" fill="#1e3f55">登記後の提出は適用不可</text><text x="24" y="594" font-size="20" fill="#4e7288">出典：国税庁・国土交通省</text><text x="24" y="622" font-size="20" fill="#4e7288">2026年11月9日確認</text></g></svg>