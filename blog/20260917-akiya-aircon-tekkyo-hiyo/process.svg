<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img"><title>エアコン撤去の見積書は、3つの箱で読む</title><desc>空き家のエアコン撤去費用を3項目に分けた図。取り外し工事と収集運搬は個別に見積もり、2026年2月1日から対象のパナソニック製・三洋電機製家庭用エアコンのリサイクル料金は1台税込550円。550円だけで撤去総額を判断しない。</desc><rect width="1200" height="660" rx="24" fill="#e9f5fc"/><g font-family="Yu Gothic, sans-serif" fill="#1e3f55"><text x="60" y="80" font-size="34" font-weight="700">エアコン撤去の見積書は、3つの箱で読む</text><rect x="45" y="145" width="330" height="270" rx="16" fill="white" stroke="#2E9BD4" stroke-width="3"/><text x="210" y="210" text-anchor="middle" font-size="28" font-weight="700">1 取り外し</text><text x="210" y="282" text-anchor="middle" font-size="28" font-weight="700">工事料金を確認</text><text x="210" y="354" text-anchor="middle" font-size="20" font-weight="400">設置場所・電源・穴処理</text><path d="M387 263 l24 17 -24 17" fill="none" stroke="#16709f" stroke-width="5"/><rect x="435" y="145" width="330" height="270" rx="16" fill="white" stroke="#2E9BD4" stroke-width="3"/><text x="600" y="210" text-anchor="middle" font-size="28" font-weight="700">2 収集運搬</text><text x="600" y="282" text-anchor="middle" font-size="28" font-weight="700">運搬料金を確認</text><text x="600" y="354" text-anchor="middle" font-size="20" font-weight="400">台数・搬出経路・引取先</text><path d="M777 263 l24 17 -24 17" fill="none" stroke="#16709f" stroke-width="5"/><rect x="825" y="145" width="330" height="270" rx="16" fill="white" stroke="#2E9BD4" stroke-width="3"/><text x="990" y="210" text-anchor="middle" font-size="28" font-weight="700">3 リサイクル</text><text x="990" y="282" text-anchor="middle" font-size="28" font-weight="700">対象機種は550円</text><text x="990" y="354" text-anchor="middle" font-size="20" font-weight="400">パナソニック製・三洋電機製</text><text x="60" y="505" font-size="25">550円は税込・1台分。2026年2月1日からの家庭用対象機器の料金。</text><text x="60" y="565" font-size="25">撤去総額は、作業範囲と追加費用を含む見積書で確認します。</text></g></svg>