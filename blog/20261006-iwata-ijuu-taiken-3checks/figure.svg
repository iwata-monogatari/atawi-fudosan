<svg xmlns="http://www.w3.org/2000/svg" width="760" height="690" viewBox="0 0 760 690" role="img"><title>移住体験で持ち帰る3つの材料</title><desc>磐田市の移住体験で確認する生活動線、住居見学の範囲、住居費の三つを示した図。観光と日常の移動、住居見学と購入前調査、ツアー費用と移住後の家計を区別して持ち帰る資料を整理する。</desc><rect width="760" height="690" fill="#f2f9fe"/><style>text{font-family:Yu Gothic,Meiryo,sans-serif;fill:#1e3f55}</style><rect width="760" height="98" fill="#0e5c8a"/><text x="34" y="62" font-size="30" font-weight="bold" style="fill:white">移住体験で持ち帰る3つの材料</text><rect x="24" y="122" width="712" height="150" rx="12" fill="white" stroke="#cde2f0"/><rect x="24" y="122" width="8" height="150" rx="4" fill="#2E9BD4"/><text x="50" y="160" font-size="26" font-weight="bold">1 生活動線</text><text x="50" y="205" font-size="24">買い物・通勤・通院に使う手段</text><text x="50" y="245" font-size="24">観光の移動と日常の移動を分ける</text><rect x="24" y="296" width="712" height="150" rx="12" fill="white" stroke="#cde2f0"/><rect x="24" y="296" width="8" height="150" rx="4" fill="#2E9BD4"/><text x="50" y="334" font-size="26" font-weight="bold">2 見学の範囲</text><text x="50" y="379" font-size="24">住居見学 ≠ 売買対象の内覧と断定</text><text x="50" y="419" font-size="24">価格・所在地・権利条件は別に確認</text><rect x="24" y="470" width="712" height="150" rx="12" fill="white" stroke="#cde2f0"/><rect x="24" y="470" width="8" height="150" rx="4" fill="#2E9BD4"/><text x="50" y="508" font-size="26" font-weight="bold">3 住居費</text><text x="50" y="553" font-size="24">ツアー費用と移住後の家計を分ける</text><text x="50" y="593" font-size="24">家賃・購入・改修・往復交通費を比較</text><text x="30" y="664" font-size="18">2026年10月6日確認｜公式情報をもとに筆者作成</text></svg>