<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">保証債務の特例は3要件すべてを確認</title><desc id="desc">保証債務のため不動産を売却した場合の税の特例について、保証をした時点の返済能力、保証債務を履行するための売却であること、肩代わりした額の全部または一部が回収不能であることの3要件を上から示した確認図。</desc><rect width="800" height="720" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="54" font-size="27" font-weight="bold">保証債務の特例は3要件すべてを確認</text><rect x="30" y="90" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="133" r="23" fill="#0e5c8a"/><text x="69" y="142" text-anchor="middle" fill="white" font-size="26">1</text><text x="109" y="140" font-size="27" font-weight="bold">保証した時点の事情</text><text x="109" y="191" font-size="25">既に返済不能の相手を</text><text x="109" y="230" font-size="23">保証したものではないこと</text><rect x="30" y="285" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="328" r="23" fill="#0e5c8a"/><text x="69" y="337" text-anchor="middle" fill="white" font-size="26">2</text><text x="109" y="335" font-size="27" font-weight="bold">土地建物を売った目的</text><text x="109" y="386" font-size="25">保証債務を履行するための売却</text><text x="109" y="425" font-size="23">自分の借入返済と混同しない</text><rect x="30" y="480" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="523" r="23" fill="#0e5c8a"/><text x="69" y="532" text-anchor="middle" fill="white" font-size="26">3</text><text x="109" y="530" font-size="27" font-weight="bold">肩代わり分を回収できるか</text><text x="109" y="581" font-size="25">全額または一部の回収が不能</text><text x="109" y="620" font-size="23">返してもらわないだけでは足りない</text><text x="40" y="704" font-size="17">2026年10月19日確認｜本文の出典と個別条件を照合</text></g></svg>