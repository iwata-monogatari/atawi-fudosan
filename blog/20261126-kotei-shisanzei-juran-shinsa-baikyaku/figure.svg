<svg xmlns="http://www.w3.org/2000/svg" width="400" height="749" viewBox="0 0 400 749" role="img" aria-labelledby="t d">
<title id="t">評価額の確認と申出の流れ</title>
<desc id="d">縦覧帳簿で比較し、疑問があれば期限内に固定資産評価審査委員会へ審査申出をする。</desc>
<rect width="400" height="749" rx="18" fill="#f3efe4"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#6b551e">評価額の確認と申出の流れ</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#bbaa7d"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#6b551e">縦覧帳簿で比べる</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">公示期間中に市町村窓口で</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">他の土地・家屋の評価額と比較</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#96762e" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#bbaa7d"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#6b551e">疑問点を整理する</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">地積・地目・家屋の構造など</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">登録内容の事実関係を確認</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#96762e" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#fff" stroke="#bbaa7d"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#6b551e">審査申出をする</text>
<text x="36" y="454" font-size="20" fill="#1e3f55">固定資産評価審査委員会へ</text>
<text x="36" y="482" font-size="20" fill="#1e3f55">期限内に書面で申し出る</text>
<path d="M200 517v12m-5-5 5 5 5-5" fill="none" stroke="#96762e" stroke-width="2"/>
<rect x="20" y="531" width="360" height="136" rx="12" fill="#6b551e"/>
<text x="36" y="567" font-size="24" font-weight="bold" fill="#fff">決定を受け取る</text>
<text x="36" y="607" font-size="20" font-weight="bold" fill="#fff">委員会の決定に不服なら</text>
<text x="36" y="635" font-size="20" font-weight="bold" fill="#fff">訴訟で争う道もある</text>
<text x="24" y="703" font-size="20" fill="#1e3f55">審査申出には期限があります。</text>
<text x="24" y="731" font-size="20" fill="#4e7288">出典：総務省「固定資産税の概要」案内をもとに作成</text>
</g></svg>
