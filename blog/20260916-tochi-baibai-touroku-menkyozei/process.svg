<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">売買価格と、登録免許税の計算を分ける</title><desc id="desc">説明用の設例。売買価格1,800万円を計算の基礎とせず、固定資産課税台帳の価格1,000万円に軽減税率1.5％を掛け、土地売買の所有権移転登記の登録免許税を15万円と計算する。報酬や実費は含めない。</desc><rect width="1200" height="660" rx="24" fill="#e9f5fc"/><g font-family="Yu Gothic, sans-serif" fill="#1e3f55"><text x="60" y="82" font-size="36" font-weight="700">売買価格と、登録免許税の計算を分ける</text><rect x="50" y="145" width="340" height="315" rx="18" fill="white" stroke="#cde2f0" stroke-width="3"/><rect x="50" y="145" width="340" height="74" rx="18" fill="#0e5c8a"/><text x="75" y="193" font-size="28" fill="white" font-weight="700">売買契約の価格</text><text x="75" y="260" font-size="25" fill="#1e3f55" font-weight="400">1,800万円</text><text x="75" y="313" font-size="25" fill="#1e3f55" font-weight="400">この金額とは区別</text><path d="M 400 295 l 20 15 -20 15" fill="none" stroke="#2E9BD4" stroke-width="5"/><rect x="430" y="145" width="340" height="315" rx="18" fill="white" stroke="#cde2f0" stroke-width="3"/><rect x="430" y="145" width="340" height="74" rx="18" fill="#0e5c8a"/><text x="455" y="193" font-size="28" fill="white" font-weight="700">計算に使う価額</text><text x="455" y="260" font-size="25" fill="#1e3f55" font-weight="400">台帳価格1,000万円</text><text x="455" y="313" font-size="25" fill="#1e3f55" font-weight="400">× 軽減税率1.5％</text><path d="M 780 295 l 20 15 -20 15" fill="none" stroke="#2E9BD4" stroke-width="5"/><rect x="810" y="145" width="340" height="315" rx="18" fill="white" stroke="#cde2f0" stroke-width="3"/><rect x="810" y="145" width="340" height="74" rx="18" fill="#0e5c8a"/><text x="835" y="193" font-size="28" fill="white" font-weight="700">登録免許税の例</text><text x="835" y="260" font-size="25" fill="#1e3f55" font-weight="400">15万円</text><text x="835" y="313" font-size="25" fill="#1e3f55" font-weight="400">報酬・実費は別</text><text x="60" y="535" font-size="25">設例：土地の所有権全部を売買し、軽減税率が適用される場合。</text><text x="60" y="578" font-size="25">登記を受ける時期・課税標準・負担者は、専門家に確認を。</text></g></svg>