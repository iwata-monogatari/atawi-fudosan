<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img"><title>リモート遺言は、準備から順番に</title><rect width="1000" height="620" rx="24" fill="#e9f5fc"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="50" y="72" font-size="32" font-weight="bold">リモート遺言は、準備から順番に</text><rect x="50" y="112" width="440" height="165" rx="16" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="88" cy="155" r="23" fill="#0e5c8a"/><text x="80" y="165" font-size="28" fill="white">1</text><text x="125" y="164" font-size="27" font-weight="bold">資料をそろえる</text><text x="75" y="224" font-size="24">本人・相続人・実家</text><rect x="510" y="112" width="440" height="165" rx="16" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="548" cy="155" r="23" fill="#0e5c8a"/><text x="540" y="165" font-size="28" fill="white">2</text><text x="585" y="164" font-size="27" font-weight="bold">利用可否を相談</text><text x="535" y="224" font-size="24">公証人が判断</text><rect x="50" y="302" width="440" height="165" rx="16" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="88" cy="345" r="23" fill="#0e5c8a"/><text x="80" y="355" font-size="28" fill="white">3</text><text x="125" y="354" font-size="27" font-weight="bold">環境を確認</text><text x="75" y="414" font-size="24">機器・部屋・立会人</text><rect x="510" y="302" width="440" height="165" rx="16" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="548" cy="345" r="23" fill="#0e5c8a"/><text x="540" y="355" font-size="28" fill="white">4</text><text x="585" y="354" font-size="27" font-weight="bold">本人が内容確認</text><text x="535" y="414" font-size="24">家族が代わりに決めない</text><text x="50" y="555" font-size="24">出張・対面という選択肢も、公証役場に相談する</text><text x="50" y="592" font-size="18" fill="#5b7488">大石の不動産ブログ｜2026年9月23日確認</text></g></svg>