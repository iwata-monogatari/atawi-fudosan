<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">基準地は所在地だけで選ばない</title><desc id="desc">二之宮東の磐田-2と福田の磐田-8の用途地域・地積・道路条件を比較。実際の位置関係や縮尺を表す地図ではない。</desc>
<rect width="1000" height="560" rx="20" fill="#e9f5fc"/>
<g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="45" y="58" font-size="30" font-weight="bold">同じ住宅地でも、単価の前提が違う</text>
<g fill="white" stroke="#cde2f0" stroke-width="2"><rect x="40" y="90" width="440" height="365" rx="14"/><rect x="520" y="90" width="440" height="365" rx="14"/></g>
<g text-anchor="middle"><text x="260" y="132" font-size="26" font-weight="bold">磐田-2　二之宮東</text><text x="740" y="132" font-size="26" font-weight="bold">磐田-8　福田</text>
<text x="260" y="171" font-size="28" fill="#0e5c8a">85,400円／㎡</text><text x="740" y="171" font-size="28" fill="#0e5c8a">9,580円／㎡</text>
<path d="M195 300V237l65-45 65 45v63Z" fill="#b8dcf0" stroke="#16709f" stroke-width="3"/><path d="M675 350v-63l65-45 65 45v63Z" fill="#b8dcf0" stroke="#16709f" stroke-width="3"/>
<rect x="85" y="318" width="350" height="42" rx="4" fill="#0e5c8a"/><rect x="565" y="194" width="350" height="35" rx="4" fill="#0e5c8a"/>
<text x="260" y="347" font-size="22" fill="white">南側 6m 市道</text><text x="740" y="219" font-size="22" fill="white">北側 4m 市道</text>
<text x="260" y="278" font-size="22">201㎡</text><text x="740" y="327" font-size="22">227㎡</text>
<text x="260" y="407" font-size="24">第二種住居地域</text><text x="740" y="407" font-size="24">第一種住居地域</text></g>
<text x="45" y="502" font-size="25" font-weight="bold" fill="#0e5c8a">実家の「用途・接道・広さ」を並べ、条件の違いを確認する。</text><text x="45" y="538" font-size="18" fill="#5b7488">出典：2026年静岡県地価調査・県公報。配置は説明用の模式図で、縮尺はありません。</text></g></svg>
