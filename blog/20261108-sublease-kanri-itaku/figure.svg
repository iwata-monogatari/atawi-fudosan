<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600" role="img" aria-labelledby="t d">
<title id="t">家賃だけで決めない</title>
<desc id="d">収入：家賃の変更条件を見る。終了：誰がどう解約できるか。売却：残る契約を確認する</desc>
<rect width="400" height="600" rx="18" fill="#f2f9fe"/>
<text x="24" y="44" font-family="Yu Gothic,Meiryo,sans-serif" font-size="25" font-weight="bold" fill="#0e5c8a">家賃だけで決めない</text>
<rect x="20" y="72" width="360" height="108" rx="12" fill="#fff" stroke="#2e9bd4"/>
<text x="36" y="108" font-family="Yu Gothic,Meiryo,sans-serif" font-size="24" font-weight="bold" fill="#0e5c8a">収入</text>
<text x="36" y="148" font-family="Yu Gothic,Meiryo,sans-serif" font-size="20" fill="#1e3f55">家賃の変更条件を見る</text>
<path d="M200 183v12m-5-5 5 5 5-5" fill="none" stroke="#16709f" stroke-width="2"/>
<rect x="20" y="198" width="360" height="108" rx="12" fill="#fff" stroke="#2e9bd4"/>
<text x="36" y="234" font-family="Yu Gothic,Meiryo,sans-serif" font-size="24" font-weight="bold" fill="#0e5c8a">終了</text>
<text x="36" y="274" font-family="Yu Gothic,Meiryo,sans-serif" font-size="20" fill="#1e3f55">誰がどう解約できるか</text>
<path d="M200 309v12m-5-5 5 5 5-5" fill="none" stroke="#16709f" stroke-width="2"/>
<rect x="20" y="324" width="360" height="108" rx="12" fill="#fff" stroke="#2e9bd4"/>
<text x="36" y="360" font-family="Yu Gothic,Meiryo,sans-serif" font-size="24" font-weight="bold" fill="#0e5c8a">売却</text>
<text x="36" y="400" font-family="Yu Gothic,Meiryo,sans-serif" font-size="20" fill="#1e3f55">残る契約を確認する</text>
<text x="24" y="482" font-family="Yu Gothic,Meiryo,sans-serif" font-size="20" fill="#1e3f55">個別の契約条件は</text>
<text x="24" y="510" font-family="Yu Gothic,Meiryo,sans-serif" font-size="20" fill="#1e3f55">契約書と専門家へ確認</text>
<text x="24" y="552" font-family="Yu Gothic,Meiryo,sans-serif" font-size="20" fill="#4e7288">出典：国土交通省</text><text x="24" y="582" font-family="Yu Gothic,Meiryo,sans-serif" font-size="20" fill="#4e7288">2026年11月確認</text></svg>