<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img"><title>通知先を追加する順番</title><rect width="720" height="480" fill="#eff6fa"/><g font-family="Meiryo,sans-serif"><text x="28" y="50" font-weight="bold" font-size="30" fill="#113c57">通知先を追加する順番</text><rect x="20" y="76" width="680" height="115" rx="14" fill="white"/><circle cx="62" cy="117" r="23" fill="#126383"/><text x="62" y="125" fill="white" text-anchor="middle" font-size="24">1</text><text x="104" y="124" fill="#103c59" font-weight="bold" font-size="28">現在の指定</text><text x="38" y="167" fill="#244757" font-size="22">残す人と変更する人を本人が確認</text><rect x="20" y="206" width="680" height="115" rx="14" fill="white"/><circle cx="62" cy="247" r="23" fill="#126383"/><text x="62" y="255" fill="white" text-anchor="middle" font-size="24">2</text><text x="104" y="254" fill="#103c59" font-weight="bold" font-size="28">変更の届出</text><text x="38" y="297" fill="#244757" font-size="22">通知先の氏名と現住所を照合</text><rect x="20" y="336" width="680" height="115" rx="14" fill="white"/><circle cx="62" cy="377" r="23" fill="#126383"/><text x="62" y="385" fill="white" text-anchor="middle" font-size="24">3</text><text x="104" y="384" fill="#103c59" font-weight="bold" font-size="28">死亡後の通知</text><text x="38" y="427" fill="#244757" font-size="22">届くのは保管の事実。名義変更とは別</text></g></svg>