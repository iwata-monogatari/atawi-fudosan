<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">旧地番と現在の土地を、順に照合</title><desc id="desc">旧地番と現在の土地を、順に照合。古い書類、住所・地番・作成時期、原本は書き換えず控えを作る。市へ確認、区画整理の事業名・公告、都市計画証明書の対象を確認。提出先へ確認、必要な証明・通数・添付物、売却や登記の書類へつなぐ。筆者の確認手順を示した説明図。</desc><rect width="960" height="600" rx="22" fill="#e9f5fc"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#1e3f55"><text x="40" y="62" font-size="31" font-weight="700">旧地番と現在の土地を、順に照合</text><rect x="32" y="92" width="896" height="130" rx="12" fill="white" stroke="#cde2f0"/><g transform="translate(42,104)" fill="none" stroke="#2e9bd4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 12h62v80H18Z M30 32h36 M30 50h36 M30 68h25"/></g><text x="160" y="128" font-size="25" font-weight="700">1　古い書類</text><text x="160" y="165" font-size="26">住所・地番・作成時期</text><text x="160" y="200" font-size="22" fill="#5b7488">原本は書き換えず控えを作る</text><rect x="32" y="242" width="896" height="130" rx="12" fill="white" stroke="#cde2f0"/><g transform="translate(42,254)" fill="none" stroke="#2e9bd4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 42L48 15 86 42 M17 45v43h62V45 M32 45v43 M63 45v43 M8 92h80"/></g><text x="160" y="278" font-size="25" font-weight="700">2　市へ確認</text><text x="160" y="315" font-size="26">区画整理の事業名・公告</text><text x="160" y="350" font-size="22" fill="#5b7488">都市計画証明書の対象を確認</text><rect x="32" y="392" width="896" height="130" rx="12" fill="white" stroke="#cde2f0"/><g transform="translate(42,404)" fill="none" stroke="#2e9bd4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 12h65v82H15Z M28 34h38 M28 51h38 M28 72l10 10 25-25"/></g><text x="160" y="428" font-size="25" font-weight="700">3　提出先へ確認</text><text x="160" y="465" font-size="26">必要な証明・通数・添付物</text><text x="160" y="500" font-size="22" fill="#5b7488">売却や登記の書類へつなぐ</text><text x="40" y="573" font-size="18" fill="#5b7488">大石浩之｜確認事項を整理するための筆者作成図</text></g></svg>