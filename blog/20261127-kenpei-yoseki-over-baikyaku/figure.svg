<svg xmlns="http://www.w3.org/2000/svg" width="400" height="596" viewBox="0 0 400 596" role="img" aria-labelledby="t d">
<title id="t">オーバーの2つの型</title>
<desc id="d">違反建築と既存不適格では、融資と増改築への影響が異なる。</desc>
<rect width="400" height="596" rx="18" fill="#f7eef5"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#6b1e54">オーバーの2つの型</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#bb7da9"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#6b1e54">違反建築物</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">建築当時の基準からも超過している</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">融資や増改築で不利になりやすい</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#963e7d" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#bb7da9"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#6b1e54">既存不適格建築物</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">建築当時は適法、後の改正で超過</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">現状のまま使用・売却は可能</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#963e7d" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#6b1e54"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#fff">切り分けの資料</text>
<text x="36" y="454" font-size="20" font-weight="bold" fill="#fff">確認済証・検査済証・当時の図面</text>
<text x="36" y="482" font-size="20" font-weight="bold" fill="#fff">増改築の履歴もあわせて確認</text>
<text x="24" y="550" font-size="20" fill="#1e3f55">「オーバー＝違法」と決めつけず、経緯で判断します。</text>
<text x="24" y="578" font-size="20" fill="#4e7288">出典：建築基準法・国土交通省の案内</text>
</g></svg>
