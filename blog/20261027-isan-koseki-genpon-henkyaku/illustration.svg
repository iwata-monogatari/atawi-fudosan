<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">静岡の案内で確認する3項目</title><desc id="desc">静岡家庭裁判所の家事審判・調停向け案内に基づき、提出先の手続を確認し、全ページを原本どおりにコピーし、提出後の原則不返却と審理終了までの原本保管を確認する説明図。</desc><rect width="800" height="720" rx="16" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="30" y="52" font-size="26" font-weight="bold">静岡の案内で確認する3項目</text><rect x="25" y="85" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="128" r="23" fill="#0e5c8a"/><text x="62" y="137" text-anchor="middle" fill="white" font-size="26">1</text><text x="102" y="136" font-size="27" font-weight="bold">提出先と手続を確かめる</text><text x="45" y="190" font-size="26">家事審判・調停の案内を読む</text><text x="45" y="231" font-size="23">登記や銀行の手続とは分ける</text><rect x="25" y="280" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="323" r="23" fill="#0e5c8a"/><text x="62" y="332" text-anchor="middle" fill="white" font-size="26">2</text><text x="102" y="331" font-size="27" font-weight="bold">コピーの条件を守る</text><text x="45" y="385" font-size="26">全ページを原本どおりに写す</text><text x="45" y="426" font-size="23">縮小・両面化・欠けを避ける</text><rect x="25" y="475" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="518" r="23" fill="#0e5c8a"/><text x="62" y="527" text-anchor="middle" fill="white" font-size="26">3</text><text x="102" y="526" font-size="27" font-weight="bold">原本を使う予定を残す</text><text x="45" y="580" font-size="26">提出後は原則返却できない案内</text><text x="45" y="621" font-size="23">審理終了まで原本を大切に保管</text><text x="30" y="702" font-size="17">2026年10月27日確認｜個別条件と本文の出典を照合</text></g></svg>