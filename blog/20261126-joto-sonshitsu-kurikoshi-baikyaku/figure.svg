<svg xmlns="http://www.w3.org/2000/svg" width="400" height="749" viewBox="0 0 400 749" role="img" aria-labelledby="t d">
<title id="t">譲渡損失の繰越控除の要件</title>
<desc id="d">所有期間5年超、買換えの取得と居住、10年以上のローン、申告の継続が柱になる。</desc>
<rect width="400" height="749" rx="18" fill="#f7eef3"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#6b1e4f">譲渡損失の繰越控除の要件</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#bb8fab"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#6b1e4f">所有期間の要件</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">譲渡年の1月1日時点で</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">所有期間が5年を超えること</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#962e74" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#bb8fab"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#6b1e4f">買換えの要件</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">前年〜翌年の間に新居を取得し</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">取得年の翌年末までに居住</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#962e74" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#fff" stroke="#bb8fab"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#6b1e4f">ローンの要件</text>
<text x="36" y="454" font-size="20" fill="#1e3f55">新しいマイホームに償還期間</text>
<text x="36" y="482" font-size="20" fill="#1e3f55">10年以上の住宅ローンがある</text>
<path d="M200 517v12m-5-5 5 5 5-5" fill="none" stroke="#962e74" stroke-width="2"/>
<rect x="20" y="531" width="360" height="136" rx="12" fill="#6b1e4f"/>
<text x="36" y="567" font-size="24" font-weight="bold" fill="#fff">申告の継続</text>
<text x="36" y="607" font-size="20" font-weight="bold" fill="#fff">損失の年の申告に加え</text>
<text x="36" y="635" font-size="20" font-weight="bold" fill="#fff">繰越の各年も確定申告する</text>
<text x="24" y="703" font-size="20" fill="#1e3f55">損失の年も、繰越の各年も申告が必要です。</text>
<text x="24" y="731" font-size="20" fill="#4e7288">出典：国税庁「マイホームの譲渡損失の特例」案内をもとに作成</text>
</g></svg>
