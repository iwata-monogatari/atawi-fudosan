<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img"><title>最寄りの保管所と原本の保管所</title><rect width="640" height="440" rx="24" fill="#f2f6f8"/><g font-family="Meiryo,sans-serif"><text x="32" y="51" font-size="29" font-weight="bold" fill="#193f55">最寄りの保管所と原本の保管所</text><rect x="24" y="75" width="592" height="103" rx="14" fill="white"/><circle cx="62" cy="125" r="24" fill="#164569"/><text x="62" y="134" text-anchor="middle" font-size="24" fill="white">1</text><text x="106" y="116" font-size="26" font-weight="bold" fill="#164569">本人が確認</text><text x="106" y="153" font-size="23" fill="#233d49">知りたい箇所　／　本文と目録を区別</text><rect x="24" y="191" width="592" height="103" rx="14" fill="white"/><circle cx="62" cy="241" r="24" fill="#1a637e"/><text x="62" y="250" text-anchor="middle" font-size="24" fill="white">2</text><text x="106" y="232" font-size="26" font-weight="bold" fill="#1a637e">モニター閲覧</text><text x="106" y="269" font-size="23" fill="#233d49">全国の保管所　／　１回１，４００円</text><rect x="24" y="307" width="592" height="103" rx="14" fill="white"/><circle cx="62" cy="357" r="24" fill="#23695f"/><text x="62" y="366" text-anchor="middle" font-size="24" fill="white">3</text><text x="106" y="348" font-size="26" font-weight="bold" fill="#23695f">原本の閲覧</text><text x="106" y="385" font-size="23" fill="#233d49">原本の保管所　／　１回１，７００円</text></g></svg>