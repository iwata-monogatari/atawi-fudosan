<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">1回の帰省を、2つのものさしで記録</title><desc id="desc">1回の帰省を、2つのものさしで記録。支出の欄は交通費・駐車料・消耗品。時間の欄は往復・現地作業・連絡。次の判断は続ける／一部を頼む／再検討。本文の判断手順を示す説明図。</desc><rect width="960" height="600" rx="24" fill="#e9f5fc"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#1e3f55"><text x="48" y="65" font-size="30" font-weight="bold">1回の帰省を、2つのものさしで記録</text><path d="M48 88H912" stroke="#2e9bd4" stroke-width="4"/><rect x="48" y="116" width="864" height="112" rx="16" fill="white" stroke="#cde2f0"/><circle cx="95" cy="171" r="25" fill="#2e9bd4"/><text x="95" y="181" text-anchor="middle" font-size="28" fill="white">1</text><text x="145" y="155" font-size="26" font-weight="bold" fill="#0e5c8a">支出の欄</text><text x="145" y="197" font-size="27">交通費・駐車料・消耗品</text><rect x="48" y="252" width="864" height="112" rx="16" fill="white" stroke="#cde2f0"/><circle cx="95" cy="307" r="25" fill="#2e9bd4"/><text x="95" y="317" text-anchor="middle" font-size="28" fill="white">2</text><text x="145" y="291" font-size="26" font-weight="bold" fill="#0e5c8a">時間の欄</text><text x="145" y="333" font-size="27">往復・現地作業・連絡</text><rect x="48" y="388" width="864" height="112" rx="16" fill="white" stroke="#cde2f0"/><circle cx="95" cy="443" r="25" fill="#2e9bd4"/><text x="95" y="453" text-anchor="middle" font-size="28" fill="white">3</text><text x="145" y="427" font-size="26" font-weight="bold" fill="#0e5c8a">次の判断</text><text x="145" y="469" font-size="27">続ける／一部を頼む／再検討</text><text x="48" y="565" font-size="20" fill="#5b7488">大石浩之｜不動産の判断を、家族の段取りへ</text></g></svg>