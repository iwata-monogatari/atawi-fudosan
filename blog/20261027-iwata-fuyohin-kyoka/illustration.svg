<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">片付けを頼む前の照合順</title><desc id="desc">実家の片付けを依頼する前に、買取会社と回収会社の名前を分けて聞き、磐田市の家庭系許可業者一覧で確認し、搬出・運搬・処分の料金と担当を見積書に残す3段階の説明図。</desc><rect width="800" height="720" rx="16" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="30" y="52" font-size="26" font-weight="bold">片付けを頼む前の照合順</text><rect x="25" y="85" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="128" r="23" fill="#0e5c8a"/><text x="62" y="137" text-anchor="middle" fill="white" font-size="26">1</text><text x="102" y="136" font-size="27" font-weight="bold">会社名を分けて聞く</text><text x="45" y="190" font-size="26">買取の会社／ごみを運ぶ会社</text><text x="45" y="231" font-size="23">窓口と実際の回収担当を確認</text><rect x="25" y="280" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="323" r="23" fill="#0e5c8a"/><text x="62" y="332" text-anchor="middle" fill="white" font-size="26">2</text><text x="102" y="331" font-size="27" font-weight="bold">市の許可一覧と照合</text><text x="45" y="385" font-size="26">家庭ごみの収集運搬許可を見る</text><text x="45" y="426" font-size="23">古物商の許可だけでは代用不可</text><rect x="25" y="475" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="518" r="23" fill="#0e5c8a"/><text x="62" y="527" text-anchor="middle" fill="white" font-size="26">3</text><text x="102" y="526" font-size="27" font-weight="bold">作業と料金を書面に</text><text x="45" y="580" font-size="26">搬出・運搬・処分の担当を明記</text><text x="45" y="621" font-size="23">追加料金の条件も積込み前に確認</text><text x="30" y="702" font-size="17">2026年10月27日確認｜個別条件と本文の出典を照合</text></g></svg>