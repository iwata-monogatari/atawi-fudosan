<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">150万円の前に、口座ごとの計算</title><desc id="desc">遺産分割前の相続預金払戻し制度の計算順序。相続開始時の口座・明細ごとの預金額に3分の1と本人の法定相続分を掛け、同一金融機関では複数支店分を含め150万円を上限として、銀行に書類と入金時期を確認する。</desc><rect width="800" height="720" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="54" font-size="27" font-weight="bold">150万円の前に、口座ごとの計算</text><rect x="30" y="90" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="133" r="23" fill="#0e5c8a"/><text x="69" y="142" text-anchor="middle" fill="white" font-size="26">1</text><text x="109" y="140" font-size="27" font-weight="bold">口座・明細ごとに計算</text><text x="109" y="191" font-size="25">相続開始時の預金額 × 1/3</text><text x="109" y="230" font-size="23">× 払戻しを受ける人の法定相続分</text><rect x="30" y="285" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="328" r="23" fill="#0e5c8a"/><text x="69" y="337" text-anchor="middle" fill="white" font-size="26">2</text><text x="109" y="335" font-size="27" font-weight="bold">同じ銀行の支店分を合計</text><text x="109" y="386" font-size="25">同一金融機関の上限は150万円</text><text x="109" y="425" font-size="23">別支店でも上限が増えるわけではない</text><rect x="30" y="480" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="523" r="23" fill="#0e5c8a"/><text x="69" y="532" text-anchor="middle" fill="white" font-size="26">3</text><text x="109" y="530" font-size="27" font-weight="bold">銀行へ書類と入金時期を照会</text><text x="109" y="581" font-size="25">全員に150万円が出る制度ではない</text><text x="109" y="620" font-size="23">後日の遺産分割で取得分として調整</text><text x="40" y="704" font-size="17">2026年10月19日確認｜本文の出典と個別条件を照合</text></g></svg>