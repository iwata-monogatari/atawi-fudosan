<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img"><title>検査協力と補修負担は、別々に決める</title><rect width="960" height="400" rx="20" fill="#f2f9fe"/><g font-family="Yu Gothic, Meiryo, sans-serif" text-anchor="middle"><text x="480" y="54" font-size="30" font-weight="bold" fill="#0e5c8a">検査協力と補修負担は、別々に決める</text><rect x="30" y="100" width="270" height="228" rx="14" fill="white" stroke="#2E9BD4" stroke-width="3"/><circle cx="165" cy="139" r="23" fill="#0e5c8a"/><text x="165" y="148" font-size="25" fill="white">1</text><text x="165" y="199" font-size="28" fill="#1e3f55">検査前</text><text x="165" y="242" font-size="22" fill="#1e3f55">資料・鍵・立入り</text><text x="165" y="285" font-size="22" fill="#1e3f55">申請先と日程を確認</text><path d="M311 211 h20 m-9 -8 9 8 -9 8" fill="none" stroke="#16709f" stroke-width="4"/><rect x="345" y="100" width="270" height="228" rx="14" fill="white" stroke="#2E9BD4" stroke-width="3"/><circle cx="480" cy="139" r="23" fill="#0e5c8a"/><text x="480" y="148" font-size="25" fill="white">2</text><text x="480" y="199" font-size="28" fill="#1e3f55">指摘後</text><text x="480" y="242" font-size="22" fill="#1e3f55">補修範囲と見積り</text><text x="480" y="285" font-size="22" fill="#1e3f55">負担者を書面で合意</text><path d="M626 211 h20 m-9 -8 9 8 -9 8" fill="none" stroke="#16709f" stroke-width="4"/><rect x="660" y="100" width="270" height="228" rx="14" fill="white" stroke="#2E9BD4" stroke-width="3"/><circle cx="795" cy="139" r="23" fill="#0e5c8a"/><text x="795" y="148" font-size="25" fill="white">3</text><text x="795" y="199" font-size="28" fill="#1e3f55">引渡し前</text><text x="795" y="242" font-size="22" fill="#1e3f55">再確認と必要書類</text><text x="795" y="285" font-size="22" fill="#1e3f55">融資期限と照合</text><text x="480" y="371" font-size="20" fill="#5b7488">適合の確認は、売却価格や融資承認の保証ではありません。</text></g></svg>