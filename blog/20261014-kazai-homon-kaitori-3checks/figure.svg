<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" rx="24" fill="#e9f5fc"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="48" y="65" font-size="32" font-weight="bold">買取の確認は、3つの場面に分ける</text><rect x="40" y="102" width="880" height="122" rx="16" fill="white" stroke="#cde2f0"/><circle cx="82" cy="144" r="24" fill="#2E9BD4"/><text x="73" y="153" font-size="24" fill="white">1</text><text x="128" y="140" font-size="23" fill="#0e5c8a">予約前</text><text x="128" y="175" font-size="26" font-weight="bold">売る品と残す品</text><text x="128" y="207" font-size="21">写真付きの一覧で範囲を固定</text><rect x="40" y="242" width="880" height="122" rx="16" fill="white" stroke="#cde2f0"/><circle cx="82" cy="284" r="24" fill="#2E9BD4"/><text x="73" y="293" font-size="24" fill="white">2</text><text x="128" y="280" font-size="23" fill="#0e5c8a">契約前</text><text x="128" y="315" font-size="26" font-weight="bold">品名・代金・相手</text><text x="128" y="347" font-size="21">書面と現物を一品ずつ照合</text><rect x="40" y="382" width="880" height="122" rx="16" fill="white" stroke="#cde2f0"/><circle cx="82" cy="424" r="24" fill="#2E9BD4"/><text x="73" y="433" font-size="24" fill="white">3</text><text x="128" y="420" font-size="23" fill="#0e5c8a">引渡し前</text><text x="128" y="455" font-size="26" font-weight="bold">適用条件と渡す日</text><text x="128" y="487" font-size="21">迷った品は保留し相談する</text><text x="48" y="570" font-size="20">2026年10月14日確認／筆者作成。適用条件や個別の計算は専門家へ。</text></g></svg>