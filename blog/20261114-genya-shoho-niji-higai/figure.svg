<svg xmlns="http://www.w3.org/2000/svg" width="400" height="749" viewBox="0 0 400 749" role="img" aria-labelledby="t d">
<title id="t">二次被害の見分け方</title>
<desc id="d">高く売れると持ちかけ、費用の先払いを求め、契約を急がせる。この3つがそろえば、その場で契約しない。</desc>
<rect width="400" height="749" rx="18" fill="#fdf6ec"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#8c5a14">二次被害の見分け方</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#d6ae62"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#8c5a14">高く売れると言う</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">買い手の実在を</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">書面で示せない話は疑う</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#a5711f" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#d6ae62"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#8c5a14">費用の先払いを求める</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">測量・整地・広告費は</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">手口の典型的な名目</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#a5711f" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#fff" stroke="#d6ae62"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#8c5a14">契約を急がせる</text>
<text x="36" y="454" font-size="20" fill="#1e3f55">今日だけと言われたら</text>
<text x="36" y="482" font-size="20" fill="#1e3f55">その場で決めない</text>
<path d="M200 517v12m-5-5 5 5 5-5" fill="none" stroke="#a5711f" stroke-width="2"/>
<rect x="20" y="531" width="360" height="136" rx="12" fill="#8c5a14"/>
<text x="36" y="567" font-size="24" font-weight="bold" fill="#fff">免許と書面を確認</text>
<text x="36" y="607" font-size="20" font-weight="bold" fill="#fff">宅建業の免許番号と</text>
<text x="36" y="635" font-size="20" font-weight="bold" fill="#fff">契約書面の有無を見る</text>
<text x="24" y="703" font-size="20" fill="#1e3f55">困ったら消費生活センター（188）へ</text>
<text x="24" y="731" font-size="20" fill="#4e7288">出典：国民生活センター11月確認</text>
</g></svg>
