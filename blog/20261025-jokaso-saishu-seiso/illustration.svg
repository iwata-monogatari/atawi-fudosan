<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">撤去の前後で、担当を分けて確認</title><desc id="desc">浄化槽の撤去に伴う三つの確認を示す図。清掃では汚泥の引抜きと洗浄・消毒、撤去では作業範囲と完了資料、届出では廃止日と担当を確認し、静岡県の案内する廃止から30日以内の提出につなぐ。</desc><rect width="800" height="720" rx="16" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="30" y="52" font-size="26" font-weight="bold">撤去の前後で、担当を分けて確認</text><rect x="25" y="85" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="128" r="23" fill="#0e5c8a"/><text x="62" y="137" text-anchor="middle" fill="white" font-size="26">1</text><text x="102" y="136" font-size="27" font-weight="bold">清掃</text><text x="45" y="190" font-size="26">汚泥の引抜き ＋ 洗浄・消毒</text><text x="45" y="231" font-size="23">清掃の範囲と記録を確認</text><rect x="25" y="280" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="323" r="23" fill="#0e5c8a"/><text x="62" y="332" text-anchor="middle" fill="white" font-size="26">2</text><text x="102" y="331" font-size="27" font-weight="bold">撤去</text><text x="45" y="385" font-size="26">清掃後に解体・撤去へ</text><text x="45" y="426" font-size="23">追加費用と完了資料を確認</text><rect x="25" y="475" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="518" r="23" fill="#0e5c8a"/><text x="62" y="527" text-anchor="middle" fill="white" font-size="26">3</text><text x="102" y="526" font-size="27" font-weight="bold">届出</text><text x="45" y="580" font-size="26">廃止日と提出担当を記録</text><text x="45" y="621" font-size="23">静岡県の案内：廃止から30日以内</text><text x="30" y="702" font-size="17">2026年10月25日確認｜個別条件と本文の出典を照合</text></g></svg>