<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d"><title id="t">媒介契約と調査依頼の順番</title><desc id="d">媒介契約書で調査者のあっせんの有無と理由を確認し、調査の範囲と費用を聞き、依頼するか売主が判断する流れ。</desc><rect width="960" height="500" rx="24" fill="#f2f9fe"/><g text-anchor="middle" font-family="sans-serif" fill="#0e5c8a"><text x="480" y="65" font-size="31" font-weight="bold">紹介と調査依頼は分けて考える</text><rect x="70" y="110" width="820" height="85" rx="14" fill="white" stroke="#2e9bd4" stroke-width="3"/><text x="480" y="163" font-size="25">1　媒介契約書：あっせんの有無と理由を読む</text><text x="480" y="228" font-size="32">↓</text><rect x="70" y="250" width="820" height="85" rx="14" fill="white" stroke="#2e9bd4" stroke-width="3"/><text x="480" y="303" font-size="25">2　調査者へ範囲・限界・費用・日程を確認</text><text x="480" y="368" font-size="32">↓</text><rect x="70" y="390" width="820" height="75" rx="14" fill="white" stroke="#2e9bd4" stroke-width="3"/><text x="480" y="438" font-size="25">3　売主と家族が依頼するか判断</text></g></svg>
