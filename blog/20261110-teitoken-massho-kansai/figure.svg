<svg xmlns="http://www.w3.org/2000/svg" width="400" height="656" viewBox="0 0 400 656" role="img" aria-labelledby="t d">
<title id="t">抹消登記の必要書類</title>
<desc id="d">登記原因証明情報、登記識別情報または登記済証、委任状、資格証明情報の4点。一般に金融機関から送付される。</desc>
<rect width="400" height="656" rx="18" fill="#f2f9fe"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#0e5c8a">抹消登記の必要書類</text>
<rect x="20" y="72" width="360" height="108" rx="12" fill="#fff" stroke="#2e9bd4"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#0e5c8a">登記原因証明情報</text>
<text x="36" y="144" font-size="20" fill="#1e3f55">解除証書・弁済証書など</text>
<rect x="20" y="192" width="360" height="108" rx="12" fill="#fff" stroke="#2e9bd4"/>
<text x="36" y="228" font-size="24" font-weight="bold" fill="#0e5c8a">登記識別情報</text>
<text x="36" y="264" font-size="20" fill="#1e3f55">設定時の登記済証でも可</text>
<rect x="20" y="312" width="360" height="108" rx="12" fill="#fff" stroke="#2e9bd4"/>
<text x="36" y="348" font-size="24" font-weight="bold" fill="#0e5c8a">委任状</text>
<text x="36" y="384" font-size="20" fill="#1e3f55">金融機関から所有者へ</text>
<rect x="20" y="432" width="360" height="108" rx="12" fill="#fff" stroke="#2e9bd4"/>
<text x="36" y="468" font-size="24" font-weight="bold" fill="#0e5c8a">資格証明情報</text>
<text x="36" y="504" font-size="20" fill="#1e3f55">作成から3か月以内</text>
<text x="24" y="572" font-size="20" fill="#1e3f55">登録免許税は1個1,000円</text>
<text x="24" y="612" font-size="20" fill="#4e7288">出典：法務局</text>
<text x="24" y="640" font-size="20" fill="#4e7288">2026年11月10日確認</text>
</g></svg>
