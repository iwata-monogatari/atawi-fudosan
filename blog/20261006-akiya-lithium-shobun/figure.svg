<svg xmlns="http://www.w3.org/2000/svg" width="760" height="690" viewBox="0 0 760 690" role="img"><title>片付け前に分ける3確認</title><desc>実家に残る充電式機器について、電池の取り外し可否、膨張の有無、市の回収対象と回収先の順に確認する図。磐田市では膨張した電池を集積所へ出せず、ポータブル電源は市の回収対象外であることを示す。</desc><rect width="760" height="690" fill="#f2f9fe"/><style>text{font-family:Yu Gothic,Meiryo,sans-serif;fill:#1e3f55}</style><rect width="760" height="98" fill="#0e5c8a"/><text x="34" y="62" font-size="30" font-weight="bold" style="fill:white">片付け前に分ける3確認</text><rect x="24" y="122" width="712" height="150" rx="12" fill="white" stroke="#cde2f0"/><rect x="24" y="122" width="8" height="150" rx="4" fill="#2E9BD4"/><text x="50" y="160" font-size="26" font-weight="bold">1 機器と電池</text><text x="50" y="205" font-size="24">取り外せる → 電池と本体を分ける</text><text x="50" y="245" font-size="24">外せない → 無理に分解せず製品ごと確認</text><rect x="24" y="296" width="712" height="150" rx="12" fill="white" stroke="#cde2f0"/><rect x="24" y="296" width="8" height="150" rx="4" fill="#2E9BD4"/><text x="50" y="334" font-size="26" font-weight="bold">2 電池の状態</text><text x="50" y="379" font-size="24">通常品 → 市の有害ごみ案内を確認</text><text x="50" y="419" font-size="24">膨張品 → 集積所不可・常設施設へ</text><rect x="24" y="470" width="712" height="150" rx="12" fill="white" stroke="#cde2f0"/><rect x="24" y="470" width="8" height="150" rx="4" fill="#2E9BD4"/><text x="50" y="508" font-size="26" font-weight="bold">3 回収の対象</text><text x="50" y="553" font-size="24">ポータブル電源等 → 市は回収しない</text><text x="50" y="593" font-size="24">業者に頼む場合も回収先を確認</text><text x="30" y="664" font-size="18">2026年10月6日確認｜公式情報をもとに筆者作成</text></svg>