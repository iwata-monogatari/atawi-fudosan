<svg xmlns="http://www.w3.org/2000/svg" width="760" height="800" viewBox="0 0 760 800" role="img" aria-labelledby="title desc"><title>売却資料と基準変更の時計を分ける</title><desc>現在の売却で使う認定通知や修繕計画と会計資料、2026年7月31日の省令等の公布日、2027年4月1日以降の地方公共団体への申請に適用される見直し後の基準を区別した図。</desc><rect width="760" height="800" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic, Noto Sans JP, sans-serif" fill="#1e3f55"><text x="30" y="58" font-size="28" font-weight="bold">売却資料と基準変更の時計を分ける</text><rect x="30" y="92" width="700" height="185" rx="12" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="75" cy="136" r="25" fill="#0e5c8a"/><text x="75" y="147" text-anchor="middle" fill="white" font-size="32">1</text><text x="118" y="147" font-size="32" font-weight="bold">現在の管理状態</text><text x="55" y="201" font-size="29" font-weight="normal">認定通知・修繕計画・会計</text><text x="55" y="255" font-size="29" font-weight="normal">買主への説明材料をそろえる</text><rect x="30" y="302" width="700" height="185" rx="12" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="75" cy="346" r="25" fill="#0e5c8a"/><text x="75" y="357" text-anchor="middle" fill="white" font-size="32">2</text><text x="118" y="357" font-size="32" font-weight="bold">2026年7月31日</text><text x="55" y="411" font-size="29" font-weight="normal">省令等の公布日</text><text x="55" y="465" font-size="29" font-weight="normal">新基準の施行日とは異なる</text><rect x="30" y="512" width="700" height="185" rx="12" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="75" cy="556" r="25" fill="#0e5c8a"/><text x="75" y="567" text-anchor="middle" fill="white" font-size="32">3</text><text x="118" y="567" font-size="32" font-weight="bold">2027年4月1日以降</text><text x="55" y="621" font-size="29" font-weight="normal">地方公共団体への申請</text><text x="55" y="675" font-size="29" font-weight="normal">見直し後の基準を適用</text><text x="30" y="757" font-size="20" fill="#4e7288">2026年10月5日確認｜公式情報をもとに筆者作成</text></g></svg>