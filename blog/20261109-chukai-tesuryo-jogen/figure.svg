<svg xmlns="http://www.w3.org/2000/svg" width="400" height="654" viewBox="0 0 400 654" role="img" aria-labelledby="t d"><title id="t">手数料上限の区分計算</title><desc id="d">価格200万円以下の部分は5％、200万〜400万円の部分は4％、400万円を超える部分は3％。400万円超の取引では速算式の価格×3％＋6万円と一致する。</desc><rect width="400" height="654" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif"><text x="24" y="44" font-size="25" font-weight="bold" fill="#0e5c8a">手数料上限の区分計算</text><rect x="20" y="72" width="360" height="108" rx="12" fill="#fff" stroke="#2e9bd4"/><text x="36" y="108" font-size="24" font-weight="bold" fill="#0e5c8a">価格200万円以下</text><text x="36" y="148" font-size="20" fill="#1e3f55">その部分の割合 5％</text><path d="M200 183v12m-5-5 5 5 5-5" fill="none" stroke="#16709f" stroke-width="2"/><rect x="20" y="198" width="360" height="108" rx="12" fill="#fff" stroke="#2e9bd4"/><text x="36" y="234" font-size="24" font-weight="bold" fill="#0e5c8a">価格200万〜400万円</text><text x="36" y="274" font-size="20" fill="#1e3f55">その部分の割合 4％</text><path d="M200 309v12m-5-5 5 5 5-5" fill="none" stroke="#16709f" stroke-width="2"/><rect x="20" y="324" width="360" height="108" rx="12" fill="#fff" stroke="#2e9bd4"/><text x="36" y="360" font-size="24" font-weight="bold" fill="#0e5c8a">価格400万円超</text><text x="36" y="400" font-size="20" fill="#1e3f55">その部分の割合 3％</text><path d="M200 435v12m-5-5 5 5 5-5" fill="none" stroke="#16709f" stroke-width="2"/><rect x="20" y="450" width="360" height="108" rx="12" fill="#0e5c8a"/><text x="36" y="486" font-size="24" font-weight="bold" fill="#fff">速算式（400万円超）</text><text x="36" y="526" font-size="20" font-weight="bold" fill="#fff">価格×3％＋6万円</text><text x="24" y="608" font-size="20" fill="#4e7288">出典：国土交通省</text><text x="24" y="636" font-size="20" fill="#4e7288">2026年11月9日確認</text></g></svg>