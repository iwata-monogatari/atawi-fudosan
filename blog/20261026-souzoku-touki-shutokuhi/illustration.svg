<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">相続登記費用と取得費の二つの計算</title><desc id="desc">相続登記費用は非業務用不動産の実際の取得費に含まれる扱いがある一方、売価1000万円の5％である50万円を概算取得費とした場合は仮の登記費用20万円を別に足せないことを示す計算図。</desc><rect width="800" height="720" rx="16" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="30" y="52" font-size="26" font-weight="bold">相続登記費用と取得費の二つの計算</text><rect x="25" y="85" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="128" r="23" fill="#0e5c8a"/><text x="62" y="137" text-anchor="middle" fill="white" font-size="26">1</text><text x="102" y="136" font-size="27" font-weight="bold">実際の取得費で計算</text><text x="45" y="190" font-size="26">親の購入資料と相続時の明細を確認</text><text x="45" y="231" font-size="23">非業務用の登記費用は算入の対象</text><rect x="25" y="280" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="323" r="23" fill="#0e5c8a"/><text x="62" y="332" text-anchor="middle" fill="white" font-size="26">2</text><text x="102" y="331" font-size="27" font-weight="bold">概算取得費5％で計算</text><text x="45" y="385" font-size="26">売価1000万円なら取得費50万円</text><text x="45" y="426" font-size="23">登記費用20万円を別に足せない</text><rect x="25" y="475" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="518" r="23" fill="#0e5c8a"/><text x="62" y="527" text-anchor="middle" fill="white" font-size="26">3</text><text x="102" y="526" font-size="27" font-weight="bold">先にそろえる資料</text><text x="45" y="580" font-size="26">購入契約書・登記費用の内訳・用途</text><text x="45" y="621" font-size="23">例の金額は仮定。個別判断は税理士へ</text><text x="30" y="702" font-size="17">2026年10月26日確認｜個別条件と本文の出典を照合</text></g></svg>