<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">買換え特例：二つの時点を分ける</title><desc id="desc">マイホームの買換え特例の課税繰延べを示す図。売却と買換えの年に条件を確認し、次の家を持つ間も以前の取得資料と申告資料を保管する。次の売却では繰り延べた利益も計算に関わり、非課税とは異なる。</desc><rect width="800" height="720" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="54" font-size="27" font-weight="bold">買換え特例：二つの時点を分ける</text><rect x="30" y="90" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="133" r="23" fill="#0e5c8a"/><text x="69" y="142" text-anchor="middle" fill="white" font-size="26">1</text><text x="109" y="140" font-size="27" font-weight="bold">売却と買換えの年</text><text x="109" y="191" font-size="25">条件を満たす利益の課税を繰延べ</text><text x="109" y="230" font-size="23">非課税になったわけではない</text><rect x="30" y="285" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="328" r="23" fill="#0e5c8a"/><text x="69" y="337" text-anchor="middle" fill="white" font-size="26">2</text><text x="109" y="335" font-size="27" font-weight="bold">次の家を持つ間</text><text x="109" y="386" font-size="25">前の家の取得資料も保管する</text><text x="109" y="425" font-size="23">今回の申告資料を引き継ぐ</text><rect x="30" y="480" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="523" r="23" fill="#0e5c8a"/><text x="69" y="532" text-anchor="middle" fill="white" font-size="26">3</text><text x="109" y="530" font-size="27" font-weight="bold">次の家を売るとき</text><text x="109" y="581" font-size="25">繰り延べた利益も計算に関わる</text><text x="109" y="620" font-size="23">その時点の税額は別に確認</text><text x="40" y="704" font-size="17">2026年10月24日確認｜本文の出典と個別条件を照合</text></g></svg>