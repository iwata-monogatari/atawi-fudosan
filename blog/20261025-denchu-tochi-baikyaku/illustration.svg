<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">電柱のある敷地：査定前の資料整理</title><desc id="desc">電柱のある土地を査定する前の確認図。設備の所有者と電柱・支線の位置、土地借用の契約書や承諾書、敷地料の通知の金額・対象期間・名義をそろえる。3年ごとの通知を個別の入金時期と同一視せず、移設の可否と費用は照会する。</desc><rect width="800" height="720" rx="16" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="30" y="52" font-size="26" font-weight="bold">電柱のある敷地：査定前の資料整理</text><rect x="25" y="85" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="128" r="23" fill="#0e5c8a"/><text x="62" y="137" text-anchor="middle" fill="white" font-size="26">1</text><text x="102" y="136" font-size="27" font-weight="bold">設備の所有者</text><text x="45" y="190" font-size="26">電柱と支線の位置・表示を記録</text><text x="45" y="231" font-size="23">自宅の電気契約と混同しない</text><rect x="25" y="280" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="323" r="23" fill="#0e5c8a"/><text x="62" y="332" text-anchor="middle" fill="white" font-size="26">2</text><text x="102" y="331" font-size="27" font-weight="bold">土地借用契約</text><text x="45" y="385" font-size="26">契約書・承諾書等を探す</text><text x="45" y="426" font-size="23">移設は可否と費用を照会</text><rect x="25" y="475" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="518" r="23" fill="#0e5c8a"/><text x="62" y="527" text-anchor="middle" fill="white" font-size="26">3</text><text x="102" y="526" font-size="27" font-weight="bold">敷地料の通知</text><text x="45" y="580" font-size="26">金額・対象期間・契約名義を確認</text><text x="45" y="621" font-size="23">3年ごとの通知と入金日を分ける</text><text x="30" y="702" font-size="17">2026年10月25日確認｜個別条件と本文の出典を照合</text></g></svg>