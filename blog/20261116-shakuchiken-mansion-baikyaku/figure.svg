<svg xmlns="http://www.w3.org/2000/svg" width="400" height="749" viewBox="0 0 400 749" role="img" aria-labelledby="t d">
<title id="t">借地権マンションの確認点</title>
<desc id="d">借地の種類と残存期間を見て、地主の譲渡承諾と承諾料を確かめ、地代と更新料の条件をそろえ、ローンの付き方を確認する。</desc>
<rect width="400" height="749" rx="18" fill="#faf0f5"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#8f2b5c">借地権マンションの確認点</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#d08bb0"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#8f2b5c">借地の種類を見る</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">普通借地権か定期借地権かで</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">満了時の扱いが変わる</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#a83d74" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#d08bb0"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#8f2b5c">譲渡承諾を確かめる</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">地主の承諾と承諾料が</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">売却の前提条件になる</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#a83d74" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#fff" stroke="#d08bb0"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#8f2b5c">地代と更新を見る</text>
<text x="36" y="454" font-size="20" fill="#1e3f55">地代の額と更新料の</text>
<text x="36" y="482" font-size="20" fill="#1e3f55">条件を書面でそろえる</text>
<path d="M200 517v12m-5-5 5 5 5-5" fill="none" stroke="#a83d74" stroke-width="2"/>
<rect x="20" y="531" width="360" height="136" rx="12" fill="#8f2b5c"/>
<text x="36" y="567" font-size="24" font-weight="bold" fill="#fff">ローンを確認する</text>
<text x="36" y="607" font-size="20" font-weight="bold" fill="#fff">残存期間で審査が変わる</text>
<text x="36" y="635" font-size="20" font-weight="bold" fill="#fff">買主の層を読み違えない</text>
<text x="24" y="703" font-size="20" fill="#1e3f55">土地は借地、建物は区分所有が前提</text>
<text x="24" y="731" font-size="20" fill="#4e7288">出典：借地借家法11月確認</text>
</g></svg>
