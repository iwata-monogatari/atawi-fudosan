<svg xmlns="http://www.w3.org/2000/svg" width="600" height="760" viewBox="0 0 600 760" role="img" aria-labelledby="title desc"><title id="title">残額と申告日を揃える</title><desc id="desc">① 市へ納付状況を確認。② 売買の負担を合意。③ 新旧受益者で申告。④ 納期と支払者を照合。登記を変えるだけでは変更されない</desc><rect width="600" height="760" rx="24" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="32" y="58" font-size="30" font-weight="bold">残額と申告日を揃える</text><rect x="30" y="100" width="540" height="90" rx="16" fill="white" stroke="#2e9bd4" stroke-width="3"/><text x="55" y="157" font-size="30" font-weight="bold">① 市へ納付状況を確認</text><path d="M300 195v22m-9-9 9 9 9-9" stroke="#16709f" stroke-width="4" fill="none"/><rect x="30" y="225" width="540" height="90" rx="16" fill="white" stroke="#2e9bd4" stroke-width="3"/><text x="55" y="282" font-size="30" font-weight="bold">② 売買の負担を合意</text><path d="M300 320v22m-9-9 9 9 9-9" stroke="#16709f" stroke-width="4" fill="none"/><rect x="30" y="350" width="540" height="90" rx="16" fill="white" stroke="#2e9bd4" stroke-width="3"/><text x="55" y="407" font-size="30" font-weight="bold">③ 新旧受益者で申告</text><path d="M300 445v22m-9-9 9 9 9-9" stroke="#16709f" stroke-width="4" fill="none"/><rect x="30" y="475" width="540" height="90" rx="16" fill="white" stroke="#2e9bd4" stroke-width="3"/><text x="55" y="532" font-size="30" font-weight="bold">④ 納期と支払者を照合</text><text x="32" y="650" font-size="28" font-weight="bold">登記を変えるだけでは変更されない</text></g></svg>