<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">秋の雨どい管理：家族が決める三つ</title><desc id="desc">空き家の雨どい管理を三段階で整理した図。地上からあふれや部材の外れを確認し、巡回・清掃・補修の範囲を分けて依頼したうえで、作業前後の写真と未確認箇所、次回の確認日を記録する。</desc><rect width="800" height="720" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="54" font-size="27" font-weight="bold">秋の雨どい管理：家族が決める三つ</text><rect x="30" y="90" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="133" r="23" fill="#0e5c8a"/><text x="69" y="142" text-anchor="middle" fill="white" font-size="26">1</text><text x="109" y="140" font-size="27" font-weight="bold">地上から確認</text><text x="109" y="191" font-size="25">あふれ・外れ・落ち葉の位置</text><text x="109" y="230" font-size="23">高い場所へ無理に上らない</text><rect x="30" y="285" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="328" r="23" fill="#0e5c8a"/><text x="69" y="337" text-anchor="middle" fill="white" font-size="26">2</text><text x="109" y="335" font-size="27" font-weight="bold">作業の範囲を確認</text><text x="109" y="386" font-size="25">巡回と清掃、補修は分ける</text><text x="109" y="425" font-size="23">写真と見積りで依頼する</text><rect x="30" y="480" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="523" r="23" fill="#0e5c8a"/><text x="69" y="532" text-anchor="middle" fill="white" font-size="26">3</text><text x="109" y="530" font-size="27" font-weight="bold">記録を引き継ぐ</text><text x="109" y="581" font-size="25">作業前後・未確認箇所・次回日</text><text x="109" y="620" font-size="23">売却前も管理を途切れさせない</text><text x="40" y="704" font-size="17">2026年10月24日確認｜本文の出典と個別条件を照合</text></g></svg>