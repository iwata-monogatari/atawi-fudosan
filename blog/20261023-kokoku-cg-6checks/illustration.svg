<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">CG広告を承諾する前の六つの確認</title><desc id="desc">現況で取引する住宅のCG広告の六項目を三組にした図。現況取引とCGの明示、工事費と家具等が価格に含まれない表示、設置できる家具と物件詳細の先頭にCGを置かない掲載順を確認する。</desc><rect width="800" height="720" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="54" font-size="27" font-weight="bold">CG広告を承諾する前の六つの確認</text><rect x="30" y="90" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="133" r="23" fill="#0e5c8a"/><text x="69" y="142" text-anchor="middle" fill="white" font-size="26">1</text><text x="109" y="140" font-size="27" font-weight="bold">表示の前提：1・2</text><text x="109" y="191" font-size="25">現況での取引／CG画像であること</text><text x="109" y="230" font-size="23">完成後に引き渡すと誤解させない</text><rect x="30" y="285" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="328" r="23" fill="#0e5c8a"/><text x="69" y="337" text-anchor="middle" fill="white" font-size="26">2</text><text x="109" y="335" font-size="27" font-weight="bold">価格の範囲：3・4</text><text x="109" y="386" font-size="25">工事費／家具等は価格に含まない</text><text x="109" y="425" font-size="23">画像と売買条件を照合する</text><rect x="30" y="480" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="523" r="23" fill="#0e5c8a"/><text x="69" y="532" text-anchor="middle" fill="white" font-size="26">3</text><text x="109" y="530" font-size="27" font-weight="bold">現実と順番：5・6</text><text x="109" y="581" font-size="25">設置できる家具／詳細の先頭は避ける</text><text x="109" y="620" font-size="23">現況写真と合わせて確認する</text><text x="40" y="704" font-size="17">2026年10月23日確認｜本文の出典と個別条件を照合</text></g></svg>