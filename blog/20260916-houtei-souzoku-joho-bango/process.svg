<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">番号で省く書類と、別にそろえる書類</title><desc id="desc">相続登記の書類整理は、交付済み一覧図の番号を確認し、申請書に番号を記載して一覧図の写しを省略し、遺産分割協議書など残る書類を提出先へ確認する順で進める。番号の取得だけで名義は変わらない。</desc><rect width="1200" height="660" rx="24" fill="#e9f5fc"/><g font-family="Yu Gothic, sans-serif" fill="#1e3f55"><text x="60" y="82" font-size="36" font-weight="700">番号で省く書類と、別にそろえる書類</text><rect x="50" y="145" width="340" height="315" rx="18" fill="white" stroke="#cde2f0" stroke-width="3"/><rect x="50" y="145" width="340" height="74" rx="18" fill="#0e5c8a"/><text x="75" y="193" font-size="28" fill="white" font-weight="700">1 番号を確認</text><text x="75" y="260" font-size="25" fill="#1e3f55" font-weight="400">交付済みの一覧図</text><text x="75" y="313" font-size="25" fill="#1e3f55" font-weight="400">保管している人へ</text><path d="M 400 295 l 20 15 -20 15" fill="none" stroke="#2E9BD4" stroke-width="5"/><rect x="430" y="145" width="340" height="315" rx="18" fill="white" stroke="#cde2f0" stroke-width="3"/><rect x="430" y="145" width="340" height="74" rx="18" fill="#0e5c8a"/><text x="455" y="193" font-size="28" fill="white" font-weight="700">2 申請書へ記載</text><text x="455" y="260" font-size="25" fill="#1e3f55" font-weight="400">一覧図の写しは</text><text x="455" y="313" font-size="25" fill="#1e3f55" font-weight="400">番号で添付省略</text><path d="M 780 295 l 20 15 -20 15" fill="none" stroke="#2E9BD4" stroke-width="5"/><rect x="810" y="145" width="340" height="315" rx="18" fill="white" stroke="#cde2f0" stroke-width="3"/><rect x="810" y="145" width="340" height="74" rx="18" fill="#0e5c8a"/><text x="835" y="193" font-size="28" fill="white" font-weight="700">3 残る書類を照会</text><text x="835" y="260" font-size="25" fill="#1e3f55" font-weight="400">遺産分割の資料など</text><text x="835" y="313" font-size="25" fill="#1e3f55" font-weight="400">提出先ごとに確認</text><text x="60" y="535" font-size="25">番号を取得しても、相続登記は自動で完了しません。</text><text x="60" y="578" font-size="25">書類ごとの要否は、提出先・司法書士に確認を。</text></g></svg>