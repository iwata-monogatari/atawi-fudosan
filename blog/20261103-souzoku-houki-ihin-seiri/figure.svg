<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img" aria-labelledby="title desc"><title id="title">処分前に揃える3つの相談メモ</title><desc id="desc">財産・作業・期限を専門家へ渡す3枚の相談メモ</desc><rect width="640" height="800" rx="20" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="32" y="62" font-size="29" font-weight="bold">処分前に揃える3つの相談メモ</text><rect x="28" y="100" width="584" height="168" rx="15" fill="white" stroke="#9ccfe7" stroke-width="2"/><circle cx="65" cy="147" r="23" fill="#0e5c8a"/><text x="65" y="157" text-anchor="middle" font-size="28" fill="white">1</text><text x="103" y="156" font-size="28" font-weight="bold">財産の確認</text><text x="48" y="219" font-size="27">物の内容・所有者・状態を記録</text><path d="M320 278v22m-10-10 10 10 10-10" fill="none" stroke="#16709f" stroke-width="4"/><rect x="28" y="310" width="584" height="168" rx="15" fill="white" stroke="#9ccfe7" stroke-width="2"/><circle cx="65" cy="357" r="23" fill="#0e5c8a"/><text x="65" y="367" text-anchor="middle" font-size="28" fill="white">2</text><text x="103" y="366" font-size="28" font-weight="bold">作業の確認</text><text x="48" y="429" font-size="27">売却・廃棄・保管を分けて記載</text><path d="M320 488v22m-10-10 10 10 10-10" fill="none" stroke="#16709f" stroke-width="4"/><rect x="28" y="520" width="584" height="168" rx="15" fill="white" stroke="#9ccfe7" stroke-width="2"/><circle cx="65" cy="567" r="23" fill="#0e5c8a"/><text x="65" y="577" text-anchor="middle" font-size="28" fill="white">3</text><text x="103" y="576" font-size="28" font-weight="bold">期限の確認</text><text x="48" y="639" font-size="27">相続の期限と相談日を分ける</text><text x="32" y="765" font-size="25">個別の作業可否は専門家へ確認</text></g></svg>