<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img"><title>基本料金の容量比較と使用量支援を別枠で図解</title><rect width="960" height="430" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic, Meiryo, sans-serif"><text x="35" y="58" font-size="31" fill="#0e5c8a" font-weight="700">基本料金と、使用量への支援を分ける</text><rect x="35" y="97" width="545" height="260" rx="16" fill="white" stroke="#cde2f0"/><rect x="605" y="97" width="320" height="260" rx="16" fill="#e9f5fc"/><text x="58" y="137" font-size="23" fill="#1e3f55" font-weight="400">従量電灯B／税込・通常の月額</text><text x="58" y="193" font-size="25" fill="#1e3f55" font-weight="400">30A</text><text x="171" y="193" font-size="31" fill="#0e5c8a" font-weight="700">963.42円</text><text x="58" y="250" font-size="25" fill="#1e3f55" font-weight="400">20A</text><text x="171" y="250" font-size="31" fill="#0e5c8a" font-weight="700">642.28円</text><text x="58" y="318" font-size="31" fill="#0e5c8a" font-weight="700">差は月321.14円</text><text x="626" y="138" font-size="25" fill="#0e5c8a" font-weight="700">支援の計算例</text><text x="626" y="187" font-size="21" fill="#1e3f55" font-weight="400">2026年9月使用分</text><text x="626" y="233" font-size="21" fill="#1e3f55" font-weight="400">仮に20キロワット時</text><text x="626" y="281" font-size="24" fill="#1e3f55" font-weight="400">20 × 3.5円 = 70円</text><text x="626" y="324" font-size="21" fill="#1e3f55" font-weight="400">10月分料金に対応</text><text x="35" y="402" font-size="23" fill="#1e3f55" font-weight="400">必要な容量は、内覧・清掃で同時に使う機器を確認して判断します。</text></g></svg>