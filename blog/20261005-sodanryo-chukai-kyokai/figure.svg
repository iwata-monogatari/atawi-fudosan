<svg xmlns="http://www.w3.org/2000/svg" width="760" height="800" viewBox="0 0 760 800" role="img" aria-labelledby="title desc"><title>名前ではなく、買う仕事を分ける</title><desc>仲介契約で依頼する売買成立のための仕事、別契約で依頼する活用案の比較や課題整理、両契約に重なる調査の三つを並べ、成果物と算定根拠の照合が必要なことを示した図。</desc><rect width="760" height="800" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic, Noto Sans JP, sans-serif" fill="#1e3f55"><text x="30" y="58" font-size="28" font-weight="bold">名前ではなく、買う仕事を分ける</text><rect x="30" y="92" width="700" height="185" rx="12" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="75" cy="136" r="25" fill="#0e5c8a"/><text x="75" y="147" text-anchor="middle" fill="white" font-size="32">1</text><text x="118" y="147" font-size="32" font-weight="bold">仲介の仕事</text><text x="55" y="201" font-size="29" font-weight="normal">売買を成立へつなぐ</text><text x="55" y="255" font-size="29" font-weight="normal">媒介契約の範囲を確認</text><rect x="30" y="302" width="700" height="185" rx="12" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="75" cy="346" r="25" fill="#0e5c8a"/><text x="75" y="357" text-anchor="middle" fill="white" font-size="32">2</text><text x="118" y="357" font-size="32" font-weight="bold">別の相談業務</text><text x="55" y="411" font-size="29" font-weight="normal">活用案の比較・課題整理</text><text x="55" y="465" font-size="29" font-weight="normal">成果物と納期を確認</text><rect x="30" y="512" width="700" height="185" rx="12" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="75" cy="556" r="25" fill="#0e5c8a"/><text x="75" y="567" text-anchor="middle" fill="white" font-size="32">3</text><text x="118" y="567" font-size="32" font-weight="bold">重なる作業</text><text x="55" y="621" font-size="29" font-weight="normal">同じ調査を両方で請求？</text><text x="55" y="675" font-size="29" font-weight="normal">算定根拠を文書で照合</text><text x="30" y="757" font-size="20" fill="#4e7288">2026年10月5日確認｜公式情報をもとに筆者作成</text></g></svg>