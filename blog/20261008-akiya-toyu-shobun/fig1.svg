<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">ストーブ一台でも、行き先は三つ</title><desc id="desc">実家に残った石油ストーブから、灯油は販売店へ相談、本体は金物・小型電化製品の日、抜いた電池は有害ごみの日へと三つの行き先に分ける説明図。受付条件は販売店へ事前に確認する。</desc><rect width="1200" height="640" rx="24" fill="#e9f5fc"/><g font-family="Yu Gothic,Meiryo,sans-serif"><text x="60" y="82" font-size="38" font-weight="bold" fill="#0e5c8a">ストーブ一台でも、行き先は三つ</text><rect x="50" y="130" width="330" height="350" rx="18" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="93" cy="172" r="24" fill="#0e5c8a"/><text x="93" y="181" text-anchor="middle" font-size="24" fill="white">1</text><g transform="translate(215,255)" fill="none" stroke="#16709f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M-20-28h25v10h17v55h-60v-55h18z"/><path d="M-15-7h22v27h-22z"/></g><text x="215" y="360" text-anchor="middle" font-size="29" font-weight="bold" fill="#0e5c8a">灯油</text><text x="215" y="416" text-anchor="middle" font-size="23" fill="#1e3f55">販売店へ相談</text><rect x="435" y="130" width="330" height="350" rx="18" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="478" cy="172" r="24" fill="#0e5c8a"/><text x="478" y="181" text-anchor="middle" font-size="24" fill="white">2</text><g transform="translate(600,255)" fill="none" stroke="#16709f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="-37" y="-34" width="74" height="75" rx="9"/><path d="M-23-13h46m-46 12h46m-46 12h46m-46 12h46"/></g><text x="600" y="360" text-anchor="middle" font-size="29" font-weight="bold" fill="#0e5c8a">本体</text><text x="600" y="416" text-anchor="middle" font-size="23" fill="#1e3f55">金物・小型電化製品</text><rect x="820" y="130" width="330" height="350" rx="18" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="863" cy="172" r="24" fill="#0e5c8a"/><text x="863" y="181" text-anchor="middle" font-size="24" fill="white">3</text><g transform="translate(985,255)" fill="none" stroke="#16709f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="-22" y="-32" width="44" height="74" rx="5"/><path d="M-9-38h18M0-15v18m-9-9h18M-9 26h18"/></g><text x="985" y="360" text-anchor="middle" font-size="29" font-weight="bold" fill="#0e5c8a">電池</text><text x="985" y="416" text-anchor="middle" font-size="23" fill="#1e3f55">有害ごみ</text><text x="600" y="553" text-anchor="middle" font-size="28" fill="#0e5c8a">販売店の受付可否・料金は、持ち込む前に確認</text><text x="600" y="602" text-anchor="middle" font-size="18" fill="#5b7488">ATAWI FUDOSAN｜2026年10月8日確認・説明用の模式図</text></g></svg>