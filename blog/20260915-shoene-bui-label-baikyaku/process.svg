<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">改修の情報を、売却広告へつなぐ3確認</title><desc id="desc">省エネ部位ラベルを売却広告へ引き継ぐ3段階。窓か給湯器の仕様と現況を確認し、発行した人と根拠資料を確かめ、ラベルと工事資料を一組で保管する。住宅全体の性能を保証するラベルではない</desc><rect width="1000" height="420" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="58" font-size="30" font-weight="bold">改修の情報を、売却広告へつなぐ3確認</text><rect x="35" y="100" width="300" height="220" rx="12" fill="white" stroke="#2E9BD4" stroke-width="2"/><text x="55" y="143" font-size="23" font-weight="bold" fill="#0e5c8a">1 記載条件</text><text x="55" y="210" font-size="24">窓か給湯器の仕様</text><text x="55" y="256" font-size="24">工事範囲と現況</text><rect x="360" y="100" width="300" height="220" rx="12" fill="white" stroke="#2E9BD4" stroke-width="2"/><text x="380" y="143" font-size="23" font-weight="bold" fill="#0e5c8a">2 発行者</text><text x="380" y="210" font-size="24">入力した人を確認</text><text x="380" y="256" font-size="24">根拠資料を照合</text><rect x="685" y="100" width="300" height="220" rx="12" fill="white" stroke="#2E9BD4" stroke-width="2"/><text x="705" y="143" font-size="23" font-weight="bold" fill="#0e5c8a">3 保管先</text><text x="705" y="210" font-size="24">ラベル＋工事資料</text><text x="705" y="256" font-size="24">売主から仲介へ</text><text x="35" y="375" font-size="21">住宅全体の性能や売値の保証ではありません。確認できた部位を伝えます。</text></g></svg>