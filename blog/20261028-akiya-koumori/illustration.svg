<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">空き家のコウモリ対応、封鎖前の確認</title><desc id="desc">家の軒下、戸袋、換気口を観察し、写真記録、専門相談、見積り確認へ進む説明図</desc><rect width="960" height="680" rx="22" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="48" y="62" font-size="32" font-weight="bold">穴を塞ぐ前に、確認をつなぐ</text><path d="M290 254 L480 118 L670 254" fill="none" stroke="#0e5c8a" stroke-width="16" stroke-linejoin="round"/><path d="M315 250V390H645V250" fill="#fff" stroke="#0e5c8a" stroke-width="8"/><rect x="365" y="278" width="90" height="80" fill="#cde2f0" stroke="#16709f" stroke-width="5"/><path d="M410 278V358" stroke="#16709f" stroke-width="5"/><rect x="457" y="278" width="26" height="80" fill="#84bddd"/><circle cx="569" cy="283" r="24" fill="#e9f5fc" stroke="#16709f" stroke-width="5"/><path d="M551 278H587 M551 287H587" stroke="#16709f" stroke-width="4"/><g font-size="25"><text x="80" y="227">軒下</text><path d="M148 224H290L329 245" fill="none" stroke="#2e9bd4" stroke-width="3"/><text x="92" y="341">戸袋</text><path d="M159 336H270L470 318" fill="none" stroke="#2e9bd4" stroke-width="3"/><text x="741" y="291">換気口</text><path d="M725 286H598" stroke="#2e9bd4" stroke-width="3"/></g><g font-size="25" text-anchor="middle"><rect x="42" y="430" width="260" height="110" rx="12" fill="#e0f0fa"/><text x="172" y="472" font-weight="bold">1 写真と日時</text><text x="172" y="511">地上から記録</text><rect x="350" y="430" width="260" height="110" rx="12" fill="#e0f0fa"/><text x="480" y="472" font-weight="bold">2 専門業者へ</text><text x="480" y="511">状態・時期を相談</text><rect x="658" y="430" width="260" height="110" rx="12" fill="#e0f0fa"/><text x="788" y="472" font-weight="bold">3 見積り確認</text><text x="788" y="511">作業範囲を分ける</text></g><g fill="#16709f"><path d="M314 478H330V467L343 485L330 503V492H314Z"/><path d="M622 478H638V467L651 485L638 503V492H622Z"/></g><text x="480" y="599" text-anchor="middle" font-size="27" font-weight="bold">冬眠前後は、自己判断で塞がない</text><text x="480" y="641" text-anchor="middle" font-size="21">説明図：施工の可否は現地の確認が必要です</text></g></svg>