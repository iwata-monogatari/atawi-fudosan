<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><rect width="1000" height="560" rx="20" fill="#f2f9fe"/><g font-family="Yu Gothic, sans-serif" fill="#1e3f55" text-anchor="middle"><text x="500" y="58" font-size="30" font-weight="bold">空き家1戸を、住まいと支援の計画へ</text><rect x="55" y="100" width="385" height="235" rx="16" fill="#e9f5fc" stroke="#2e9bd4" stroke-width="3"/><path d="M205 157 L248 120 L291 157 V205 H205Z" fill="#2e9bd4"/><text x="248" y="247" font-size="29">貸主</text><text x="248" y="286" font-size="22">住宅・家賃・修繕を整理</text><rect x="560" y="100" width="385" height="235" rx="16" fill="#e9f5fc" stroke="#2e9bd4" stroke-width="3"/><circle cx="752" cy="151" r="26" fill="#2e9bd4"/><path d="M711 211 Q711 175 752 175 Q793 175 793 211" fill="#2e9bd4"/><text x="752" y="247" font-size="29">支援提供者</text><text x="752" y="286" font-size="22">安否確認・見守り・福祉へつなぐ</text><path d="M453 218 H543 M530 208 L543 218 L530 228 M466 208 L453 218 L466 228" stroke="#16709f" stroke-width="4" fill="none"/><text x="500" y="380" font-size="24">連名で計画を申請（兼務なら1者も可）</text><path d="M500 392 V418 M490 406 L500 418 L510 406" stroke="#16709f" stroke-width="4" fill="none"/><rect x="220" y="430" width="560" height="80" rx="14" fill="#0e5c8a"/><text x="500" y="480" font-size="27" fill="white">住宅所在地の自治体が計画を認定</text></g></svg>