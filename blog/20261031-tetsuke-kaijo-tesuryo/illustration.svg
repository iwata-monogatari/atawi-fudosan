<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" rx="24" fill="#edf7fc"/><g font-family="Yu Gothic,Meiryo,sans-serif" text-anchor="middle"><text x="480" y="70" font-size="30" fill="#145574" font-weight="bold">解除後のお金は、二つに分けて確認</text><rect x="55" y="110" width="405" height="245" rx="18" fill="white" stroke="#b7dae9"/><rect x="500" y="110" width="405" height="245" rx="18" fill="white" stroke="#b7dae9"/><text x="258" y="165" font-size="28" fill="#1575a1" font-weight="bold">売主 ⇄ 買主</text><text x="702" y="165" font-size="28" fill="#1575a1" font-weight="bold">売主 ⇄ 仲介業者</text><text x="258" y="225" font-size="35" fill="#163c51" font-weight="bold">手付金</text><text x="702" y="225" font-size="35" fill="#163c51" font-weight="bold">仲介手数料</text><text x="258" y="280" font-size="22" fill="#47697b">売買契約と解除の経緯</text><text x="702" y="280" font-size="22" fill="#47697b">媒介契約と報酬の約定</text><text x="258" y="320" font-size="20" fill="#47697b">精算方法を確認する</text><text x="702" y="320" font-size="20" fill="#47697b">総額・既払額・残額を確認</text><text x="480" y="420" font-size="28" fill="#145574" font-weight="bold">「解除した」だけで、ゼロとも満額とも決めない</text><text x="480" y="475" font-size="23" fill="#47697b">請求の根拠と業務の説明を求める</text><text x="480" y="530" font-size="20" fill="#47697b">個別の支払義務・返還・減額は専門家に確認</text></g></svg>