<svg xmlns="http://www.w3.org/2000/svg" width="400" height="596" viewBox="0 0 400 596" role="img" aria-labelledby="t d">
<title id="t">印紙税の軽減の例</title>
<desc id="d">記載金額1,000万円超5,000万円以下は本則2万円が軽減で1万円。電子契約は課税対象外。</desc>
<rect width="400" height="596" rx="18" fill="#eef7f0"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#1e6b3a">印紙税の軽減の例</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#7dbb93"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#1e6b3a">記載金額で税額が決まる</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">500万円超1,000万円以下：軽減5千円</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">1,000万円超5,000万円以下：軽減1万円</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#2e9650" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#7dbb93"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#1e6b3a">軽減措置の期間</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">平成26年4月1日〜令和9年3月31日作成分</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">申請手続きは不要</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#2e9650" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#1e6b3a"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#fff">電子契約の場合</text>
<text x="36" y="454" font-size="20" font-weight="bold" fill="#fff">電磁的記録は課税文書に当たらない</text>
<text x="36" y="482" font-size="20" font-weight="bold" fill="#fff">紙の契約書とは扱いが異なる</text>
<text x="24" y="550" font-size="20" fill="#1e3f55">金額は契約書の記載金額（税込・税抜の判定あり）で決まります。</text>
<text x="24" y="578" font-size="20" fill="#4e7288">出典：国税庁「不動産の譲渡に関する契約書等の印紙税の軽減措置」</text>
</g></svg>
