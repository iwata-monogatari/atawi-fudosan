<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">定期借家は、契約に進む前に3確認</title><desc id="desc">定期借家の契約前に、貸主か代理人かを確かめ、紙または承諾を得た電子提供で説明事項を渡し、文書・日時・受取りと説明の記録を保管する3段階</desc><rect width="1000" height="360" rx="20" fill="#e9f5fc"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#1e3f55"><text x="42" y="53" font-size="29" font-weight="700">定期借家は、契約に進む前に3確認</text><rect x="35" y="90" width="280" height="177" rx="14" fill="white" stroke="#cde2f0"/><circle cx="70" cy="127" r="21" fill="#0e5c8a"/><text x="70" y="135" text-anchor="middle" fill="white" font-size="24">1</text><text x="55" y="187" font-size="26" font-weight="700">説明する人</text><text x="55" y="228" font-size="21">貸主・代理人を確認</text><path d="M324 178h23m-9-9 9 9-9 9" fill="none" stroke="#16709f" stroke-width="4"/><rect x="360" y="90" width="280" height="177" rx="14" fill="white" stroke="#cde2f0"/><circle cx="395" cy="127" r="21" fill="#0e5c8a"/><text x="395" y="135" text-anchor="middle" fill="white" font-size="24">2</text><text x="380" y="187" font-size="26" font-weight="700">交付する方法</text><text x="380" y="228" font-size="21">紙か電子かを合意</text><path d="M649 178h23m-9-9 9 9-9 9" fill="none" stroke="#16709f" stroke-width="4"/><rect x="685" y="90" width="280" height="177" rx="14" fill="white" stroke="#cde2f0"/><circle cx="720" cy="127" r="21" fill="#0e5c8a"/><text x="720" y="135" text-anchor="middle" fill="white" font-size="24">3</text><text x="705" y="187" font-size="26" font-weight="700">残す記録</text><text x="705" y="228" font-size="21">文書・日時・受取り</text><text x="40" y="320" font-size="21">重要事項説明だけでは代わりません。電子提供にも説明が必要です。</text></g></svg>