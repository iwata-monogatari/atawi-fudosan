<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img"><title>売却時の全額返済と、一部返済を分ける</title><desc>静岡銀行の住宅ローン等有担保の現行表で、全額繰上返済は固定・変動ミックス型の固定期間中などが1件税込33,000円、それ以外は11,000円。一部繰上返済のしずぎんダイレクト利用時の無料案内と区別する比較図。2026年9月17日確認。</desc><rect width="1200" height="660" rx="24" fill="#e9f5fc"/><g font-family="Yu Gothic, sans-serif" fill="#1e3f55"><text x="60" y="80" font-size="34" font-weight="700">売却時の全額返済と、一部返済を分ける</text><rect x="45" y="145" width="330" height="270" rx="16" fill="white" stroke="#2E9BD4" stroke-width="3"/><text x="210" y="210" text-anchor="middle" font-size="28" font-weight="700">全額返済・対象期間</text><text x="210" y="282" text-anchor="middle" font-size="28" font-weight="700">33,000円</text><text x="210" y="354" text-anchor="middle" font-size="20" font-weight="400">固定期間中・上限金利設定中</text><path d="M387 263 l24 17 -24 17" fill="none" stroke="#16709f" stroke-width="5"/><rect x="435" y="145" width="330" height="270" rx="16" fill="white" stroke="#2E9BD4" stroke-width="3"/><text x="600" y="210" text-anchor="middle" font-size="28" font-weight="700">全額返済・それ以外</text><text x="600" y="282" text-anchor="middle" font-size="28" font-weight="700">11,000円</text><text x="600" y="354" text-anchor="middle" font-size="20" font-weight="400">契約の金利区分を銀行で確認</text><path d="M777 263 l24 17 -24 17" fill="none" stroke="#16709f" stroke-width="5"/><rect x="825" y="145" width="330" height="270" rx="16" fill="white" stroke="#2E9BD4" stroke-width="3"/><text x="990" y="210" text-anchor="middle" font-size="28" font-weight="700">一部返済・ネット</text><text x="990" y="282" text-anchor="middle" font-size="28" font-weight="700">無料の案内あり</text><text x="990" y="354" text-anchor="middle" font-size="20" font-weight="400">全額返済とは別の取扱い</text><text x="60" y="505" font-size="25">静岡銀行・住宅ローン等（有担保）の現行料金表。金額は税込・1件。</text><text x="60" y="565" font-size="25">2026年9月17日確認。残高・利息・抵当権抹消費用は含みません。</text></g></svg>