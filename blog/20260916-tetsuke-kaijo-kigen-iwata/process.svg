<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">手付解除は、契約書と作業記録をセットで</title><desc id="desc">手付解除の確認では、契約書の期日と特約、相手方の実際の行為と日付をそろえて弁護士へ示し、解除の可否と金銭提供の手順を確認する。日付が期限前でも解除できると断定しない。</desc><rect width="1200" height="660" rx="24" fill="#e9f5fc"/><g font-family="Yu Gothic, sans-serif" fill="#1e3f55"><text x="60" y="82" font-size="36" font-weight="700">手付解除は、契約書と作業記録をセットで</text><rect x="50" y="145" width="340" height="315" rx="18" fill="white" stroke="#cde2f0" stroke-width="3"/><rect x="50" y="145" width="340" height="74" rx="18" fill="#0e5c8a"/><text x="75" y="193" font-size="28" fill="white" font-weight="700">1 契約書</text><text x="75" y="260" font-size="25" fill="#1e3f55" font-weight="400">解除期日・特約</text><text x="75" y="313" font-size="25" fill="#1e3f55" font-weight="400">履行着手との関係</text><path d="M 400 295 l 20 15 -20 15" fill="none" stroke="#2E9BD4" stroke-width="5"/><rect x="430" y="145" width="340" height="315" rx="18" fill="white" stroke="#cde2f0" stroke-width="3"/><rect x="430" y="145" width="340" height="74" rx="18" fill="#0e5c8a"/><text x="455" y="193" font-size="28" fill="white" font-weight="700">2 実際の行為</text><text x="455" y="260" font-size="25" fill="#1e3f55" font-weight="400">相手方が何をしたか</text><text x="455" y="313" font-size="25" fill="#1e3f55" font-weight="400">日時・依頼内容・記録</text><path d="M 780 295 l 20 15 -20 15" fill="none" stroke="#2E9BD4" stroke-width="5"/><rect x="810" y="145" width="340" height="315" rx="18" fill="white" stroke="#cde2f0" stroke-width="3"/><rect x="810" y="145" width="340" height="74" rx="18" fill="#0e5c8a"/><text x="835" y="193" font-size="28" fill="white" font-weight="700">3 弁護士に確認</text><text x="835" y="260" font-size="25" fill="#1e3f55" font-weight="400">解除の可否と期限</text><text x="835" y="313" font-size="25" fill="#1e3f55" font-weight="400">金銭提供・通知方法</text><text x="60" y="535" font-size="25">期日前なら必ず解除できる、とは限りません。</text><text x="60" y="578" font-size="25">具体的な行為が履行着手かどうかは、個別に確認します。</text></g></svg>