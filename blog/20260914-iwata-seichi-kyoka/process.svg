<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">土を動かす発注より先に、判断材料を</title><desc id="desc">磐田市の売却前整地は、土を入れる削る範囲と高さを図にし、相談シートと添付資料で許可の要否を相談し、諸費用と工期を含む見積もりで発注を判断する手順</desc><rect width="1000" height="360" rx="20" fill="#e9f5fc"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#1e3f55"><text x="42" y="53" font-size="29" font-weight="700">土を動かす発注より先に、判断材料を</text><rect x="35" y="90" width="280" height="177" rx="14" fill="white" stroke="#cde2f0"/><circle cx="70" cy="127" r="21" fill="#0e5c8a"/><text x="70" y="135" text-anchor="middle" fill="white" font-size="24">1</text><text x="55" y="187" font-size="26" font-weight="700">工事を図にする</text><text x="55" y="228" font-size="21">範囲・高さ・土の行先</text><path d="M324 178h23m-9-9 9 9-9 9" fill="none" stroke="#16709f" stroke-width="4"/><rect x="360" y="90" width="280" height="177" rx="14" fill="white" stroke="#cde2f0"/><circle cx="395" cy="127" r="21" fill="#0e5c8a"/><text x="395" y="135" text-anchor="middle" fill="white" font-size="24">2</text><text x="380" y="187" font-size="26" font-weight="700">許可を相談する</text><text x="380" y="228" font-size="21">相談シートと添付資料</text><path d="M649 178h23m-9-9 9 9-9 9" fill="none" stroke="#16709f" stroke-width="4"/><rect x="685" y="90" width="280" height="177" rx="14" fill="white" stroke="#cde2f0"/><circle cx="720" cy="127" r="21" fill="#0e5c8a"/><text x="720" y="135" text-anchor="middle" fill="white" font-size="24">3</text><text x="705" y="187" font-size="26" font-weight="700">総額で判断する</text><text x="705" y="228" font-size="21">諸費用・工期・売り方</text><text x="40" y="320" font-size="21">相談と許可は別です。必要な許可を得てから着工します。</text></g></svg>