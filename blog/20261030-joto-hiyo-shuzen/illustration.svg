<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d"><title id="t">費用の整理</title><desc id="d">売却に直接かかった費用、維持管理の費用、目的が分からない支出に領収書を仮分けし、資料を添えて税理士に相談する図。</desc><rect width="960" height="520" rx="24" fill="#f2f9fe"/><g text-anchor="middle" font-family="sans-serif" fill="#0e5c8a"><text x="480" y="65" font-size="32" font-weight="bold">領収書を目的ごとに仮分け</text><rect x="55" y="105" width="265" height="180" rx="14" fill="white" stroke="#2e9bd4" stroke-width="3"/><text x="187" y="162" font-size="24" font-weight="bold">売却のため</text><text x="187" y="208" font-size="20">仲介手数料など</text><rect x="347" y="105" width="265" height="180" rx="14" fill="white" stroke="#2e9bd4" stroke-width="3"/><text x="480" y="162" font-size="24" font-weight="bold">維持・管理</text><text x="480" y="208" font-size="20">修繕費など</text><rect x="640" y="105" width="265" height="180" rx="14" fill="white" stroke="#2e9bd4" stroke-width="3"/><text x="772" y="162" font-size="24" font-weight="bold">目的が不明</text><text x="772" y="208" font-size="20">経緯を確認</text><text x="480" y="335" font-size="32">↓</text><rect x="105" y="365" width="750" height="100" rx="14" fill="white" stroke="#2e9bd4" stroke-width="3"/><text x="480" y="424" font-size="24">契約書・領収書を添えて税理士へ確認</text></g></svg>
