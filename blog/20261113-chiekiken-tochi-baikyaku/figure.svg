<svg xmlns="http://www.w3.org/2000/svg" width="400" height="749" viewBox="0 0 400 749" role="img" aria-labelledby="t d">
<title id="t">地役権の見方</title>
<desc id="d">便益を受ける要役地か、負担する承役地かを分け、登記簿の乙区で目的と範囲を確認する。地役権は要役地の所有権とともに移転する。</desc>
<rect width="400" height="749" rx="18" fill="#fdf6f0"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#9e5a24">地役権の見方</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#ddae7f"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#9e5a24">要役地か承役地か</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">便益を受ける側か</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">負担する側かを分ける</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#b5712f" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#ddae7f"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#9e5a24">登記簿の乙区を見る</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">目的と範囲が登記の</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">事項になっている</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#b5712f" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#fff" stroke="#ddae7f"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#9e5a24">売却でも権利は残る</text>
<text x="36" y="454" font-size="20" fill="#1e3f55">要役地の所有権と</text>
<text x="36" y="482" font-size="20" fill="#1e3f55">ともに移転する</text>
<path d="M200 517v12m-5-5 5 5 5-5" fill="none" stroke="#b5712f" stroke-width="2"/>
<rect x="20" y="531" width="360" height="136" rx="12" fill="#9e5a24"/>
<text x="36" y="567" font-size="24" font-weight="bold" fill="#fff">登記なしは対抗できない</text>
<text x="36" y="607" font-size="20" font-weight="bold" fill="#fff">合意だけでは買主に</text>
<text x="36" y="635" font-size="20" font-weight="bold" fill="#fff">権利を主張しにくい</text>
<text x="24" y="703" font-size="20" fill="#1e3f55">囲繞地通行権とは別の権利</text>
<text x="24" y="731" font-size="20" fill="#4e7288">出典：民法11月確認</text>
</g></svg>
