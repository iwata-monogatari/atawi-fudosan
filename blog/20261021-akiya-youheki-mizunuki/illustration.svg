<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">擁壁は観察・依頼・判断を分ける</title><desc id="desc">擁壁の管理を、安全な位置から全体と水抜き穴を記録する段階、清掃と構造点検を分けて相談する段階、図面と履歴を家族で共有する段階に分けた図。穴の清掃だけで安全と判断しない。</desc><rect width="800" height="720" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="54" font-size="27" font-weight="bold">擁壁は観察・依頼・判断を分ける</text><rect x="30" y="90" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="133" r="23" fill="#0e5c8a"/><text x="69" y="142" text-anchor="middle" fill="white" font-size="26">1</text><text x="109" y="140" font-size="27" font-weight="bold">離れて記録</text><text x="109" y="191" font-size="25">全体・穴・変化を写真に残す</text><text x="109" y="230" font-size="23">高所や壁の下へ無理に入らない</text><rect x="30" y="285" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="328" r="23" fill="#0e5c8a"/><text x="69" y="337" text-anchor="middle" fill="white" font-size="26">2</text><text x="109" y="335" font-size="27" font-weight="bold">作業範囲を相談</text><text x="109" y="386" font-size="25">清掃と構造点検を分けて依頼</text><text x="109" y="425" font-size="23">穴の奥へ棒を押し込まない</text><rect x="30" y="480" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="523" r="23" fill="#0e5c8a"/><text x="69" y="532" text-anchor="middle" fill="white" font-size="26">3</text><text x="109" y="530" font-size="27" font-weight="bold">資料をそろえる</text><text x="109" y="581" font-size="25">図面・履歴・見積りを家族で共有</text><text x="109" y="620" font-size="23">売却の結論は確認材料の後で</text><text x="40" y="704" font-size="17">2026年10月21日確認｜本文の出典と個別条件を照合</text></g></svg>