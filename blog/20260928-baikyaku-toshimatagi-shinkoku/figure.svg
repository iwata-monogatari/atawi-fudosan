<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">年またぎ売却：仮の日程と所得の年分</title><desc id="desc">仮に2026年12月に契約の効力が発生し2027年1月に引き渡す場合、原則は2027年分、契約の効力発生日による申告を選択する場合は2026年分となる図</desc><rect width="960" height="430" rx="16" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="56" font-size="27" font-weight="bold">年またぎ売却：仮の日程と所得の年分</text><rect x="40" y="100" width="440" height="105" rx="12" fill="#e9f5fc" stroke="#2E9BD4"/><text x="60" y="140" font-size="18" fill="#16709f">01</text><text x="60" y="168" font-size="19"><tspan x="60" dy="0">仮の契約効力発生：2026年12月</tspan></text><rect x="500" y="100" width="440" height="105" rx="12" fill="#e9f5fc" stroke="#2E9BD4"/><text x="520" y="140" font-size="18" fill="#16709f">02</text><text x="520" y="168" font-size="19"><tspan x="520" dy="0">仮の引渡し：2027年1月</tspan></text><rect x="40" y="230" width="440" height="105" rx="12" fill="#ffffff" stroke="#2E9BD4"/><text x="60" y="270" font-size="18" fill="#16709f">03</text><text x="60" y="298" font-size="19"><tspan x="60" dy="0">原則：2027年分</tspan></text><rect x="500" y="230" width="440" height="105" rx="12" fill="#ffffff" stroke="#2E9BD4"/><text x="520" y="270" font-size="18" fill="#16709f">04</text><text x="520" y="298" font-size="19"><tspan x="520" dy="0">契約効力発生日を選択：2026年分</tspan></text><text x="40" y="390" font-size="20">通常の宅地・建物の仮例。個別の税務判断は税理士へ</text></g></svg>