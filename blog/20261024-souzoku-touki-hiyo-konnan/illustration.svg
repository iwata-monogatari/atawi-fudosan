<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">費用が難しいときの相談準備</title><desc id="desc">相続登記の費用が難しい場合の相談準備を示す図。税や証明書と依頼報酬を区分し、支払えない事情を整理し、届いた通知の期限を確認する。正当な理由に当たるかは個別に確認する。</desc><rect width="800" height="720" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="54" font-size="27" font-weight="bold">費用が難しいときの相談準備</text><rect x="30" y="90" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="133" r="23" fill="#0e5c8a"/><text x="69" y="142" text-anchor="middle" fill="white" font-size="26">1</text><text x="109" y="140" font-size="27" font-weight="bold">費用の内訳</text><text x="109" y="191" font-size="25">税・証明書・依頼報酬を分ける</text><text x="109" y="230" font-size="23">見積りの総額だけで止まらない</text><rect x="30" y="285" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="328" r="23" fill="#0e5c8a"/><text x="69" y="337" text-anchor="middle" fill="white" font-size="26">2</text><text x="109" y="335" font-size="27" font-weight="bold">支払えない事情</text><text x="109" y="386" font-size="25">収入・支出と現在の状況を整理</text><text x="109" y="425" font-size="23">必要資料は相談先に確認</text><rect x="30" y="480" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="523" r="23" fill="#0e5c8a"/><text x="69" y="532" text-anchor="middle" fill="white" font-size="26">3</text><text x="109" y="530" font-size="27" font-weight="bold">通知と期限</text><text x="109" y="581" font-size="25">届いた書面と指定日を確認</text><text x="109" y="620" font-size="23">催告を自己判断で放置しない</text><text x="40" y="704" font-size="17">2026年10月24日確認｜本文の出典と個別条件を照合</text></g></svg>