<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 560" role="img" aria-labelledby="title desc"><title id="title">使わない家の、浄化槽の順番</title><desc id="desc">空き家の浄化槽を休止する順序。最初に休止のための清掃と記録の受領、次に休止届と指定検査機関への連絡、最後に再開時の業者・費用・担当者の記録を行う。</desc><rect width="320" height="560" fill="white"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="16" y="32" font-size="20" font-weight="bold">使わない家の、浄化槽の順番</text><rect x="12" y="100" width="296" height="112" rx="12" fill="#e9f5fc"/><text x="26" y="129" font-size="19" font-weight="bold">1 清掃する</text><text x="26" y="159" font-size="16">休止用の清掃記録を受け取る</text><rect x="12" y="230" width="296" height="112" rx="12" fill="#e9f5fc"/><text x="26" y="259" font-size="19" font-weight="bold">2 届け出る</text><text x="26" y="289" font-size="16">窓口と指定検査機関へ連絡</text><rect x="12" y="360" width="296" height="112" rx="12" fill="#e9f5fc"/><text x="26" y="389" font-size="19" font-weight="bold">3 再開に備える</text><text x="26" y="419" font-size="16">業者・費用・届出担当を残す</text><text x="16" y="515" font-size="16">出典：本文末の一次情報</text><text x="16" y="541" font-size="16">2026年11月7日確認／大石浩之</text></g></svg>