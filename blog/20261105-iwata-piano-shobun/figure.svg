<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="title desc"><title id="title">ピアノの搬出経路を伝える写真メモ</title><desc id="desc">室内は本体と型番、玄関は曲がり角と段差、屋外は門と車の位置を撮影する。</desc><rect width="640" height="430" rx="18" fill="#edf6fb"/><g font-family="Meiryo,sans-serif" fill="#154461"><text x="32" y="51" font-size="31" font-weight="700">搬出見積もりに添える写真</text><g transform="translate(25 78)"><rect width="590" height="93" rx="12" fill="#fff"/><circle cx="45" cy="45" r="28" fill="#18638b"/><text x="45" y="55" text-anchor="middle" font-size="29" fill="white">1</text><text x="91" y="56" font-size="30" font-weight="700">本体</text><path d="M184 16v60" stroke="#b8d5e5" stroke-width="2"/><text x="208" y="43" font-size="27">型番と設置階</text><text x="208" y="73" font-size="22" fill="#426679">鍵盤のある居室</text></g><g transform="translate(25 188)"><rect width="590" height="93" rx="12" fill="#fff"/><circle cx="45" cy="45" r="28" fill="#18638b"/><text x="45" y="55" text-anchor="middle" font-size="29" fill="white">2</text><text x="91" y="56" font-size="30" font-weight="700">玄関</text><path d="M184 16v60" stroke="#b8d5e5" stroke-width="2"/><text x="208" y="43" font-size="27">曲がり角と段差</text><text x="208" y="73" font-size="22" fill="#426679">廊下から外へ</text></g><g transform="translate(25 298)"><rect width="590" height="93" rx="12" fill="#fff"/><circle cx="45" cy="45" r="28" fill="#18638b"/><text x="45" y="55" text-anchor="middle" font-size="29" fill="white">3</text><text x="91" y="56" font-size="30" font-weight="700">屋外</text><path d="M184 16v60" stroke="#b8d5e5" stroke-width="2"/><text x="208" y="43" font-size="27">門と車の位置</text><text x="208" y="73" font-size="22" fill="#426679">道路までの経路</text></g></g></svg>