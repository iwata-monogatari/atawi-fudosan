<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">手数料と売却代金を別の列に</title><desc id="desc">仲介手数料について、媒介契約前に報酬額と受領時期を確認し、売買契約時は書面交付の条件と各回の金額を照合し、残代金決済までの先行支出と変更時の扱いを確認する説明図。</desc><rect width="800" height="720" rx="16" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="30" y="52" font-size="26" font-weight="bold">手数料と売却代金を別の列に</text><rect x="25" y="85" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="128" r="23" fill="#0e5c8a"/><text x="62" y="137" text-anchor="middle" fill="white" font-size="26">1</text><text x="102" y="136" font-size="27" font-weight="bold">媒介契約の前</text><text x="45" y="190" font-size="26">報酬額と受領時期の欄を見る</text><text x="45" y="231" font-size="23">空欄や口頭説明だけで進めない</text><rect x="25" y="280" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="323" r="23" fill="#0e5c8a"/><text x="62" y="332" text-anchor="middle" fill="white" font-size="26">2</text><text x="102" y="331" font-size="27" font-weight="bold">売買契約のとき</text><text x="45" y="385" font-size="26">書面交付の条件と支払額を照合</text><text x="45" y="426" font-size="23">半額払いは一律の決まりではない</text><rect x="25" y="475" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="518" r="23" fill="#0e5c8a"/><text x="62" y="527" text-anchor="middle" fill="white" font-size="26">3</text><text x="102" y="526" font-size="27" font-weight="bold">残代金の決済まで</text><text x="45" y="580" font-size="26">入金日より先の支出を計算</text><text x="45" y="621" font-size="23">日程変更・解除時の扱いも確認</text><text x="30" y="702" font-size="17">2026年10月27日確認｜個別条件と本文の出典を照合</text></g></svg>