<svg xmlns="http://www.w3.org/2000/svg" width="600" height="760" viewBox="0 0 600 760" role="img" aria-labelledby="title desc"><title id="title">家を残す方法と売る方法</title><desc id="desc">元金を一括返済。自宅を残すことができる。担保物件を売って返済。自宅は残せない。売却後の残債は契約の型で異なる</desc><rect width="600" height="760" rx="24" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="32" y="58" font-size="30" font-weight="bold">家を残す方法と売る方法</text><rect x="30" y="100" width="540" height="210" rx="18" fill="white" stroke="#2e9bd4" stroke-width="3"/><text x="55" y="162" font-size="30" font-weight="bold">元金を一括返済</text><path d="M300 184v30m-9-9 9 9 9-9" stroke="#16709f" stroke-width="4" fill="none"/><text x="55" y="260" font-size="28">自宅を残すことができる</text><rect x="30" y="350" width="540" height="210" rx="18" fill="white" stroke="#2e9bd4" stroke-width="3"/><text x="55" y="412" font-size="30" font-weight="bold">担保物件を売って返済</text><path d="M300 434v30m-9-9 9 9 9-9" stroke="#16709f" stroke-width="4" fill="none"/><text x="55" y="510" font-size="28">自宅は残せない</text><text x="32" y="650" font-size="28" font-weight="bold">売却後の残債は契約の型で異なる</text></g></svg>