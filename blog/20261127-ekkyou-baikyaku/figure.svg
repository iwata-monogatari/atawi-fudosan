<svg xmlns="http://www.w3.org/2000/svg" width="400" height="596" viewBox="0 0 400 596" role="img" aria-labelledby="t d">
<title id="t">越境対応の進め方</title>
<desc id="d">現況の特定、隣地との覚書、買主への告知の3段階で進める。</desc>
<rect width="400" height="596" rx="18" fill="#f2efe9"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#6b4f1e">越境対応の進め方</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#bba87d"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#6b4f1e">まず越境物を特定する</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">枝・庇・塀・雨どい・給排水管など</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">測量図に越境の位置を書き込む</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#96762e" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#bba87d"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#6b4f1e">隣地と覚書を交わす</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">現況の相互確認と将来の解消を約束</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">代替わりしても引き継がれる形にする</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#96762e" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#6b4f1e"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#fff">買主へ正確に伝える</text>
<text x="36" y="454" font-size="20" font-weight="bold" fill="#fff">重要事項説明と物件状況報告書に記載</text>
<text x="36" y="482" font-size="20" font-weight="bold" fill="#fff">覚書の写しを買主へ引き継ぐ</text>
<text x="24" y="550" font-size="20" fill="#1e3f55">覚書は、境界そのものを決める書類とは役割が違います。</text>
<text x="24" y="578" font-size="20" fill="#4e7288">出典：民法（相隣関係）・国土交通省の案内</text>
</g></svg>
