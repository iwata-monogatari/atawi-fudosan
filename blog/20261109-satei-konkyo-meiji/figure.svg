<svg xmlns="http://www.w3.org/2000/svg" width="400" height="612" viewBox="0 0 400 612" role="img" aria-labelledby="t d"><title id="t">査定書で確かめる順番</title><desc id="d">比較に使った取引事例の件数・時期・場所、土地の形や道路や建物の状態など違いの調整の中身、査定価格と売出価格の違いの順に確認する。</desc><rect width="400" height="612" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif"><text x="24" y="44" font-size="25" font-weight="bold" fill="#0e5c8a">査定書で確かめる順番</text><rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#2e9bd4"/><text x="36" y="108" font-size="24" font-weight="bold" fill="#0e5c8a">1 取引事例</text><text x="36" y="148" font-size="20" fill="#1e3f55">件数・時期・場所が</text><text x="36" y="176" font-size="20" fill="#1e3f55">自分の家に近いか</text><path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#16709f" stroke-width="2"/><rect x="20" y="226" width="360" height="136" rx="12" fill="#fff" stroke="#2e9bd4"/><text x="36" y="262" font-size="24" font-weight="bold" fill="#0e5c8a">2 違いの調整</text><text x="36" y="302" font-size="20" fill="#1e3f55">土地の形・道路・状態</text><text x="36" y="330" font-size="20" fill="#1e3f55">増減の理由を見る</text><path d="M200 365v12m-5-5 5 5 5-5" fill="none" stroke="#16709f" stroke-width="2"/><rect x="20" y="380" width="360" height="136" rx="12" fill="#fff" stroke="#2e9bd4"/><text x="36" y="416" font-size="24" font-weight="bold" fill="#0e5c8a">3 査定と売出価格</text><text x="36" y="456" font-size="20" fill="#1e3f55">査定は目安、売出価格は</text><text x="36" y="484" font-size="20" fill="#1e3f55">相談して決める価格</text><text x="24" y="566" font-size="20" fill="#4e7288">出典：国土交通省</text><text x="24" y="594" font-size="20" fill="#4e7288">2026年11月9日確認</text></g></svg>