<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">家賃5万円の例：合計額で比べる</title><desc id="desc">月額賃料5万円の比較図。通常の仲介手数料合計上限は税込5万5千円、長期の空家等の特例は税込11万円。特例の配分例は貸主8万2500円と借主2万7500円で、上限は定額ではなく事前合意が必要</desc><rect width="1000" height="420" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="58" font-size="30" font-weight="bold">家賃5万円の例：合計額で比べる</text><rect x="35" y="100" width="300" height="220" rx="12" fill="white" stroke="#2E9BD4" stroke-width="2"/><text x="55" y="143" font-size="23" font-weight="bold" fill="#0e5c8a">通常の合計上限</text><text x="55" y="210" font-size="24">5万5,000円</text><rect x="360" y="100" width="300" height="220" rx="12" fill="white" stroke="#2E9BD4" stroke-width="2"/><text x="380" y="143" font-size="23" font-weight="bold" fill="#0e5c8a">特例の合計上限</text><text x="380" y="210" font-size="24">11万円</text><rect x="685" y="100" width="300" height="220" rx="12" fill="white" stroke="#2E9BD4" stroke-width="2"/><text x="705" y="143" font-size="23" font-weight="bold" fill="#0e5c8a">特例の配分例</text><text x="705" y="210" font-size="24">貸主8万2,500円</text><text x="705" y="256" font-size="24">借主2万7,500円</text><text x="35" y="375" font-size="21">すべて税込。特例は対象確認・媒介費用の勘案・依頼時の事前合意が前提。</text></g></svg>