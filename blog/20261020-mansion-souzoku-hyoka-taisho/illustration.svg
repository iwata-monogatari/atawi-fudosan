<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">相続マンション評価の確認順</title><desc id="desc">マンションの相続税評価で、取得時期、用途や区分登記などの対象判定、家屋と土地の資料確認を順に進める図。売却査定とは分けて税理士に確認する。</desc><rect width="800" height="720" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="54" font-size="27" font-weight="bold">相続マンション評価の確認順</text><rect x="30" y="90" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="133" r="23" fill="#0e5c8a"/><text x="69" y="142" text-anchor="middle" fill="white" font-size="26">1</text><text x="109" y="140" font-size="27" font-weight="bold">取得時期</text><text x="109" y="191" font-size="25">2024年1月1日以後か</text><text x="109" y="230" font-size="23">相続・遺贈・贈与の取得日を確認</text><rect x="30" y="285" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="328" r="23" fill="#0e5c8a"/><text x="69" y="337" text-anchor="middle" fill="white" font-size="26">2</text><text x="109" y="335" font-size="27" font-weight="bold">対象の判定</text><text x="109" y="386" font-size="25">用途・登記・総階数を照合</text><text x="109" y="425" font-size="23">高層でないだけでは対象外にならない</text><rect x="30" y="480" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="523" r="23" fill="#0e5c8a"/><text x="69" y="532" text-anchor="middle" fill="white" font-size="26">3</text><text x="109" y="530" font-size="27" font-weight="bold">資料を渡す</text><text x="109" y="581" font-size="25">家屋と土地の情報をそろえる</text><text x="109" y="620" font-size="23">税理士へ確認し、売却査定と分ける</text><text x="40" y="704" font-size="17">2026年10月20日確認｜本文の出典と個別条件を照合</text></g></svg>