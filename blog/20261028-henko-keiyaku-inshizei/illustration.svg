<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">変更契約の記載金額を分ける</title><desc id="desc">原契約を特定でき変更額が明らかな場合の、変更契約書の記載金額の説明図。仮例として売買価格二千万円を二千百万円へ増額した場合は増加額百万円、千九百万円へ減額した場合は記載金額なしとなる。記載金額なしは非課税と同じ意味ではなく、書面を税務署等へ確認することを示す。</desc><rect width="800" height="720" rx="16" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="30" y="52" font-size="26" font-weight="bold">変更契約の記載金額を分ける</text><rect x="25" y="85" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="128" r="23" fill="#0e5c8a"/><text x="62" y="137" text-anchor="middle" fill="white" font-size="26">1</text><text x="102" y="136" font-size="27" font-weight="bold">前提を確認</text><text x="45" y="190" font-size="26">原契約が特定でき、変更額が明らか</text><text x="45" y="231" font-size="23">契約年月日などを照合する</text><rect x="25" y="280" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="323" r="23" fill="#0e5c8a"/><text x="62" y="332" text-anchor="middle" fill="white" font-size="26">2</text><text x="102" y="331" font-size="27" font-weight="bold">増額の仮例</text><text x="45" y="385" font-size="26">2,000万円 → 2,100万円</text><text x="45" y="426" font-size="23">記載金額は増加額の100万円</text><rect x="25" y="475" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="518" r="23" fill="#0e5c8a"/><text x="62" y="527" text-anchor="middle" fill="white" font-size="26">3</text><text x="102" y="526" font-size="27" font-weight="bold">減額の仮例</text><text x="45" y="580" font-size="26">2,000万円 → 1,900万円</text><text x="45" y="621" font-size="23">記載金額なし ≠ 非課税</text><text x="30" y="702" font-size="17">2026年10月28日確認｜個別条件と本文の出典を照合</text></g></svg>