<svg xmlns="http://www.w3.org/2000/svg" width="600" height="760" viewBox="0 0 600 760" role="img" aria-labelledby="title desc"><title id="title">比べるのは実際に減る税額</title><desc id="desc">3000万円の特別控除。売却の譲渡所得から差し引く。住宅ローン控除。計算した控除を税額に適用。名前の上限額同士では比べない</desc><rect width="600" height="760" rx="24" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="32" y="58" font-size="30" font-weight="bold">比べるのは実際に減る税額</text><rect x="30" y="100" width="540" height="210" rx="18" fill="white" stroke="#2e9bd4" stroke-width="3"/><text x="55" y="162" font-size="30" font-weight="bold">3000万円の特別控除</text><path d="M300 184v30m-9-9 9 9 9-9" stroke="#16709f" stroke-width="4" fill="none"/><text x="55" y="260" font-size="28">売却の譲渡所得から差し引く</text><rect x="30" y="350" width="540" height="210" rx="18" fill="white" stroke="#2e9bd4" stroke-width="3"/><text x="55" y="412" font-size="30" font-weight="bold">住宅ローン控除</text><path d="M300 434v30m-9-9 9 9 9-9" stroke="#16709f" stroke-width="4" fill="none"/><text x="55" y="510" font-size="28">計算した控除を税額に適用</text><text x="32" y="650" font-size="28" font-weight="bold">名前の上限額同士では比べない</text></g></svg>