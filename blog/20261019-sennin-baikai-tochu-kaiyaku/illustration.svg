<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">途中解約の請求を3つに分ける</title><desc id="desc">専任媒介を途中で解約する際の請求を、契約違反に関する違約金、媒介の履行に要した費用、売買等の成立に伴う仲介報酬の3段に分けた整理図。各段で根拠条項と条件を確認する。</desc><rect width="800" height="720" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="54" font-size="27" font-weight="bold">途中解約の請求を3つに分ける</text><rect x="30" y="90" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="133" r="23" fill="#0e5c8a"/><text x="69" y="142" text-anchor="middle" fill="white" font-size="26">1</text><text x="109" y="140" font-size="27" font-weight="bold">違約金</text><text x="109" y="191" font-size="25">契約違反の条件を確認</text><text x="109" y="230" font-size="23">解約だけで一律には発生しない</text><rect x="30" y="285" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="328" r="23" fill="#0e5c8a"/><text x="69" y="337" text-anchor="middle" fill="white" font-size="26">2</text><text x="109" y="335" font-size="27" font-weight="bold">履行のための費用</text><text x="109" y="386" font-size="25">支出の内訳と根拠を確認</text><text x="109" y="425" font-size="23">標準約款では約定報酬額が上限</text><rect x="30" y="480" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="523" r="23" fill="#0e5c8a"/><text x="69" y="532" text-anchor="middle" fill="white" font-size="26">3</text><text x="109" y="530" font-size="27" font-weight="bold">仲介報酬</text><text x="109" y="581" font-size="25">売買等が成立したかを確認</text><text x="109" y="620" font-size="23">売買の解除とは別に照合</text><text x="40" y="704" font-size="17">2026年10月19日確認｜本文の出典と個別条件を照合</text></g></svg>