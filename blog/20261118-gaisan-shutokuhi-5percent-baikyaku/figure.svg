<svg xmlns="http://www.w3.org/2000/svg" width="400" height="749" viewBox="0 0 400 749" role="img" aria-labelledby="t d">
<title id="t">取得費の探し方の順番</title>
<desc id="d">契約書などの実額資料をまず探し、なければ指数による推計の合理性を確かめ、それでも無理な場合に概算取得費5%を使い、申告書に根拠資料を添える。</desc>
<rect width="400" height="749" rx="18" fill="#faf3ee"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#8f4a2b">取得費の探し方の順番</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#d0a184"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#8f4a2b">実額の資料を探す</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">契約書・領収書・ローンの</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">記録から取得費を探す</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#a85f3a" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#d0a184"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#8f4a2b">推計を検討する</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">市街地価格指数などで</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">取得時期の時価を推く</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#a85f3a" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#fff" stroke="#d0a184"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#8f4a2b">5%は最後の受け皿</text>
<text x="36" y="454" font-size="20" fill="#1e3f55">推計も無理な場合に</text>
<text x="36" y="482" font-size="20" fill="#1e3f55">譲渡価額の5%を使う</text>
<path d="M200 517v12m-5-5 5 5 5-5" fill="none" stroke="#a85f3a" stroke-width="2"/>
<rect x="20" y="531" width="360" height="136" rx="12" fill="#8f4a2b"/>
<text x="36" y="567" font-size="24" font-weight="bold" fill="#fff">根拠を添えて申告</text>
<text x="36" y="607" font-size="20" font-weight="bold" fill="#fff">計算過程の資料を残し</text>
<text x="36" y="635" font-size="20" font-weight="bold" fill="#fff">確定申告書に添える</text>
<text x="24" y="703" font-size="20" fill="#1e3f55">推計は「合理性」が認められるかが分かれ目</text>
<text x="24" y="731" font-size="20" fill="#4e7288">出典：国税庁の公表情報</text>
</g></svg>
