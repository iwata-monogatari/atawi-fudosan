<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">寄与分と実家売却を分けて整理</title><desc id="desc">寄与分を検討する家族が、支えた人と相続人の関係、支援の時期や費用の資料、実家の売却と代金分配の三項目を整理する図。査定額が寄与分の金額を決めるわけではないことを示す。</desc><rect width="800" height="720" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="54" font-size="27" font-weight="bold">寄与分と実家売却を分けて整理</text><rect x="30" y="90" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="133" r="23" fill="#0e5c8a"/><text x="69" y="142" text-anchor="middle" fill="white" font-size="26">1</text><text x="109" y="140" font-size="27" font-weight="bold">相続人の関係</text><text x="109" y="191" font-size="25">支えた人が相続人か確認</text><text x="109" y="230" font-size="23">特別寄与料と混同しない</text><rect x="30" y="285" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="328" r="23" fill="#0e5c8a"/><text x="69" y="337" text-anchor="middle" fill="white" font-size="26">2</text><text x="109" y="335" font-size="27" font-weight="bold">支援の内容と資料</text><text x="109" y="386" font-size="25">時期・費用・役割を記録</text><text x="109" y="425" font-size="23">認められる金額は自己判断しない</text><rect x="30" y="480" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="523" r="23" fill="#0e5c8a"/><text x="69" y="532" text-anchor="middle" fill="white" font-size="26">3</text><text x="109" y="530" font-size="27" font-weight="bold">売却と分配</text><text x="109" y="581" font-size="25">査定・売却費用・分配を別々に</text><text x="109" y="620" font-size="23">合意や個別判断は弁護士へ</text><text x="40" y="704" font-size="17">2026年10月22日確認｜本文の出典と個別条件を照合</text></g></svg>