<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 560" role="img" aria-labelledby="title desc"><title id="title">連絡する前に、三つをそろえる</title><desc id="desc">専任媒介の報告が届かないときの三つの確認。契約書にある報告方法、報告の頻度と対象期間、最後に受信した日を整理し、送信先や迷惑メールも確認して仲介会社へ照会する。</desc><rect width="320" height="560" fill="white"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="16" y="32" font-size="20" font-weight="bold">連絡する前に、三つをそろえる</text><rect x="12" y="100" width="296" height="112" rx="12" fill="#e9f5fc"/><text x="26" y="129" font-size="19" font-weight="bold">1 方法</text><text x="26" y="159" font-size="16">メール・書面など契約欄を確認</text><rect x="12" y="230" width="296" height="112" rx="12" fill="#e9f5fc"/><text x="26" y="259" font-size="19" font-weight="bold">2 頻度</text><text x="26" y="289" font-size="16">約束の間隔と対象期間を確認</text><rect x="12" y="360" width="296" height="112" rx="12" fill="#e9f5fc"/><text x="26" y="389" font-size="19" font-weight="bold">3 最終受信日</text><text x="26" y="419" font-size="16">送信先・迷惑メールも照合</text><text x="16" y="515" font-size="16">出典：本文末の一次情報</text><text x="16" y="541" font-size="16">2026年11月7日確認／大石浩之</text></g></svg>