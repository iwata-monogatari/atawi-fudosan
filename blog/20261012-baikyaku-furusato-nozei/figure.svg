<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">寄附額を決める前の確認順序</title><desc id="desc">寄附額を決める前の確認順序。売却資料、売値・取得費・譲渡費用、口座への入金額だけで計算しない。所得と控除、特別控除・他の所得、限度額は税理士等へ確認。寄附と申告、入金日・証明書・全寄附、確定申告なら申請済み分も含める。筆者の確認手順を示した説明図。</desc><rect width="960" height="600" rx="22" fill="#e9f5fc"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#1e3f55"><text x="40" y="62" font-size="31" font-weight="700">寄附額を決める前の確認順序</text><rect x="32" y="92" width="896" height="130" rx="12" fill="white" stroke="#cde2f0"/><g transform="translate(42,104)" fill="none" stroke="#2e9bd4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="17" y="12" width="66" height="82" rx="5"/><path d="M29 31h40 M29 48h40 M29 65h25 M29 82h25"/></g><text x="160" y="128" font-size="25" font-weight="700">1　売却資料</text><text x="160" y="165" font-size="26">売値・取得費・譲渡費用</text><text x="160" y="200" font-size="22" fill="#5b7488">口座への入金額だけで計算しない</text><rect x="32" y="242" width="896" height="130" rx="12" fill="white" stroke="#cde2f0"/><g transform="translate(42,254)" fill="none" stroke="#2e9bd4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="15" y="12" width="66" height="82" rx="6"/><path d="M28 28h40v18H28Z M28 61h12 M56 61h12 M28 78h12 M56 78h12"/></g><text x="160" y="278" font-size="25" font-weight="700">2　所得と控除</text><text x="160" y="315" font-size="26">特別控除・他の所得</text><text x="160" y="350" font-size="22" fill="#5b7488">限度額は税理士等へ確認</text><rect x="32" y="392" width="896" height="130" rx="12" fill="white" stroke="#cde2f0"/><g transform="translate(42,404)" fill="none" stroke="#2e9bd4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 26h66v62H16Z M16 26l33 27 33-27 M30 72h35"/></g><text x="160" y="428" font-size="25" font-weight="700">3　寄附と申告</text><text x="160" y="465" font-size="26">入金日・証明書・全寄附</text><text x="160" y="500" font-size="22" fill="#5b7488">確定申告なら申請済み分も含める</text><text x="40" y="573" font-size="18" fill="#5b7488">大石浩之｜確認事項を整理するための筆者作成図</text></g></svg>