<svg xmlns="http://www.w3.org/2000/svg" width="400" height="749" viewBox="0 0 400 749" role="img" aria-labelledby="t d">
<title id="t">袋地売却の確認点</title>
<desc id="d">袋地になった経緯を見て、通行権の範囲と償金の有無を確かめ、接道の可否を切り分け、隣地交渉と価格の順で進める。</desc>
<rect width="400" height="749" rx="18" fill="#faf0f5"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#8f2b5c">袋地売却の確認点</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#d08bb0"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#8f2b5c">経緯を確認する</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">分割で生じた袋地か</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">もともとの袋地かで条件が違う</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#a83d74" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#d08bb0"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#8f2b5c">通行権を読む</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">通行の場所・方法・幅と</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">償金の有無を確かめる</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#a83d74" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#fff" stroke="#d08bb0"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#8f2b5c">接道を切り分ける</text>
<text x="36" y="454" font-size="20" fill="#1e3f55">通行権と建築基準法の</text>
<text x="36" y="482" font-size="20" fill="#1e3f55">接道義務は別の問題</text>
<path d="M200 517v12m-5-5 5 5 5-5" fill="none" stroke="#a83d74" stroke-width="2"/>
<rect x="20" y="531" width="360" height="136" rx="12" fill="#8f2b5c"/>
<text x="36" y="567" font-size="24" font-weight="bold" fill="#fff">売り方を決める</text>
<text x="36" y="607" font-size="20" font-weight="bold" fill="#fff">隣地への売却や通路の</text>
<text x="36" y="635" font-size="20" font-weight="bold" fill="#fff">買取り交渉が現実的な手</text>
<text x="24" y="703" font-size="20" fill="#1e3f55">袋地は「通れる」と「建てられる」を分けて読む</text>
<text x="24" y="731" font-size="20" fill="#4e7288">出典：民法・建築基準法11月確認</text>
</g></svg>
