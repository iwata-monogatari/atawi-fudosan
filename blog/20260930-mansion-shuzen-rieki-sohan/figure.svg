<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">管理組合・管理者・発注先の関係と事前説明を示す図</title><desc id="d">修繕費は総額だけ見ても判断できない。誰に発注し、自分にいくら残るかまで見る。</desc><rect width="800" height="520" fill="#fff"/><style>text{font-family:Yu Gothic,Meiryo,sans-serif;font-size:23px;fill:#1e3f55}.title{font-size:28px;font-weight:bold}.head{font-size:25px;font-weight:bold}.small{font-size:19px}text[fill="white"]{fill:white}</style><text x="40" y="54" class="title">修繕費は、発注の関係と説明を確認</text><rect x="235" y="87" width="330" height="80" rx="14" fill="#0e5c8a"/><text x="400" y="119" text-anchor="middle" fill="white" class="head">管理組合が管理の主体</text><text x="400" y="150" text-anchor="middle" fill="white" class="small">区分所有者で構成</text><path d="M400 167V205" stroke="#2e9bd4" stroke-width="4"/><rect x="40" y="215" width="330" height="133" rx="14" fill="#e9f5fc"/><rect x="430" y="215" width="330" height="133" rx="14" fill="#e9f5fc"/><text x="65" y="260" class="head">管理業者＝管理者</text><text x="65" y="303" class="small">管理業者管理者方式の場合</text><text x="455" y="260" class="head">修繕の発注先</text><text x="455" y="303" class="small">自己取引・グループ会社等？</text><path d="M374 279H426" stroke="#2e9bd4" stroke-width="4"/><text x="400" y="392" text-anchor="middle" class="head">関係を確かめ、事前説明の資料を読む</text><text x="400" y="435" text-anchor="middle">工事総額 → 各戸の負担額 → 支払時期</text><text x="400" y="481" text-anchor="middle" class="small">管理会社への委託があるだけで、一律に対象とは判断しません。</text></svg>