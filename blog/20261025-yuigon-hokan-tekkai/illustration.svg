<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">遺言書の返還前に確認する三つ</title><desc id="desc">法務局に預けた自筆証書遺言の返還準備を示す図。保管申請の撤回は遺言者本人が行い、原本を保管する法務局を予約し、撤回書と顔写真付き身分証明書、氏名や住所等の変更を証する資料を確認する。</desc><rect width="800" height="720" rx="16" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="30" y="52" font-size="26" font-weight="bold">遺言書の返還前に確認する三つ</text><rect x="25" y="85" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="128" r="23" fill="#0e5c8a"/><text x="62" y="137" text-anchor="middle" fill="white" font-size="26">1</text><text x="102" y="136" font-size="27" font-weight="bold">本人</text><text x="45" y="190" font-size="26">保管申請の撤回は遺言者本人</text><text x="45" y="231" font-size="23">家族の代理受領とは分ける</text><rect x="25" y="280" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="323" r="23" fill="#0e5c8a"/><text x="62" y="332" text-anchor="middle" fill="white" font-size="26">2</text><text x="102" y="331" font-size="27" font-weight="bold">保管先</text><text x="45" y="385" font-size="26">原本を保管している法務局</text><text x="45" y="426" font-size="23">行きやすい窓口とは限らない</text><rect x="25" y="475" width="750" height="175" rx="15" fill="white" stroke="#a8d6ee" stroke-width="2"/><circle cx="62" cy="518" r="23" fill="#0e5c8a"/><text x="62" y="527" text-anchor="middle" fill="white" font-size="26">3</text><text x="102" y="526" font-size="27" font-weight="bold">書類</text><text x="45" y="580" font-size="26">撤回書・顔写真付き身分証明書</text><text x="45" y="621" font-size="23">氏名・住所等の変更資料も確認</text><text x="30" y="702" font-size="17">2026年10月25日確認｜個別条件と本文の出典を照合</text></g></svg>