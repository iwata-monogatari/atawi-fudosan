<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img" aria-labelledby="title desc"><title id="title">2026年と2028年を分けて確認</title><desc id="desc">2026年の建物売却→2028年の判定の時間軸。納税額の自動確定ではないと明示</desc><rect width="640" height="800" rx="20" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="32" y="62" font-size="29" font-weight="bold">2026年と2028年を分けて確認</text><rect x="28" y="100" width="584" height="168" rx="15" fill="white" stroke="#9ccfe7" stroke-width="2"/><circle cx="65" cy="147" r="23" fill="#0e5c8a"/><text x="65" y="157" text-anchor="middle" font-size="28" fill="white">1</text><text x="103" y="156" font-size="28" font-weight="bold">2026年：貸家の売却</text><text x="48" y="219" font-size="27">土地と建物、他の売上げを分ける</text><path d="M320 278v22m-10-10 10 10 10-10" fill="none" stroke="#16709f" stroke-width="4"/><rect x="28" y="310" width="584" height="168" rx="15" fill="white" stroke="#9ccfe7" stroke-width="2"/><circle cx="65" cy="357" r="23" fill="#0e5c8a"/><text x="65" y="367" text-anchor="middle" font-size="28" fill="white">2</text><text x="103" y="366" font-size="28" font-weight="bold">2028年：納税義務の判定</text><text x="48" y="429" font-size="27">個人の基準期間は前々年</text><path d="M320 488v22m-10-10 10 10 10-10" fill="none" stroke="#16709f" stroke-width="4"/><rect x="28" y="520" width="584" height="168" rx="15" fill="white" stroke="#9ccfe7" stroke-width="2"/><circle cx="65" cy="567" r="23" fill="#0e5c8a"/><text x="65" y="577" text-anchor="middle" font-size="28" fill="white">3</text><text x="103" y="576" font-size="28" font-weight="bold">2028年：税額の確認</text><text x="48" y="639" font-size="27">実際の取引と登録等を別途確認</text><text x="32" y="765" font-size="25">判定と納付税額は同じではありません</text></g></svg>