<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">磐田市の印鑑登録証明書：取得の順番</title><desc id="desc">磐田市の印鑑登録証明書のコンビニ交付は2026年11月1日まで300円、11月2日から200円で、本人の利用条件と提出先の部数・発行時期を先に確認する図</desc><rect width="960" height="430" rx="16" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="56" font-size="27" font-weight="bold">磐田市の印鑑登録証明書：取得の順番</text><rect x="40" y="100" width="440" height="105" rx="12" fill="#e9f5fc" stroke="#2E9BD4"/><text x="60" y="140" font-size="18" fill="#16709f">01</text><text x="60" y="168" font-size="19"><tspan x="60" dy="0">2026年11月1日まで：300円</tspan></text><rect x="500" y="100" width="440" height="105" rx="12" fill="#e9f5fc" stroke="#2E9BD4"/><text x="520" y="140" font-size="18" fill="#16709f">02</text><text x="520" y="168" font-size="19"><tspan x="520" dy="0">2026年11月2日から：200円</tspan></text><rect x="40" y="230" width="440" height="105" rx="12" fill="#ffffff" stroke="#2E9BD4"/><text x="60" y="270" font-size="18" fill="#16709f">03</text><text x="60" y="298" font-size="19"><tspan x="60" dy="0">本人のカードで取得</tspan></text><rect x="500" y="230" width="440" height="105" rx="12" fill="#ffffff" stroke="#2E9BD4"/><text x="520" y="270" font-size="18" fill="#16709f">04</text><text x="520" y="298" font-size="19"><tspan x="520" dy="0">提出先へ部数・発行時期を確認</tspan></text><text x="40" y="390" font-size="20">コンビニ交付の料金。2026年9月28日は変更開始前</text></g></svg>