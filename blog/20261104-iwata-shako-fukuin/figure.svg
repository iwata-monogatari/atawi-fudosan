<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img"><title>買主とそろえる図面と写真</title><rect width="640" height="440" rx="24" fill="#f2f6f8"/><g font-family="Meiryo,sans-serif"><text x="32" y="51" font-size="29" font-weight="bold" fill="#193f55">買主とそろえる図面と写真</text><rect x="24" y="75" width="592" height="103" rx="14" fill="white"/><circle cx="62" cy="125" r="24" fill="#164569"/><text x="62" y="134" text-anchor="middle" font-size="24" fill="white">1</text><text x="106" y="116" font-size="26" font-weight="bold" fill="#164569">現地の写真</text><text x="106" y="153" font-size="23" fill="#233d49">門から道路へ　／　出入口を図に記す</text><rect x="24" y="191" width="592" height="103" rx="14" fill="white"/><circle cx="62" cy="241" r="24" fill="#1a637e"/><text x="62" y="250" text-anchor="middle" font-size="24" fill="white">2</text><text x="106" y="232" font-size="26" font-weight="bold" fill="#1a637e">車庫の平面図</text><text x="106" y="269" font-size="23" fill="#233d49">図から写真へ　／　撮影方向を合わせる</text><rect x="24" y="307" width="592" height="103" rx="14" fill="white"/><circle cx="62" cy="357" r="24" fill="#23695f"/><text x="62" y="366" text-anchor="middle" font-size="24" fill="white">3</text><text x="106" y="348" font-size="26" font-weight="bold" fill="#23695f">買主の車検証</text><text x="106" y="385" font-size="23" fill="#233d49">計画から窓口へ　／　正副に資料をそろえる</text></g></svg>