<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 560" role="img" aria-labelledby="title desc"><title id="title">実家の書類は、三つに分ける</title><desc id="desc">相続した実家の書類を三つに分けた図。市への届出は税通知の受け取りと現所有者の申告、遺産分割は誰が実家を取得するかの整理、相続登記は法務局での名義変更の手続きで、同じ手続きではない。</desc><rect width="320" height="560" fill="white"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="16" y="32" font-size="20" font-weight="bold">実家の書類は、三つに分ける</text><rect x="12" y="100" width="296" height="112" rx="12" fill="#e9f5fc"/><text x="26" y="129" font-size="19" font-weight="bold">1 市への届出</text><text x="26" y="159" font-size="16">税通知の受け取りと現所有者の申告</text><rect x="12" y="230" width="296" height="112" rx="12" fill="#e9f5fc"/><text x="26" y="259" font-size="19" font-weight="bold">2 遺産分割</text><text x="26" y="289" font-size="16">誰が実家を取得するかを整理</text><rect x="12" y="360" width="296" height="112" rx="12" fill="#e9f5fc"/><text x="26" y="389" font-size="19" font-weight="bold">3 相続登記</text><text x="26" y="419" font-size="16">法務局で名義変更の手続き</text><text x="16" y="515" font-size="16">出典：本文末の一次情報</text><text x="16" y="541" font-size="16">2026年11月7日確認／大石浩之</text></g></svg>