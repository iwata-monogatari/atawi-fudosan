<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">広告費の別払いは、請求名目で決めない</title><desc id="desc">別途の広告費を払う前に、売主の特別依頼の記録、媒体と期間ごとの実費、事前合意の上限や追加条件との一致を順に照合する図</desc><rect width="1000" height="360" rx="20" fill="#e9f5fc"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#1e3f55"><text x="42" y="53" font-size="29" font-weight="700">広告費の別払いは、請求名目で決めない</text><rect x="35" y="90" width="280" height="177" rx="14" fill="white" stroke="#cde2f0"/><circle cx="70" cy="127" r="21" fill="#0e5c8a"/><text x="70" y="135" text-anchor="middle" fill="white" font-size="24">1</text><text x="55" y="187" font-size="26" font-weight="700">特別に依頼したか</text><text x="55" y="228" font-size="21">メール・依頼書を確認</text><path d="M324 178h23m-9-9 9 9-9 9" fill="none" stroke="#16709f" stroke-width="4"/><rect x="360" y="90" width="280" height="177" rx="14" fill="white" stroke="#cde2f0"/><circle cx="395" cy="127" r="21" fill="#0e5c8a"/><text x="395" y="135" text-anchor="middle" fill="white" font-size="24">2</text><text x="380" y="187" font-size="26" font-weight="700">実費はいくらか</text><text x="380" y="228" font-size="21">媒体・期間・内訳</text><path d="M649 178h23m-9-9 9 9-9 9" fill="none" stroke="#16709f" stroke-width="4"/><rect x="685" y="90" width="280" height="177" rx="14" fill="white" stroke="#cde2f0"/><circle cx="720" cy="127" r="21" fill="#0e5c8a"/><text x="720" y="135" text-anchor="middle" fill="white" font-size="24">3</text><text x="705" y="187" font-size="26" font-weight="700">合意と一致するか</text><text x="705" y="228" font-size="21">上限・追加・支払時期</text><text x="40" y="320" font-size="21">通常広告は仲介業者の負担。特別依頼の広告は実費を確認します。</text></g></svg>