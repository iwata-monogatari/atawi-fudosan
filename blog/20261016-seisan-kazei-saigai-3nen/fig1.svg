<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">被災後の資料は、3つの束に分ける</title><desc id="desc">相続時精算課税の適用資料、被害写真と修繕資料、保険金や損害賠償金の記録を三つに分けて税理士へ渡す図。災害発生日から原則3年の承認申請を別に確認する。</desc><rect width="1000" height="560" rx="22" fill="#e9f5fc"/><g font-family="Yu Gothic,Meiryo,sans-serif"><text x="50" y="70" font-size="20" fill="#16709f">大石浩之の不動産実務メモ</text><text x="50" y="132" font-size="32" font-weight="bold" fill="#0e5c8a">被災後の資料は、3つの束に分ける</text><rect x="40" y="205" width="280" height="175" rx="18" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="180" cy="238" r="23" fill="#0e5c8a"/><text x="180" y="246" text-anchor="middle" font-size="25" fill="white">1</text><text x="180" y="302" text-anchor="middle" font-size="26" fill="#1e3f55">贈与・税の書類</text><path d="M330 280h20m-8-8 8 8-8 8" fill="none" stroke="#2e9bd4" stroke-width="4"/><rect x="360" y="205" width="280" height="175" rx="18" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="500" cy="238" r="23" fill="#0e5c8a"/><text x="500" y="246" text-anchor="middle" font-size="25" fill="white">2</text><text x="500" y="302" text-anchor="middle" font-size="26" fill="#1e3f55">被害・修繕記録</text><path d="M650 280h20m-8-8 8 8-8 8" fill="none" stroke="#2e9bd4" stroke-width="4"/><rect x="680" y="205" width="280" height="175" rx="18" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="820" cy="238" r="23" fill="#0e5c8a"/><text x="820" y="246" text-anchor="middle" font-size="25" fill="white">3</text><text x="820" y="302" text-anchor="middle" font-size="26" fill="#1e3f55">保険金等の記録</text><rect x="45" y="430" width="910" height="70" rx="14" fill="#0e5c8a"/><text x="500" y="475" text-anchor="middle" font-size="28" fill="white">災害発生日から原則3年の承認申請を確認</text><text x="950" y="535" text-anchor="end" font-size="16" fill="#4e7288">2026年10月16日確認｜個別判断は専門家へ</text></g></svg>