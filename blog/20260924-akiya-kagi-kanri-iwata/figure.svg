<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><rect width="1000" height="560" rx="20" fill="#f2f9fe"/><g font-family="sans-serif" fill="#1e3f55"><text x="50" y="65" font-size="32" font-weight="bold">鍵は「渡す・使う・戻す」まで記録する</text><rect x="40" y="125" width="280" height="250" rx="16" fill="white" stroke="#2E9BD4" stroke-width="3"/><circle cx="85" cy="174" r="24" fill="#0e5c8a"/><text x="77" y="184" font-size="28" fill="white">1</text><text x="62" y="235" font-size="25" font-weight="bold">渡す前</text><text x="62" y="286" font-size="22">家族の窓口を決定</text><text x="62" y="327" font-size="22">鍵ごとに本数を照合</text><path d="M330 240 l22 12 -22 12" fill="none" stroke="#0e5c8a" stroke-width="5"/><rect x="360" y="125" width="280" height="250" rx="16" fill="white" stroke="#2E9BD4" stroke-width="3"/><circle cx="405" cy="174" r="24" fill="#0e5c8a"/><text x="397" y="184" font-size="28" fill="white">2</text><text x="382" y="235" font-size="25" font-weight="bold">使うとき</text><text x="382" y="286" font-size="22">入室目的と担当者</text><text x="382" y="327" font-size="22">終了後の施錠を報告</text><path d="M650 240 l22 12 -22 12" fill="none" stroke="#0e5c8a" stroke-width="5"/><rect x="680" y="125" width="280" height="250" rx="16" fill="white" stroke="#2E9BD4" stroke-width="3"/><circle cx="725" cy="174" r="24" fill="#0e5c8a"/><text x="717" y="184" font-size="28" fill="white">3</text><text x="702" y="235" font-size="25" font-weight="bold">戻すとき</text><text x="702" y="286" font-size="22">現物と台帳を照合</text><text x="702" y="327" font-size="22">合鍵・番号も見直す</text><rect x="40" y="421" width="920" height="86" rx="12" fill="#e9f5fc"/><text x="65" y="473" font-size="26">預けた本数 − 返った本数 ＝ 未返却として追う本数</text></g></svg>