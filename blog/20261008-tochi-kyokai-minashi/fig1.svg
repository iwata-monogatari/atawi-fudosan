<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">「20日」の前に、通知と筆界案</title><desc id="desc">地籍調査のみなし確認の流れを示す図。複数回の通知にも反応がない場合に筆界案を送付し、20日以上意見がなければ確認したものとして調査を進められる。売買の境界確認とは別の手続である。</desc><rect width="1200" height="640" rx="24" fill="#e9f5fc"/><g font-family="Yu Gothic,Meiryo,sans-serif"><text x="60" y="82" font-size="38" font-weight="bold" fill="#0e5c8a">「20日」の前に、通知と筆界案</text><rect x="50" y="130" width="330" height="350" rx="18" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="93" cy="172" r="24" fill="#0e5c8a"/><text x="93" y="181" text-anchor="middle" font-size="24" fill="white">1</text><g transform="translate(215,255)" fill="none" stroke="#16709f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="-39" y="-27" width="78" height="56" rx="5"/><path d="M-38-23L0 5 38-23"/></g><text x="215" y="360" text-anchor="middle" font-size="29" font-weight="bold" fill="#0e5c8a">複数回の通知</text><text x="215" y="416" text-anchor="middle" font-size="23" fill="#1e3f55">反応なし</text><path d="M392 300h27m-10-10 10 10-10 10" fill="none" stroke="#2e9bd4" stroke-width="4"/><rect x="435" y="130" width="330" height="350" rx="18" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="478" cy="172" r="24" fill="#0e5c8a"/><text x="478" y="181" text-anchor="middle" font-size="24" fill="white">2</text><g transform="translate(600,255)" fill="none" stroke="#16709f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M-40-31l26 7 27-10 27 8v61l-27-8-27 11-26-8zM-14-24v62M13-34v61"/></g><text x="600" y="360" text-anchor="middle" font-size="29" font-weight="bold" fill="#0e5c8a">筆界案の送付</text><text x="600" y="416" text-anchor="middle" font-size="23" fill="#1e3f55">20日以上</text><path d="M777 300h27m-10-10 10 10-10 10" fill="none" stroke="#2e9bd4" stroke-width="4"/><rect x="820" y="130" width="330" height="350" rx="18" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="863" cy="172" r="24" fill="#0e5c8a"/><text x="863" y="181" text-anchor="middle" font-size="24" fill="white">3</text><g transform="translate(985,255)" fill="none" stroke="#16709f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle r="38"/><path d="M0-26v29l20 10"/></g><text x="985" y="360" text-anchor="middle" font-size="29" font-weight="bold" fill="#0e5c8a">意見なし</text><text x="985" y="416" text-anchor="middle" font-size="23" fill="#1e3f55">みなし確認で調査</text><text x="600" y="553" text-anchor="middle" font-size="28" fill="#0e5c8a">地籍調査の手続。売買契約の境界確認とは区別</text><text x="600" y="602" text-anchor="middle" font-size="18" fill="#5b7488">ATAWI FUDOSAN｜2026年10月8日確認・説明用の模式図</text></g></svg>