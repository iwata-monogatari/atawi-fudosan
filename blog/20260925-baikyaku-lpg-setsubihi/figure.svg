<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img"><title>売却前に分ける、ガス設備の確認3点</title><rect width="960" height="400" rx="20" fill="#f2f9fe"/><g font-family="Yu Gothic, Meiryo, sans-serif" text-anchor="middle"><text x="480" y="54" font-size="30" font-weight="bold" fill="#0e5c8a">売却前に分ける、ガス設備の確認3点</text><rect x="30" y="100" width="270" height="228" rx="14" fill="white" stroke="#2E9BD4" stroke-width="3"/><circle cx="165" cy="139" r="23" fill="#0e5c8a"/><text x="165" y="148" font-size="25" fill="white">1</text><text x="165" y="199" font-size="28" fill="#1e3f55">所有者</text><text x="165" y="242" font-size="22" fill="#1e3f55">給湯器・配管ごと</text><text x="165" y="285" font-size="22" fill="#1e3f55">購入か貸与か</text><path d="M311 211 h20 m-9 -8 9 8 -9 8" fill="none" stroke="#16709f" stroke-width="4"/><rect x="345" y="100" width="270" height="228" rx="14" fill="white" stroke="#2E9BD4" stroke-width="3"/><circle cx="480" cy="139" r="23" fill="#0e5c8a"/><text x="480" y="148" font-size="25" fill="white">2</text><text x="480" y="199" font-size="28" fill="#1e3f55">契約</text><text x="480" y="242" font-size="22" fill="#1e3f55">期間と終了条件</text><text x="480" y="285" font-size="22" fill="#1e3f55">書面と現物を照合</text><path d="M626 211 h20 m-9 -8 9 8 -9 8" fill="none" stroke="#16709f" stroke-width="4"/><rect x="660" y="100" width="270" height="228" rx="14" fill="white" stroke="#2E9BD4" stroke-width="3"/><circle cx="795" cy="139" r="23" fill="#0e5c8a"/><text x="795" y="148" font-size="25" fill="white">3</text><text x="795" y="199" font-size="28" fill="#1e3f55">精算</text><text x="795" y="242" font-size="22" fill="#1e3f55">金額の根拠と期限</text><text x="795" y="285" font-size="22" fill="#1e3f55">手取り計算へ反映</text><text x="480" y="371" font-size="20" fill="#5b7488">月額の設備料金だけで、所有者や解約精算は決められません。</text></g></svg>