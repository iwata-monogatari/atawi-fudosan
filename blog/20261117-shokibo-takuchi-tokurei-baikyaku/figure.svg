<svg xmlns="http://www.w3.org/2000/svg" width="400" height="749" viewBox="0 0 400 749" role="img" aria-labelledby="t d">
<title id="t">小規模宅地特例の確認点</title>
<desc id="d">土地が特定居住用に当たるかを見て、取得する相続人の区分ごとの要件を確かめ、申告期限までに分割と申告を済ませ、売却の順番を決める。</desc>
<rect width="400" height="749" rx="18" fill="#faf0f5"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#8f2b5c">小規模宅地特例の確認点</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#d08bb0"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#8f2b5c">土地の区分を見る</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">被相続人の自宅の土地は</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">330㎡まで80%減額の対象</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#a83d74" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#d08bb0"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#8f2b5c">取得者の要件を見る</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">同居か、持ち家のない</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">別居の親族かで変わる</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#a83d74" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#fff" stroke="#d08bb0"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#8f2b5c">申告期限を見る</text>
<text x="36" y="454" font-size="20" fill="#1e3f55">相続開始から10か月以内に</text>
<text x="36" y="482" font-size="20" fill="#1e3f55">分割と申告を済ませる</text>
<path d="M200 517v12m-5-5 5 5 5-5" fill="none" stroke="#a83d74" stroke-width="2"/>
<rect x="20" y="531" width="360" height="136" rx="12" fill="#8f2b5c"/>
<text x="36" y="567" font-size="24" font-weight="bold" fill="#fff">売る順番を決める</text>
<text x="36" y="607" font-size="20" font-weight="bold" fill="#fff">申告前の売却は要件を</text>
<text x="36" y="635" font-size="20" font-weight="bold" fill="#fff">崩す場合がある</text>
<text x="24" y="703" font-size="20" fill="#1e3f55">特例の適用には相続税の申告が必要</text>
<text x="24" y="731" font-size="20" fill="#4e7288">出典：国税庁11月確認</text>
</g></svg>
