<svg xmlns="http://www.w3.org/2000/svg" width="400" height="598" viewBox="0 0 400 598" role="img" aria-labelledby="t d">
<title id="t">調査が関わる3場面</title>
<desc id="d">媒介契約のときはあっせん事項を書面に記載して交付、重要事項説明のときは実施の有無と結果の概要を買主へ説明、売買契約のときは双方が確認した事項を書面に記載して交付する。</desc>
<rect width="400" height="598" rx="18" fill="#f2f9fe"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#0e5c8a">調査が関わる3場面</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#2e9bd4"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#0e5c8a">媒介契約のとき</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">あっせん事項を書面に</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">記載して交付する</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#16709f" stroke-width="2"/>
<rect x="20" y="226" width="360" height="136" rx="12" fill="#fff" stroke="#2e9bd4"/>
<text x="36" y="262" font-size="24" font-weight="bold" fill="#0e5c8a">重要事項説明</text>
<text x="36" y="302" font-size="20" fill="#1e3f55">実施の有無と結果の</text>
<text x="36" y="330" font-size="20" fill="#1e3f55">概要を買主へ説明する</text>
<path d="M200 365v12m-5-5 5 5 5-5" fill="none" stroke="#16709f" stroke-width="2"/>
<rect x="20" y="380" width="360" height="136" rx="12" fill="#fff" stroke="#2e9bd4"/>
<text x="36" y="416" font-size="24" font-weight="bold" fill="#0e5c8a">売買契約のとき</text>
<text x="36" y="456" font-size="20" fill="#1e3f55">双方が確認した事項を</text>
<text x="36" y="484" font-size="20" fill="#1e3f55">書面に記載して交付</text>
<text x="24" y="552" font-size="20" fill="#1e3f55">調査の実施自体は任意</text>
<text x="24" y="580" font-size="20" fill="#4e7288">出典：国土交通省・11月12日確認</text>
</g></svg>
