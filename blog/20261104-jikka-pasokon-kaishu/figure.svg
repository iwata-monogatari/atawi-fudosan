<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img"><title>パソコンの状態から出し先を選ぶ</title><rect width="720" height="480" fill="#eff6fa"/><g font-family="Meiryo,sans-serif"><text x="28" y="50" font-weight="bold" font-size="30" fill="#113c57">パソコンの状態から出し先を選ぶ</text><rect x="20" y="76" width="680" height="115" rx="14" fill="white"/><circle cx="62" cy="117" r="23" fill="#126383"/><text x="62" y="125" fill="white" text-anchor="middle" font-size="24">1</text><text x="104" y="124" fill="#103c59" font-weight="bold" font-size="28">データが残っている</text><text x="38" y="167" fill="#244757" font-size="22">保管して本人と確認。回収には渡さない</text><rect x="20" y="206" width="680" height="115" rx="14" fill="white"/><circle cx="62" cy="247" r="23" fill="#126383"/><text x="62" y="255" fill="white" text-anchor="middle" font-size="24">2</text><text x="104" y="254" fill="#103c59" font-weight="bold" font-size="28">市へ持ち込む</text><text x="38" y="297" fill="#244757" font-size="22">寸法と対象機種で支所等か常設拠点を選ぶ</text><rect x="20" y="336" width="680" height="115" rx="14" fill="white"/><circle cx="62" cy="377" r="23" fill="#126383"/><text x="62" y="385" fill="white" text-anchor="middle" font-size="24">3</text><text x="104" y="384" fill="#103c59" font-weight="bold" font-size="28">メーカーに依頼</text><text x="38" y="427" fill="#244757" font-size="22">マークと型番を確認し、受付窓口へ</text></g></svg>