<svg xmlns="http://www.w3.org/2000/svg" width="800" height="516" viewBox="0 0 800 516" role="img" aria-labelledby="title desc"><title id="title">土日決済を決める前の3つの確認</title><desc id="desc">不動産の土日決済で、買主の融資と売主の完済、売主口座への着金、登記申請の受付日を順に確認し、送金受付と着金、オンライン送信と登記受付を区別する図</desc><rect width="800" height="516" rx="24" fill="#e9f5fc"/><g font-family="Yu Gothic,Meiryo,sans-serif"><text x="40" y="60" font-size="30" font-weight="bold" fill="#0e5c8a">土日決済を決める前の3つの確認</text><rect x="35" y="90" width="730" height="102" rx="14" fill="white" stroke="#cde2f0"/><circle cx="80" cy="138" r="25" fill="#16709f"/><text x="80" y="148" text-anchor="middle" font-size="29" fill="white">1</text><text x="125" y="130" font-size="28" font-weight="bold" fill="#0e5c8a">融資・完済は動くか</text><text x="125" y="167" font-size="22" fill="#1e3f55">買主の融資先／売主の借入先へ確認</text><rect x="35" y="212" width="730" height="102" rx="14" fill="white" stroke="#cde2f0"/><circle cx="80" cy="260" r="25" fill="#16709f"/><text x="80" y="270" text-anchor="middle" font-size="29" fill="white">2</text><text x="125" y="252" font-size="28" font-weight="bold" fill="#0e5c8a">売主口座への着金を確認できるか</text><text x="125" y="289" font-size="22" fill="#1e3f55">受付・予約・保留と、入金は別</text><rect x="35" y="334" width="730" height="102" rx="14" fill="white" stroke="#cde2f0"/><circle cx="80" cy="382" r="25" fill="#16709f"/><text x="80" y="392" text-anchor="middle" font-size="29" fill="white">3</text><text x="125" y="374" font-size="28" font-weight="bold" fill="#0e5c8a">登記はいつ受け付けられるか</text><text x="125" y="411" font-size="22" fill="#1e3f55">休日の送信と翌業務日の受付を区別</text></g></svg>