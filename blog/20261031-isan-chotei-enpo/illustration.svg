<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">遺産分割調停に出席できないときの確認順序</title><desc id="desc">担当裁判所への相談、条項案の確認、条件に合う場合の受諾書面提出の三段階。受諾書面は欠席届ではない。他の相続人の期日での合意などの条件がある。</desc><rect width="960" height="600" rx="24" fill="#f2f9fe"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#1e3f55"><text x="480" y="60" text-anchor="middle" font-size="32" font-weight="bold">調停に行けないとき、先に確かめること</text><rect x="35" y="100" width="280" height="275" rx="18" fill="white" stroke="#cde2f0"/><rect x="340" y="100" width="280" height="275" rx="18" fill="white" stroke="#cde2f0"/><rect x="645" y="100" width="280" height="275" rx="18" fill="white" stroke="#cde2f0"/><g fill="#16709f" font-weight="bold" font-size="42" text-anchor="middle"><text x="175" y="160">1</text><text x="480" y="160">2</text><text x="785" y="160">3</text></g><g text-anchor="middle" font-size="26" font-weight="bold"><text x="175" y="212">担当裁判所へ相談</text><text x="480" y="212">条項案を確認</text><text x="785" y="212">条件に合う方法で</text></g><g text-anchor="middle" font-size="22"><text x="175" y="265">期日・事件番号・事情</text><text x="175" y="308">今回の対応方法を聞く</text><text x="480" y="265">合意する内容を理解</text><text x="480" y="308">疑問は先に専門家へ</text><text x="785" y="265">受諾書面を提出</text><text x="785" y="308">様式・提出方法・期限</text></g><path d="M317 245H337M330 238L337 245L330 252M622 245H642M635 238L642 245L635 252" fill="none" stroke="#16709f" stroke-width="3"/><text x="480" y="433" text-anchor="middle" font-size="30" font-weight="bold">受諾書面は、欠席届ではありません</text><text x="480" y="485" text-anchor="middle" font-size="23">他の相続人の期日での合意など、成立には条件があります</text><text x="480" y="542" text-anchor="middle" font-size="20">利用できるかは担当裁判所へ。合意の法的な判断は弁護士へ。</text></g></svg>