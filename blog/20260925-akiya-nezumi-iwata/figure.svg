<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img"><title>ネズミの痕跡から、売却の説明まで</title><rect width="960" height="400" rx="20" fill="#f2f9fe"/><g font-family="Yu Gothic, Meiryo, sans-serif" text-anchor="middle"><text x="480" y="54" font-size="30" font-weight="bold" fill="#0e5c8a">ネズミの痕跡から、売却の説明まで</text><rect x="30" y="100" width="270" height="228" rx="14" fill="white" stroke="#2E9BD4" stroke-width="3"/><circle cx="165" cy="139" r="23" fill="#0e5c8a"/><text x="165" y="148" font-size="25" fill="white">1</text><text x="165" y="199" font-size="28" fill="#1e3f55">記録</text><text x="165" y="242" font-size="22" fill="#1e3f55">発見日と場所</text><text x="165" y="285" font-size="22" fill="#1e3f55">かじり跡・隙間</text><path d="M311 211 h20 m-9 -8 9 8 -9 8" fill="none" stroke="#16709f" stroke-width="4"/><rect x="345" y="100" width="270" height="228" rx="14" fill="white" stroke="#2E9BD4" stroke-width="3"/><circle cx="480" cy="139" r="23" fill="#0e5c8a"/><text x="480" y="148" font-size="25" fill="white">2</text><text x="480" y="199" font-size="28" fill="#1e3f55">対応</text><text x="480" y="242" font-size="22" fill="#1e3f55">駆除と補修を分離</text><text x="480" y="285" font-size="22" fill="#1e3f55">業者の報告を保管</text><path d="M626 211 h20 m-9 -8 9 8 -9 8" fill="none" stroke="#16709f" stroke-width="4"/><rect x="660" y="100" width="270" height="228" rx="14" fill="white" stroke="#2E9BD4" stroke-width="3"/><circle cx="795" cy="139" r="23" fill="#0e5c8a"/><text x="795" y="148" font-size="25" fill="white">3</text><text x="795" y="199" font-size="28" fill="#1e3f55">説明</text><text x="795" y="242" font-size="22" fill="#1e3f55">実施済みと未確認</text><text x="795" y="285" font-size="22" fill="#1e3f55">買主と条件を合意</text><text x="480" y="371" font-size="20" fill="#5b7488">駆除の完了と、建物の補修・売買の合意は別に確認します。</text></g></svg>