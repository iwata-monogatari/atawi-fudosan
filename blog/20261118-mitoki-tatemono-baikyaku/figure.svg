<svg xmlns="http://www.w3.org/2000/svg" width="400" height="749" viewBox="0 0 400 749" role="img" aria-labelledby="t d">
<title id="t">未登記建物の登記の順番</title>
<desc id="d">表題部がない状態を見つけ、売主側で表題登記を済ませ、決済日に保存と移転と抵当権を一括申請し、買主のローンが実行される流れを見る。</desc>
<rect width="400" height="749" rx="18" fill="#eef2fa"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#2b4d8f">未登記建物の登記の順番</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#849fd0"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#2b4d8f">表題部の有無を見る</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">登記記録と課税明細で</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">建物が記録にあるかを見る</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#3a5fa3" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#849fd0"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#2b4d8f">表題登記を済ませる</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">売主側が土地家屋調査士へ</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">依頼し図面を作る</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#3a5fa3" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#fff" stroke="#849fd0"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#2b4d8f">決済日に一括申請</text>
<text x="36" y="454" font-size="20" fill="#1e3f55">保存・移転・抵当権を</text>
<text x="36" y="482" font-size="20" fill="#1e3f55">司法書士がまとめて出す</text>
<path d="M200 517v12m-5-5 5 5 5-5" fill="none" stroke="#3a5fa3" stroke-width="2"/>
<rect x="20" y="531" width="360" height="136" rx="12" fill="#2b4d8f"/>
<text x="36" y="567" font-size="24" font-weight="bold" fill="#fff">ローンが実行される</text>
<text x="36" y="607" font-size="20" font-weight="bold" fill="#fff">抵当権が付けられる状態が</text>
<text x="36" y="635" font-size="20" font-weight="bold" fill="#fff">融資の前提になる</text>
<text x="24" y="703" font-size="20" fill="#1e3f55">表題登記の遅れは、決済日の延期に直結する</text>
<text x="24" y="731" font-size="20" fill="#4e7288">出典：法務局の公表情報</text>
</g></svg>
