<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img"><rect width="1000" height="340" rx="18" fill="#e9f5fc"/><g font-family="Yu Gothic, sans-serif" fill="#1e3f55"><text x="45" y="54" font-size="27" font-weight="bold">家族で価格が違うとき、書類選びの順序</text><rect x="35" y="90" width="285" height="175" rx="12" fill="white" stroke="#2E9BD4" stroke-width="2"/><circle cx="71" cy="125" r="20" fill="#0e5c8a"/><text x="64" y="133" fill="white" font-size="23">1</text><text x="55" y="179" font-size="25" font-weight="bold">目的を決める</text><text x="55" y="222" font-size="20">売出し・分割・説明</text><path d="M329 169h20l-7 -7m7 7l-7 7" fill="none" stroke="#16709f" stroke-width="3"/><rect x="360" y="90" width="285" height="175" rx="12" fill="white" stroke="#2E9BD4" stroke-width="2"/><circle cx="396" cy="125" r="20" fill="#0e5c8a"/><text x="389" y="133" fill="white" font-size="23">2</text><text x="380" y="179" font-size="25" font-weight="bold">前提をそろえる</text><text x="380" y="222" font-size="20">時点・範囲・現況</text><path d="M654 169h20l-7 -7m7 7l-7 7" fill="none" stroke="#16709f" stroke-width="3"/><rect x="685" y="90" width="285" height="175" rx="12" fill="white" stroke="#2E9BD4" stroke-width="2"/><circle cx="721" cy="125" r="20" fill="#0e5c8a"/><text x="714" y="133" fill="white" font-size="23">3</text><text x="705" y="179" font-size="25" font-weight="bold">必要な資料へ</text><text x="705" y="222" font-size="20">査定または鑑定相談</text><text x="45" y="310" font-size="19">無料相談と鑑定評価書の取得は別です。価格は成約の保証ではありません。</text></g></svg>