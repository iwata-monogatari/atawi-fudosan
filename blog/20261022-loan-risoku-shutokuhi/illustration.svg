<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">返済総額から税の答えを出さない</title><desc id="desc">住宅ローンの返済資料を元金と利息に分け、居住のための使用開始日を確認し、その前後の利息を税理士へ照合する手順の図。返済総額と税務上の取得費を区別する。</desc><rect width="800" height="720" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="54" font-size="27" font-weight="bold">返済総額から税の答えを出さない</text><rect x="30" y="90" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="133" r="23" fill="#0e5c8a"/><text x="69" y="142" text-anchor="middle" fill="white" font-size="26">1</text><text x="109" y="140" font-size="27" font-weight="bold">元金と利息を分ける</text><text x="109" y="191" font-size="25">返済予定表・支払記録をそろえる</text><text x="109" y="230" font-size="23">購入代金との二重計上に注意</text><rect x="30" y="285" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="328" r="23" fill="#0e5c8a"/><text x="69" y="337" text-anchor="middle" fill="white" font-size="26">2</text><text x="109" y="335" font-size="27" font-weight="bold">使用開始日を確認</text><text x="109" y="386" font-size="25">借入日・引渡日・入居日を記録</text><text x="109" y="425" font-size="23">日付を都合よく選ばない</text><rect x="30" y="480" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="523" r="23" fill="#0e5c8a"/><text x="69" y="532" text-anchor="middle" fill="white" font-size="26">3</text><text x="109" y="530" font-size="27" font-weight="bold">期間と資料を照合</text><text x="109" y="581" font-size="25">使用開始前後の利息を整理</text><text x="109" y="620" font-size="23">申告への適用は税理士に確認</text><text x="40" y="704" font-size="17">2026年10月22日確認｜本文の出典と個別条件を照合</text></g></svg>