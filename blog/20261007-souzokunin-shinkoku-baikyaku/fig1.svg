<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc"><title id="title">相続人申告登記で売れる？磐田の実家売却の確認図</title><desc id="desc">相続人申告登記。権利関係を公示しない。売却には別途相続登記。相続人である旨の申出。売却準備完了とは別。名義・必要書類は専門家へ</desc><rect width="960" height="510" rx="22" fill="#e9f5fc"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#1e3f55"><text x="48" y="58" font-size="28" font-weight="bold">申告済みと売却準備済みを分ける</text><rect x="48" y="90" width="864" height="94" rx="12" fill="white" stroke="#cde2f0"/><circle cx="88" cy="136" r="23" fill="#0e5c8a"/><text x="88" y="145" text-anchor="middle" fill="white" font-size="26">1</text><text x="130" y="129" font-size="27" font-weight="bold">相続人申告登記</text><text x="130" y="163" font-size="21">相続人である旨の申出</text><rect x="48" y="204" width="864" height="94" rx="12" fill="white" stroke="#cde2f0"/><circle cx="88" cy="250" r="23" fill="#0e5c8a"/><text x="88" y="259" text-anchor="middle" fill="white" font-size="26">2</text><text x="130" y="243" font-size="27" font-weight="bold">権利関係を公示しない</text><text x="130" y="277" font-size="21">売却準備完了とは別</text><rect x="48" y="318" width="864" height="94" rx="12" fill="white" stroke="#cde2f0"/><circle cx="88" cy="364" r="23" fill="#0e5c8a"/><text x="88" y="373" text-anchor="middle" fill="white" font-size="26">3</text><text x="130" y="357" font-size="27" font-weight="bold">売却には別途相続登記</text><text x="130" y="391" font-size="21">名義・必要書類は専門家へ</text></g><text x="48" y="478" font-size="18" fill="#5b7488" font-family="Yu Gothic, Meiryo, sans-serif">大石浩之の確認案｜2026年10月7日｜個別の事情は担当者・専門家へ</text></svg>