<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d"><title id="t">地価調査の確認手順</title><desc id="d">地図で地点と調査年を確認し、1平方メートルの単価と所有地の面積を比較し、道路や形の違いを査定で尋ねる手順を示す図。</desc><rect width="960" height="500" rx="24" fill="#f2f9fe"/><g text-anchor="middle" font-family="sans-serif" fill="#0e5c8a"><text x="480" y="65" font-size="31" font-weight="bold">地図の数字を査定の質問に変える</text><rect x="60" y="105" width="840" height="90" rx="14" fill="white" stroke="#2e9bd4" stroke-width="3"/><text x="480" y="160" font-size="25">1　地価調査の地点・調査年・単価を確認</text><text x="480" y="228" font-size="32">↓</text><rect x="60" y="250" width="840" height="90" rx="14" fill="white" stroke="#2e9bd4" stroke-width="3"/><text x="480" y="305" font-size="25">2　単価 × 面積は比較用の概算</text><text x="480" y="370" font-size="32">↓</text><rect x="60" y="395" width="840" height="75" rx="14" fill="white" stroke="#2e9bd4" stroke-width="3"/><text x="480" y="443" font-size="25">3　道路・形・境界の差を査定で質問</text></g></svg>
