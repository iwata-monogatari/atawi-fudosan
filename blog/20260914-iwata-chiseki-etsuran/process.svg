<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="t d"><title id="t">磐田市の地籍調査成果から売買契約まで</title><desc id="d">所在と地番をそろえ、窓口で成果を閲覧し、現況と照合して契約で約束する範囲を決める。</desc><rect width="1000" height="420" rx="20" fill="#e9f5fc"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="53" font-size="29" font-weight="700">市の成果を、売却前の確認につなげる</text><g fill="#fff" stroke="#cde2f0" stroke-width="2"><rect x="35" y="85" width="290" height="215" rx="14"/><rect x="355" y="85" width="290" height="215" rx="14"/><rect x="675" y="85" width="290" height="215" rx="14"/></g><g fill="#0e5c8a" font-size="28" font-weight="700"><text x="58" y="130">1 地番を用意</text><text x="378" y="130">2 窓口で閲覧</text><text x="698" y="130">3 現況と照合</text></g><g font-size="22"><text x="58" y="179">売却する各土地を確認</text><text x="58" y="222">成果の有無を電話で</text><text x="58" y="265">来庁条件も聞く</text><text x="378" y="179">地籍調査グループへ</text><text x="378" y="222">郵送請求は不可</text><text x="378" y="265">コピーは有料</text><text x="698" y="179">土地家屋調査士へ相談</text><text x="698" y="222">境界標・分筆等を確認</text><text x="698" y="265">追加作業を判断</text></g><rect x="100" y="328" width="800" height="62" rx="12" fill="#0e5c8a"/><text x="500" y="368" text-anchor="middle" fill="white" font-size="26">契約に書く確認範囲・費用負担・期限を決める</text></g></svg>
