<svg xmlns="http://www.w3.org/2000/svg" width="760" height="800" viewBox="0 0 760 800" role="img" aria-labelledby="title desc"><title>剪定する前に、枝の出口を決める</title><desc>磐田市で集積所に出す枝は太さ20センチメートルと長さ50センチメートル以内で個数の上限があり、太さ20センチメートルを超える枝は市への自己搬入でも処理できず、大量の枝や刈草は有料の民間施設の条件確認が必要なことを示す図。</desc><rect width="760" height="800" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic, Noto Sans JP, sans-serif" fill="#1e3f55"><text x="30" y="58" font-size="28" font-weight="bold">剪定する前に、枝の出口を決める</text><rect x="30" y="92" width="700" height="185" rx="12" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="75" cy="136" r="25" fill="#0e5c8a"/><text x="75" y="147" text-anchor="middle" fill="white" font-size="32">1</text><text x="118" y="147" font-size="32" font-weight="bold">集積所に出す枝</text><text x="55" y="201" font-size="29" font-weight="normal">太さ20cm・長さ50cm以内</text><text x="55" y="255" font-size="29" font-weight="normal">袋・収集券と個数を確認</text><rect x="30" y="302" width="700" height="185" rx="12" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="75" cy="346" r="25" fill="#0e5c8a"/><text x="75" y="357" text-anchor="middle" fill="white" font-size="32">2</text><text x="118" y="357" font-size="32" font-weight="bold">太さ20cmを超える枝</text><text x="55" y="411" font-size="29" font-weight="normal">市への自己搬入も処理不可</text><text x="55" y="465" font-size="29" font-weight="normal">切る前に処分先へ相談</text><rect x="30" y="512" width="700" height="185" rx="12" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="75" cy="556" r="25" fill="#0e5c8a"/><text x="75" y="567" text-anchor="middle" fill="white" font-size="32">3</text><text x="118" y="567" font-size="32" font-weight="bold">大量の枝・刈草</text><text x="55" y="621" font-size="29" font-weight="normal">民間リサイクル施設を確認</text><text x="55" y="675" font-size="29" font-weight="normal">有料・受入条件は事前確認</text><text x="30" y="757" font-size="20" fill="#4e7288">2026年10月5日確認｜公式情報をもとに筆者作成</text></g></svg>