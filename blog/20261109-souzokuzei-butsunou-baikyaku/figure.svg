<svg xmlns="http://www.w3.org/2000/svg" width="400" height="584" viewBox="0 0 400 584" role="img" aria-labelledby="t d"><title id="t">収納価額の仮の計算例</title><desc id="d">計算の関係だけを見る仮の例。特例適用前の価額を2,000万円と仮定し、減額割合80％を経て特例適用後は400万円となり、収納価額の出発点になる。</desc><rect width="400" height="584" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif"><text x="24" y="44" font-size="25" font-weight="bold" fill="#0e5c8a">収納価額の仮の計算例</text><rect x="20" y="72" width="360" height="108" rx="12" fill="#fff" stroke="#2e9bd4"/><text x="36" y="108" font-size="24" font-weight="bold" fill="#0e5c8a">特例適用前の価額</text><text x="36" y="148" font-size="20" fill="#1e3f55">2,000万円と仮定</text><path d="M200 183v12m-5-5 5 5 5-5" fill="none" stroke="#16709f" stroke-width="2"/><rect x="20" y="198" width="360" height="136" rx="12" fill="#fff" stroke="#2e9bd4"/><text x="36" y="234" font-size="24" font-weight="bold" fill="#0e5c8a">減額割合80％</text><text x="36" y="274" font-size="20" fill="#1e3f55">すべての土地に使える</text><text x="36" y="302" font-size="20" fill="#1e3f55">わけではない</text><path d="M200 337v12m-5-5 5 5 5-5" fill="none" stroke="#16709f" stroke-width="2"/><rect x="20" y="352" width="360" height="136" rx="12" fill="#0e5c8a"/><text x="36" y="388" font-size="24" font-weight="bold" fill="#fff">特例適用後の価額</text><text x="36" y="428" font-size="20" font-weight="bold" fill="#fff">2,000万円×20％</text><text x="36" y="456" font-size="20" font-weight="bold" fill="#fff">＝400万円</text><text x="24" y="538" font-size="20" fill="#4e7288">出典：国税庁No.4214・4124</text><text x="24" y="566" font-size="20" fill="#4e7288">2026年11月9日確認</text></g></svg>