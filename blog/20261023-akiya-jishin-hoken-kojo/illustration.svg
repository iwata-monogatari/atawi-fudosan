<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">保険と税控除を分ける確認の順番</title><desc id="desc">空き家の地震保険料控除を確認する図。家の居住状況を記録し、所有者と保険料の支払者を整理した後、契約と補償は保険会社へ、所得控除は税理士等へ確認する。</desc><rect width="800" height="720" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="54" font-size="27" font-weight="bold">保険と税控除を分ける確認の順番</text><rect x="30" y="90" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="133" r="23" fill="#0e5c8a"/><text x="69" y="142" text-anchor="middle" fill="white" font-size="26">1</text><text x="109" y="140" font-size="27" font-weight="bold">家の使い方</text><text x="109" y="191" font-size="25">誰が住み、いつ状況が変わったか</text><text x="109" y="230" font-size="23">施設入居日・宿泊の実態をメモ</text><rect x="30" y="285" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="328" r="23" fill="#0e5c8a"/><text x="69" y="337" text-anchor="middle" fill="white" font-size="26">2</text><text x="109" y="335" font-size="27" font-weight="bold">人とお金</text><text x="109" y="386" font-size="25">所有者・保険料の支払者を整理</text><text x="109" y="425" font-size="23">契約書・証明書・支払記録を照合</text><rect x="30" y="480" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="523" r="23" fill="#0e5c8a"/><text x="69" y="532" text-anchor="middle" fill="white" font-size="26">3</text><text x="109" y="530" font-size="27" font-weight="bold">確認先を分ける</text><text x="109" y="581" font-size="25">契約と補償は保険会社へ</text><text x="109" y="620" font-size="23">所得控除の個別判断は税理士等へ</text><text x="40" y="704" font-size="17">2026年10月23日確認｜本文の出典と個別条件を照合</text></g></svg>