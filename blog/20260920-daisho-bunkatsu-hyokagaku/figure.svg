<svg xmlns="http://www.w3.org/2000/svg" width="800" height="516" viewBox="0 0 800 516" role="img" aria-labelledby="title desc"><title id="title">同じ実家でも、数字の役割は別</title><desc id="desc">実家の代償分割で、家族の話合いに使う価格、実際に支払う代償金、相続税の課税価格の計算を分け、評価条件・資金・税務上の調整をそれぞれ確認する図</desc><rect width="800" height="516" rx="24" fill="#e9f5fc"/><g font-family="Yu Gothic,Meiryo,sans-serif"><text x="40" y="60" font-size="30" font-weight="bold" fill="#0e5c8a">同じ実家でも、数字の役割は別</text><rect x="35" y="90" width="730" height="102" rx="14" fill="white" stroke="#cde2f0"/><circle cx="80" cy="138" r="25" fill="#16709f"/><text x="80" y="148" text-anchor="middle" font-size="29" fill="white">1</text><text x="125" y="130" font-size="28" font-weight="bold" fill="#0e5c8a">家族の話合いに使う価格</text><text x="125" y="167" font-size="22" fill="#1e3f55">評価時点・現況など、前提をそろえる</text><rect x="35" y="212" width="730" height="102" rx="14" fill="white" stroke="#cde2f0"/><circle cx="80" cy="260" r="25" fill="#16709f"/><text x="80" y="270" text-anchor="middle" font-size="29" fill="white">2</text><text x="125" y="252" font-size="28" font-weight="bold" fill="#0e5c8a">実際に支払う代償金</text><text x="125" y="289" font-size="22" fill="#1e3f55">金額だけでなく、資金と期限も確認</text><rect x="35" y="334" width="730" height="102" rx="14" fill="white" stroke="#cde2f0"/><circle cx="80" cy="382" r="25" fill="#16709f"/><text x="80" y="392" text-anchor="middle" font-size="29" fill="white">3</text><text x="125" y="374" font-size="28" font-weight="bold" fill="#0e5c8a">相続税の課税価格の計算</text><text x="125" y="411" font-size="22" fill="#1e3f55">時価基準なら調整が必要な場合あり</text></g></svg>