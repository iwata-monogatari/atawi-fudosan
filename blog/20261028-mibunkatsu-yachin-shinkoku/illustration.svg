<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title desc"><title id="title">受取口座と所得の帰属を分ける</title><desc id="desc">遺言がなく相続人が子3人だけの場合。家賃は長男の口座で管理しても、未分割期間の不動産所得は各人へ3分の1ずつ帰属する。</desc><rect width="960" height="700" rx="24" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="48" y="62" font-size="32" font-weight="bold">家賃の受取先と、所得の帰属は別</text><text x="48" y="108" font-size="23">前提：遺言なし・相続人は子3人だけ・未分割</text><rect x="48" y="150" width="864" height="170" rx="16" fill="#e0f0fa"/><path d="M100 238L164 186L228 238M116 230V291H212V230" fill="#fff" stroke="#16709f" stroke-width="6"/><text x="275" y="223" font-size="27">貸家の家賃</text><path d="M440 237H530L516 224M530 237L516 250" fill="none" stroke="#16709f" stroke-width="5"/><rect x="562" y="182" width="310" height="104" rx="12" fill="#fff" stroke="#2e9bd4" stroke-width="2"/><text x="717" y="224" text-anchor="middle" font-size="26" font-weight="bold">長男の口座</text><text x="717" y="264" text-anchor="middle" font-size="23">入金・管理の窓口</text><text x="480" y="377" text-anchor="middle" font-size="28" font-weight="bold">未分割期間の不動産所得</text><text x="480" y="418" text-anchor="middle" font-size="23">法定相続分に応じて各人に帰属</text><path d="M480 435V458M186 458H774M186 458V478M480 458V478M774 458V478" fill="none" stroke="#16709f" stroke-width="4"/><g text-anchor="middle" font-size="27"><rect x="60" y="480" width="252" height="106" rx="12" fill="#fff" stroke="#2e9bd4" stroke-width="2"/><text x="186" y="522">長男</text><text x="186" y="566" font-weight="bold">3分の1</text><rect x="354" y="480" width="252" height="106" rx="12" fill="#fff" stroke="#2e9bd4" stroke-width="2"/><text x="480" y="522">次男</text><text x="480" y="566" font-weight="bold">3分の1</text><rect x="648" y="480" width="252" height="106" rx="12" fill="#fff" stroke="#2e9bd4" stroke-width="2"/><text x="774" y="522">長女</text><text x="774" y="566" font-weight="bold">3分の1</text></g><text x="480" y="632" text-anchor="middle" font-size="23">相続放棄など、割合が変わる事情がない例です。</text><text x="480" y="670" text-anchor="middle" font-size="21">税額や送金先の図ではありません。個別の申告は税理士等へ。</text></g></svg>
