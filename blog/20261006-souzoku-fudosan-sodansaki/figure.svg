<svg xmlns="http://www.w3.org/2000/svg" width="760" height="690" viewBox="0 0 760 690" role="img"><title>相続した家の質問を分ける</title><desc>相続不動産の相談を、名義と登記手続きは司法書士、税額と申告は税理士、査定と売却の段取りは不動産会社へ振り分ける図。各窓口で期限、不足資料、売却以外の選択肢を確認する案を示す。</desc><rect width="760" height="690" fill="#f2f9fe"/><style>text{font-family:Yu Gothic,Meiryo,sans-serif;fill:#1e3f55}</style><rect width="760" height="98" fill="#0e5c8a"/><text x="34" y="62" font-size="30" font-weight="bold" style="fill:white">相続した家の質問を分ける</text><rect x="24" y="122" width="712" height="150" rx="12" fill="white" stroke="#cde2f0"/><rect x="24" y="122" width="8" height="150" rx="4" fill="#2E9BD4"/><text x="50" y="160" font-size="26" font-weight="bold">名義・申請書類</text><text x="50" y="205" font-size="24">司法書士 → 登記手続きと必要書類</text><text x="50" y="245" font-size="24">期限と不足資料を確認</text><rect x="24" y="296" width="712" height="150" rx="12" fill="white" stroke="#cde2f0"/><rect x="24" y="296" width="8" height="150" rx="4" fill="#2E9BD4"/><text x="50" y="334" font-size="26" font-weight="bold">税額・申告</text><text x="50" y="379" font-size="24">税理士 → 税務相談と申告書作成</text><text x="50" y="419" font-size="24">相続全体の財産を確認</text><rect x="24" y="470" width="712" height="150" rx="12" fill="white" stroke="#cde2f0"/><rect x="24" y="470" width="8" height="150" rx="4" fill="#2E9BD4"/><text x="50" y="508" font-size="26" font-weight="bold">価格・売る段取り</text><text x="50" y="553" font-size="24">不動産会社 → 査定と販売条件</text><text x="50" y="593" font-size="24">売らない案も残して比較</text><text x="30" y="664" font-size="18">2026年10月6日確認｜公式情報をもとに筆者作成</text></svg>