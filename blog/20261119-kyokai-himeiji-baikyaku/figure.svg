<svg xmlns="http://www.w3.org/2000/svg" width="400" height="749" viewBox="0 0 400 749" role="img" aria-labelledby="t d">
<title id="t">境界非明示の判断手順</title>
<desc id="d">境界の現況を調べ、買主の用途とローンを確かめ、非明示の範囲を特約と重説に残す。</desc>
<rect width="400" height="749" rx="18" fill="#f7f3ea"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#6b5a1e">境界非明示の判断手順</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#c0b27d"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#6b5a1e">現況を調べる</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">境界標の有無と筆界確認の</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">状況を公図と現地で確かめる</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#8a742a" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#c0b27d"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#6b5a1e">用途を読む</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">買主の建築計画とローンが</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">確定測量を求めるかを見る</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#8a742a" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#fff" stroke="#c0b27d"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#6b5a1e">特約を設計する</text>
<text x="36" y="454" font-size="20" fill="#1e3f55">非明示の範囲と将来の測量の</text>
<text x="36" y="482" font-size="20" fill="#1e3f55">負担を契約書に書き分ける</text>
<path d="M200 517v12m-5-5 5 5 5-5" fill="none" stroke="#8a742a" stroke-width="2"/>
<rect x="20" y="531" width="360" height="136" rx="12" fill="#6b5a1e"/>
<text x="36" y="567" font-size="24" font-weight="bold" fill="#fff">説明を残す</text>
<text x="36" y="607" font-size="20" font-weight="bold" fill="#fff">分からない範囲をそのまま</text>
<text x="36" y="635" font-size="20" font-weight="bold" fill="#fff">重説と告知に記録する</text>
<text x="24" y="703" font-size="20" fill="#1e3f55">非明示は、隠すことではなく開示の形</text>
<text x="24" y="731" font-size="20" fill="#4e7288">出典：不動産取引実務・民法11月確認</text>
</g></svg>
