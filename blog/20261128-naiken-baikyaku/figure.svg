<svg xmlns="http://www.w3.org/2000/svg" width="400" height="596" viewBox="0 0 400 596" role="img" aria-labelledby="t d">
<title id="t">内見準備の3段階</title>
<desc id="d">掃除と片付け、明るさの演出、当日の応対の3段階で準備する。</desc>
<rect width="400" height="596" rx="18" fill="#eef3f7"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#1e4f6b">内見準備の3段階</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#7da7bb"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#1e4f6b">前日までに片付ける</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">玄関・水回り・キッチンを重点掃除</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">床に物を置かず収納へ入れる</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#2e7396" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#7da7bb"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#1e4f6b">当日朝に明るくする</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">全室の照明をつけカーテンを開ける</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">換気して生活臭を抜いておく</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#2e7396" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#1e4f6b"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#fff">内見中は任せる</text>
<text x="36" y="454" font-size="20" font-weight="bold" fill="#fff">案内は仲介担当者に任せる</text>
<text x="36" y="482" font-size="20" font-weight="bold" fill="#fff">質問されたことだけ簡潔に答える</text>
<text x="24" y="550" font-size="20" fill="#1e3f55">希望者の質問には、事実だけを正確に答えることが大切です。</text>
<text x="24" y="578" font-size="20" fill="#4e7288">出典：国土交通省「不動産取引の手引き」ほか実務資料</text>
</g></svg>
