<svg xmlns="http://www.w3.org/2000/svg" width="400" height="749" viewBox="0 0 400 749" role="img" aria-labelledby="t d">
<title id="t">信託した家の売却</title>
<desc id="d">登記簿の信託の記録で受託者を確認し、信託契約と信託目録で売却の権限を見て、受託者が売主として契約する。代金は信託財産になる。</desc>
<rect width="400" height="749" rx="18" fill="#f2f5fe"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#3a4f9e">信託した家の売却</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#93a5dd"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#3a4f9e">登記簿で信託を確認</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">名義は受託者になっている</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">信託の記録が付いている</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#5468b3" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#93a5dd"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#3a4f9e">契約で処分権限を見る</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">売却できる範囲と条件を</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">信託目録で確かめる</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#5468b3" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#fff" stroke="#93a5dd"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#3a4f9e">受託者が売主になる</text>
<text x="36" y="454" font-size="20" fill="#1e3f55">受益者のために売却し</text>
<text x="36" y="482" font-size="20" fill="#1e3f55">代金は信託財産に入る</text>
<path d="M200 517v12m-5-5 5 5 5-5" fill="none" stroke="#5468b3" stroke-width="2"/>
<rect x="20" y="531" width="360" height="136" rx="12" fill="#3a4f9e"/>
<text x="36" y="567" font-size="24" font-weight="bold" fill="#fff">権限がなければ売れない</text>
<text x="36" y="607" font-size="20" font-weight="bold" fill="#fff">信託していない財産も同じ</text>
<text x="36" y="635" font-size="20" font-weight="bold" fill="#fff">契約の見直しが先になる</text>
<text x="24" y="703" font-size="20" fill="#1e3f55">後見の裁判所許可とは別の仕組み</text>
<text x="24" y="731" font-size="20" fill="#4e7288">出典：法務省11月確認</text>
</g></svg>
