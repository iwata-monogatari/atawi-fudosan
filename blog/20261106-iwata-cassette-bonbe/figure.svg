<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" role="img" aria-labelledby="title desc">
<title id="title">引渡し前に、缶を三つに分ける</title><desc id="desc">家庭用カセットボンベの処分を三つに分けた図。空で状態に不安がない容器は穴を開けず専用コンテナへ。中身が残るか状態が不明なら処理方法を相談。屋外の住宅用LPガス容器は別扱いで販売店などへ相談する。</desc>
<rect width="640" height="500" rx="20" fill="#e9f5fc"/>
<g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55">
<text x="28" y="53" font-size="25" font-weight="bold">引渡し前に、缶を三つに分ける</text>
<rect x="22" y="83" width="596" height="104" rx="12" fill="white" stroke="#9dcfe7"/>
<circle cx="52" cy="114" r="18" fill="#0e5c8a"/><text x="52" y="122" text-anchor="middle" fill="white" font-size="23">1</text>
<text x="84" y="120" font-size="23" font-weight="bold">空で状態に不安がない</text>
<text x="38" y="163" font-size="22">穴を開けず、専用コンテナへ</text>
<rect x="22" y="202" width="596" height="104" rx="12" fill="white" stroke="#9dcfe7"/>
<circle cx="52" cy="233" r="18" fill="#0e5c8a"/><text x="52" y="241" text-anchor="middle" fill="white" font-size="23">2</text>
<text x="84" y="239" font-size="23" font-weight="bold">中身が残る・状態が不明</text>
<text x="38" y="282" font-size="22">家庭ごみに混ぜず、処理方法を相談</text>
<rect x="22" y="321" width="596" height="104" rx="12" fill="white" stroke="#9dcfe7"/>
<circle cx="52" cy="352" r="18" fill="#0e5c8a"/><text x="52" y="360" text-anchor="middle" fill="white" font-size="23">3</text>
<text x="84" y="358" font-size="23" font-weight="bold">屋外の住宅用LPガス容器</text>
<text x="38" y="401" font-size="22">家庭用と別扱い。販売店などへ</text>
<text x="28" y="477" font-size="17">2026年11月6日確認｜本文の条件・個別確認も参照</text></g></svg>