<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">領収書の印紙を貼る前に</title><desc id="desc">売却代金の領収書について、金銭の受取りを証明する文面か、営業に関する受取りかを先に確認し、税務署や税理士に照会してから印紙を準備する図。</desc><rect width="800" height="720" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="54" font-size="27" font-weight="bold">領収書の印紙を貼る前に</text><rect x="30" y="90" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="133" r="23" fill="#0e5c8a"/><text x="69" y="142" text-anchor="middle" fill="white" font-size="26">1</text><text x="109" y="140" font-size="27" font-weight="bold">書類を確認</text><text x="109" y="191" font-size="25">金銭の受取りを証明するか</text><text x="109" y="230" font-size="23">名前だけでなく、文面を見せる</text><rect x="30" y="285" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="328" r="23" fill="#0e5c8a"/><text x="69" y="337" text-anchor="middle" fill="white" font-size="26">2</text><text x="109" y="335" font-size="27" font-weight="bold">受取りを確認</text><text x="109" y="386" font-size="25">営業に関する受取りか</text><text x="109" y="425" font-size="23">個人名義だけで非課税と決めない</text><rect x="30" y="480" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="523" r="23" fill="#0e5c8a"/><text x="69" y="532" text-anchor="middle" fill="white" font-size="26">3</text><text x="109" y="530" font-size="27" font-weight="bold">判断を照会</text><text x="109" y="581" font-size="25">文面案と取引の事情を用意</text><text x="109" y="620" font-size="23">課税区分を確認してから印紙を準備</text><text x="40" y="704" font-size="17">2026年10月20日確認｜本文の出典と個別条件を照合</text></g></svg>