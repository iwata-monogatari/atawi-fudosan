<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">遺贈登記を相談する前の三つの照合</title><desc id="desc">遺贈登記の単独申請を相談する準備図。受け取る人が相続人か、遺言の不動産と登記記録が一致するかを整理し、司法書士に申請方法を確認してから売却日程を組む。</desc><rect width="800" height="720" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="40" y="54" font-size="27" font-weight="bold">遺贈登記を相談する前の三つの照合</text><rect x="30" y="90" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="133" r="23" fill="#0e5c8a"/><text x="69" y="142" text-anchor="middle" fill="white" font-size="26">1</text><text x="109" y="140" font-size="27" font-weight="bold">受け取る人</text><text x="109" y="191" font-size="25">相続人に当たるかを確認</text><text x="109" y="230" font-size="23">親族という呼び方だけで決めない</text><rect x="30" y="285" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="328" r="23" fill="#0e5c8a"/><text x="69" y="337" text-anchor="middle" fill="white" font-size="26">2</text><text x="109" y="335" font-size="27" font-weight="bold">遺言と不動産</text><text x="109" y="386" font-size="25">取得する人・土地・建物を照合</text><text x="109" y="425" font-size="23">単独申請と遺言の有効性は別問題</text><rect x="30" y="480" width="740" height="170" rx="14" fill="#fff" stroke="#a8d6ee" stroke-width="2"/><circle cx="69" cy="523" r="23" fill="#0e5c8a"/><text x="69" y="532" text-anchor="middle" fill="white" font-size="26">3</text><text x="109" y="530" font-size="27" font-weight="bold">売却の段取り</text><text x="109" y="581" font-size="25">司法書士に申請方法を相談</text><text x="109" y="620" font-size="23">登記の見通しを得て日程を組む</text><text x="40" y="704" font-size="17">2026年10月23日確認｜本文の出典と個別条件を照合</text></g></svg>