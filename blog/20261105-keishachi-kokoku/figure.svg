<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 366" role="img" aria-labelledby="t d"><title id="t">同じ20％でも斜面の位置が違う二つの敷地</title><desc id="d">面積200㎡の二つの長方形のうち各40㎡を斜線で示す。左は道路から遠い側、右は道路に接する側が斜面。</desc><defs><pattern id="h" patternUnits="userSpaceOnUse" width="8" height="8"><rect width="8" height="8" fill="#dae9f3"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#246485" stroke-width="2"/></pattern></defs><rect width="440" height="366" rx="10" fill="#f4f8fa"/><g font-family="Meiryo,sans-serif" fill="#14334b"><text x="24" y="38" font-size="22" font-weight="bold">敷地200㎡のうち、斜面は40㎡</text><text x="24" y="67" font-size="17">架空の敷地を上から見た図</text><g text-anchor="middle" font-size="19" font-weight="bold"><text x="115" y="106">奥に斜面</text><text x="325" y="106">道路側に斜面</text></g><g stroke="#305266" stroke-width="2"><rect x="32" y="124" width="166" height="140" fill="#fff"/><rect x="242" y="124" width="166" height="140" fill="#fff"/><rect x="32" y="124" width="166" height="28" fill="url(#h)"/><rect x="242" y="236" width="166" height="28" fill="url(#h)"/></g><g text-anchor="middle" font-size="18"><text x="115" y="209">平坦な部分</text><text x="325" y="187">平坦な部分</text></g><rect x="24" y="266" width="392" height="39" rx="2" fill="#4c606b"/><text x="220" y="292" text-anchor="middle" fill="#fff" font-size="19">道路</text><rect x="43" y="328" width="28" height="19" fill="url(#h)" stroke="#305266"/><text x="81" y="344" font-size="17">傾斜地　40㎡ ÷ 200㎡ ＝ 20％</text></g></svg>