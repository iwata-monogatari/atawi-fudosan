<svg xmlns="http://www.w3.org/2000/svg" width="400" height="749" viewBox="0 0 400 749" role="img" aria-labelledby="t d">
<title id="t">返済と売却の順番</title>
<desc id="d">残債と売却見込みを比べ、決済日の一括返済と同時抹消を基本に、手数料を確認する。</desc>
<rect width="400" height="749" rx="18" fill="#eef3f7"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#1e4f6b">返済と売却の順番</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#7da7bb"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#1e4f6b">残債を確かめる</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">返済予定表と残高証明で、</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">今の残債を正確に把握する</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#2e7396" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#7da7bb"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#1e4f6b">手数料を見る</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">全額繰上返済の手数料と、</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">保証料の返戻の有無を確認</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#2e7396" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#fff" stroke="#7da7bb"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#1e4f6b">決済日に返済</text>
<text x="36" y="454" font-size="20" fill="#1e3f55">売却代金で一括返済し、</text>
<text x="36" y="482" font-size="20" fill="#1e3f55">その場で抹消書類を受け取る</text>
<path d="M200 517v12m-5-5 5 5 5-5" fill="none" stroke="#2e7396" stroke-width="2"/>
<rect x="20" y="531" width="360" height="136" rx="12" fill="#1e4f6b"/>
<text x="36" y="567" font-size="24" font-weight="bold" fill="#fff">抹消して渡す</text>
<text x="36" y="607" font-size="20" font-weight="bold" fill="#fff">司法書士が抵当権抹消と</text>
<text x="36" y="635" font-size="20" font-weight="bold" fill="#fff">所有権移転を同日に行う</text>
<text x="24" y="703" font-size="20" fill="#1e3f55">オーバーローンは不足分の手当てが先。</text>
<text x="24" y="731" font-size="20" fill="#4e7288">出典：金融機関の返済案内をもとに作成</text>
</g></svg>
