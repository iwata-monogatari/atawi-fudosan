<svg xmlns="http://www.w3.org/2000/svg" width="400" height="749" viewBox="0 0 400 749" role="img" aria-labelledby="t d">
<title id="t">引き継ぎ書類の一覧</title>
<desc id="d">認定通知書、維持保全計画、点検と修繕の記録、図面を引き継ぐ。</desc>
<rect width="400" height="749" rx="18" fill="#eef3f7"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#1e4f6b">引き継ぎ書類の一覧</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#7da7bb"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#1e4f6b">認定の書類</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">認定通知書と認定申請時の</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">図書一式をそろえる</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#2e7396" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#7da7bb"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#1e4f6b">維持保全計画</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">計画書と、計画に沿った点検の</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">実施状況を確認する</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#2e7396" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#fff" stroke="#7da7bb"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#1e4f6b">点検・修繕の記録</text>
<text x="36" y="454" font-size="20" fill="#1e3f55">定期点検の結果と修繕履歴を</text>
<text x="36" y="482" font-size="20" fill="#1e3f55">住宅履歴情報としてまとめる</text>
<path d="M200 517v12m-5-5 5 5 5-5" fill="none" stroke="#2e7396" stroke-width="2"/>
<rect x="20" y="531" width="360" height="136" rx="12" fill="#1e4f6b"/>
<text x="36" y="567" font-size="24" font-weight="bold" fill="#fff">買主の手続き</text>
<text x="36" y="607" font-size="20" font-weight="bold" fill="#fff">地位の承継の承認など、所管</text>
<text x="36" y="635" font-size="20" font-weight="bold" fill="#fff">行政庁の手続きを案内する</text>
<text x="24" y="703" font-size="20" fill="#1e3f55">買主側は地位の承継の手続きを確認します。</text>
<text x="24" y="731" font-size="20" fill="#4e7288">出典：国土交通省の長期優良住宅の案内をもとに作成</text>
</g></svg>
