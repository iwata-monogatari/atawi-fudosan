<svg xmlns="http://www.w3.org/2000/svg" width="400" height="749" viewBox="0 0 400 749" role="img" aria-labelledby="t d">
<title id="t">価格表示の読み方</title>
<desc id="d">総額表示を確認し、土地・建物・消費税の内訳と、諸費用が別かどうかを確認する。</desc>
<rect width="400" height="749" rx="18" fill="#f3efe7"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#6b531e">価格表示の読み方</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#bba77d"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#6b531e">税込総額の確認</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">広告の価格は税込総額表示が</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">原則。まず総額で比較する</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#96802e" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#bba77d"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#6b531e">内訳の確認</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">土地価格・建物価格・建物に</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">かかる消費税額を分けて見る</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#96802e" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#fff" stroke="#bba77d"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#6b531e">諸費用の確認</text>
<text x="36" y="454" font-size="20" fill="#1e3f55">仲介手数料や登記費用が価格に</text>
<text x="36" y="482" font-size="20" fill="#1e3f55">含まれるか、別かを確認する</text>
<path d="M200 517v12m-5-5 5 5 5-5" fill="none" stroke="#96802e" stroke-width="2"/>
<rect x="20" y="531" width="360" height="136" rx="12" fill="#6b531e"/>
<text x="36" y="567" font-size="24" font-weight="bold" fill="#fff">書類の保管</text>
<text x="36" y="607" font-size="20" font-weight="bold" fill="#fff">売買契約書の内訳は、税務や</text>
<text x="36" y="635" font-size="20" font-weight="bold" fill="#fff">控除の手続きで使うため保管</text>
<text x="24" y="703" font-size="20" fill="#1e3f55">土地は非課税、建物は課税が原則です。</text>
<text x="24" y="731" font-size="20" fill="#4e7288">出典：国税庁タックスアンサー・総額表示の案内をもとに作成</text>
</g></svg>
