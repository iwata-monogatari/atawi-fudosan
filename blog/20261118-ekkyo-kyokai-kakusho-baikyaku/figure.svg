<svg xmlns="http://www.w3.org/2000/svg" width="400" height="749" viewBox="0 0 400 749" role="img" aria-labelledby="t d">
<title id="t">越境物の売却手順</title>
<desc id="d">境界確認で越境の範囲を特定し、覚書を取り交わし、買主へ引き継いで、重要事項説明に明記する。</desc>
<rect width="400" height="749" rx="18" fill="#eef7f2"/>
<g font-family="Yu Gothic,Meiryo,sans-serif">
<text x="24" y="44" font-size="25" font-weight="bold" fill="#1e6b4a">越境物の売却手順</text>
<rect x="20" y="72" width="360" height="136" rx="12" fill="#fff" stroke="#7dbb9c"/>
<text x="36" y="108" font-size="24" font-weight="bold" fill="#1e6b4a">範囲を特定する</text>
<text x="36" y="148" font-size="20" fill="#1e3f55">境界確認と現地調査で</text>
<text x="36" y="176" font-size="20" fill="#1e3f55">越境の位置と寸法を図面化</text>
<path d="M200 211v12m-5-5 5 5 5-5" fill="none" stroke="#2e8c63" stroke-width="2"/>
<rect x="20" y="225" width="360" height="136" rx="12" fill="#fff" stroke="#7dbb9c"/>
<text x="36" y="261" font-size="24" font-weight="bold" fill="#1e6b4a">覚書を取り交わす</text>
<text x="36" y="301" font-size="20" fill="#1e3f55">現状を認め将来の建て替えで</text>
<text x="36" y="329" font-size="20" fill="#1e3f55">解消する約束を書面にする</text>
<path d="M200 364v12m-5-5 5 5 5-5" fill="none" stroke="#2e8c63" stroke-width="2"/>
<rect x="20" y="378" width="360" height="136" rx="12" fill="#fff" stroke="#7dbb9c"/>
<text x="36" y="414" font-size="24" font-weight="bold" fill="#1e6b4a">買主へ引き継ぐ</text>
<text x="36" y="454" font-size="20" fill="#1e3f55">覚書は所有者が変わっても</text>
<text x="36" y="482" font-size="20" fill="#1e3f55">引き継ぐ旨を入れておく</text>
<path d="M200 517v12m-5-5 5 5 5-5" fill="none" stroke="#2e8c63" stroke-width="2"/>
<rect x="20" y="531" width="360" height="136" rx="12" fill="#1e6b4a"/>
<text x="36" y="567" font-size="24" font-weight="bold" fill="#fff">重説に明記する</text>
<text x="36" y="607" font-size="20" font-weight="bold" fill="#fff">越境の内容と覚書の存在を</text>
<text x="36" y="635" font-size="20" font-weight="bold" fill="#fff">重要事項説明書に記載する</text>
<text x="24" y="703" font-size="20" fill="#1e3f55">覚書は隣地との信頼を形にしたもの</text>
<text x="24" y="731" font-size="20" fill="#4e7288">出典：民法・不動産取引実務11月確認</text>
</g></svg>
