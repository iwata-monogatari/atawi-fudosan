<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620"><rect width="960" height="620" rx="28" fill="#e9f5fc"/><g font-family="Yu Gothic,Meiryo,sans-serif" text-anchor="middle" fill="#1e3f55"><text x="480" y="65" font-size="34" font-weight="bold">AI査定から売出価格へ、3つの確認</text><text x="480" y="108" font-size="23">金額を比べる前に、根拠を照合する</text><rect x="35" y="155" width="280" height="230" rx="18" fill="white"/><rect x="340" y="155" width="280" height="230" rx="18" fill="white"/><rect x="645" y="155" width="280" height="230" rx="18" fill="white"/><g fill="#0e5c8a" font-size="32" font-weight="bold"><text x="175" y="212">1 出典</text><text x="480" y="212">2 時点</text><text x="785" y="212">3 現地条件</text></g><g font-size="25"><text x="175" y="275">資料名・価格の種類</text><text x="175" y="325">元の資料へ戻る</text><text x="480" y="275">取引時期・更新日</text><text x="480" y="325">作成日と分ける</text><text x="785" y="275">建物・道路・境界</text><text x="785" y="325">確認済みと仮定</text></g><path d="M480 400v40m-15-15 15 15 15-15" stroke="#2e9bd4" stroke-width="7" fill="none"/><rect x="95" y="460" width="770" height="100" rx="20" fill="#0e5c8a"/><text x="480" y="503" fill="white" font-size="27">不明な項目を担当者に質問する</text><text x="480" y="540" fill="white" font-size="25">売出価格の判断と責任は、人が引き受ける</text><text x="480" y="599" font-size="18">確認手順の説明図です。査定精度や売却価格を保証する図ではありません。</text></g></svg>