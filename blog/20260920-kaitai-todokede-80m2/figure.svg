<svg xmlns="http://www.w3.org/2000/svg" width="800" height="638" viewBox="0 0 800 638" role="img" aria-labelledby="title desc"><title id="title">更地渡しへつなぐ、4つの確認</title><desc id="desc">解体の対象面積と届出担当を確認し、着工7日前までに発注者等が届け出て、提出控えと着工日を照合し、解体後の現地確認と別手続きを経て更地を引き渡す工程図</desc><rect width="800" height="638" rx="24" fill="#e9f5fc"/><g font-family="Yu Gothic,Meiryo,sans-serif"><text x="40" y="60" font-size="30" font-weight="bold" fill="#0e5c8a">更地渡しへつなぐ、4つの確認</text><rect x="35" y="90" width="730" height="102" rx="14" fill="white" stroke="#cde2f0"/><circle cx="80" cy="138" r="25" fill="#16709f"/><text x="80" y="148" text-anchor="middle" font-size="29" fill="white">1</text><text x="125" y="130" font-size="28" font-weight="bold" fill="#0e5c8a">工事を頼む前後</text><text x="125" y="167" font-size="22" fill="#1e3f55">対象面積・資材・届出を出す人を確認</text><rect x="35" y="212" width="730" height="102" rx="14" fill="white" stroke="#cde2f0"/><circle cx="80" cy="260" r="25" fill="#16709f"/><text x="80" y="270" text-anchor="middle" font-size="29" fill="white">2</text><text x="125" y="252" font-size="28" font-weight="bold" fill="#0e5c8a">着工7日前まで</text><text x="125" y="289" font-size="22" fill="#1e3f55">発注者等が届出／代理なら委任を確認</text><rect x="35" y="334" width="730" height="102" rx="14" fill="white" stroke="#cde2f0"/><circle cx="80" cy="382" r="25" fill="#16709f"/><text x="80" y="392" text-anchor="middle" font-size="29" fill="white">3</text><text x="125" y="374" font-size="28" font-weight="bold" fill="#0e5c8a">着工前</text><text x="125" y="411" font-size="22" fill="#1e3f55">提出日・控え・着工できる日を照合</text><rect x="35" y="456" width="730" height="102" rx="14" fill="white" stroke="#cde2f0"/><circle cx="80" cy="504" r="25" fill="#16709f"/><text x="80" y="514" text-anchor="middle" font-size="29" fill="white">4</text><text x="125" y="496" font-size="28" font-weight="bold" fill="#0e5c8a">解体完了から引渡しへ</text><text x="125" y="533" font-size="22" fill="#1e3f55">現地確認・登記など別手続きも調整</text></g></svg>