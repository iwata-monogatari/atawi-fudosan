<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">売れなかった契約も、書類は残す</title><desc id="desc">売買契約の解除根拠、取得した手付金、契約締結に支出した仲介手数料の記録を順に確認する図。契約書と費用の支払資料を税理士へ渡し、返還分は別に整理する。</desc><rect width="1000" height="560" rx="22" fill="#e9f5fc"/><g font-family="Yu Gothic,Meiryo,sans-serif"><text x="50" y="70" font-size="20" fill="#16709f">大石浩之の不動産実務メモ</text><text x="50" y="132" font-size="32" font-weight="bold" fill="#0e5c8a">売れなかった契約も、書類は残す</text><rect x="40" y="205" width="280" height="175" rx="18" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="180" cy="238" r="23" fill="#0e5c8a"/><text x="180" y="246" text-anchor="middle" font-size="25" fill="white">1</text><text x="180" y="302" text-anchor="middle" font-size="26" fill="#1e3f55">解除の根拠を確認</text><path d="M330 280h20m-8-8 8 8-8 8" fill="none" stroke="#2e9bd4" stroke-width="4"/><rect x="360" y="205" width="280" height="175" rx="18" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="500" cy="238" r="23" fill="#0e5c8a"/><text x="500" y="246" text-anchor="middle" font-size="25" fill="white">2</text><text x="500" y="302" text-anchor="middle" font-size="26" fill="#1e3f55">手付金の取得を記録</text><path d="M650 280h20m-8-8 8 8-8 8" fill="none" stroke="#2e9bd4" stroke-width="4"/><rect x="680" y="205" width="280" height="175" rx="18" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="820" cy="238" r="23" fill="#0e5c8a"/><text x="820" y="246" text-anchor="middle" font-size="25" fill="white">3</text><text x="820" y="302" text-anchor="middle" font-size="26" fill="#1e3f55">仲介料の支払を記録</text><rect x="45" y="430" width="910" height="70" rx="14" fill="#0e5c8a"/><text x="500" y="475" text-anchor="middle" font-size="28" fill="white">契約書と費用資料を税理士へ</text><text x="950" y="535" text-anchor="end" font-size="16" fill="#4e7288">2026年10月16日確認｜個別判断は専門家へ</text></g></svg>