<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img" aria-labelledby="title desc"><title id="title">手付金の保全は売主から確認</title><desc id="desc">個人売主と業者売主、仲介と売主の役割を2列で比較</desc><rect width="640" height="800" rx="20" fill="#f2f9fe"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="32" y="62" font-size="29" font-weight="bold">手付金の保全は売主から確認</text><rect x="28" y="100" width="584" height="168" rx="15" fill="white" stroke="#9ccfe7" stroke-width="2"/><circle cx="65" cy="147" r="23" fill="#0e5c8a"/><text x="65" y="157" text-anchor="middle" font-size="28" fill="white">1</text><text x="103" y="156" font-size="28" font-weight="bold">個人が実家の売主</text><text x="48" y="219" font-size="27">仲介会社が入るだけでは対象外</text><rect x="28" y="310" width="584" height="168" rx="15" fill="white" stroke="#9ccfe7" stroke-width="2"/><circle cx="65" cy="357" r="23" fill="#0e5c8a"/><text x="65" y="367" text-anchor="middle" font-size="28" fill="white">2</text><text x="103" y="366" font-size="28" font-weight="bold">宅建業者が自ら売主</text><text x="48" y="429" font-size="27">買主・完成状態・金額等で確認</text><rect x="28" y="520" width="584" height="168" rx="15" fill="white" stroke="#9ccfe7" stroke-width="2"/><circle cx="65" cy="567" r="23" fill="#0e5c8a"/><text x="65" y="577" text-anchor="middle" font-size="28" fill="white">3</text><text x="103" y="576" font-size="28" font-weight="bold">どちらも契約条件を読む</text><text x="48" y="639" font-size="27">受領先と返還条件を別に確認</text><text x="32" y="765" font-size="25">個別の保全義務は担当宅建士等へ確認</text></g></svg>