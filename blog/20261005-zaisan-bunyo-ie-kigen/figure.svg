<svg xmlns="http://www.w3.org/2000/svg" width="760" height="800" viewBox="0 0 760 800" role="img" aria-labelledby="title desc"><title>離婚日と申立期限を先に確認</title><desc>2026年4月1日より前の離婚等は離婚した日の翌日から起算して2年、同日以降は5年という財産分与の申立期限を左右に分け、家の売却期限とは異なることを示した図。</desc><rect width="760" height="800" rx="18" fill="#f2f9fe"/><g font-family="Yu Gothic, Noto Sans JP, sans-serif" fill="#1e3f55"><text x="30" y="58" font-size="28" font-weight="bold">離婚日と申立期限を先に確認</text><rect x="30" y="92" width="700" height="185" rx="12" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="75" cy="136" r="25" fill="#0e5c8a"/><text x="75" y="147" text-anchor="middle" fill="white" font-size="32">1</text><text x="118" y="147" font-size="32" font-weight="bold">2026年4月1日より前</text><text x="55" y="201" font-size="29" font-weight="normal">離婚等の場合は2年</text><text x="55" y="255" font-size="29" font-weight="normal">離婚した日の翌日から起算</text><rect x="30" y="302" width="700" height="185" rx="12" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="75" cy="346" r="25" fill="#0e5c8a"/><text x="75" y="357" text-anchor="middle" fill="white" font-size="32">2</text><text x="118" y="357" font-size="32" font-weight="bold">2026年4月1日以降</text><text x="55" y="411" font-size="29" font-weight="normal">離婚等の場合は5年</text><text x="55" y="465" font-size="29" font-weight="normal">離婚した日の翌日から起算</text><rect x="30" y="512" width="700" height="185" rx="12" fill="white" stroke="#cde2f0" stroke-width="2"/><circle cx="75" cy="556" r="25" fill="#0e5c8a"/><text x="75" y="567" text-anchor="middle" fill="white" font-size="32">3</text><text x="118" y="567" font-size="32" font-weight="bold">家を売る段取り</text><text x="55" y="621" font-size="29" font-weight="normal">売却期限とは別の話</text><text x="55" y="675" font-size="29" font-weight="normal">名義・合意・ローンを確認</text><text x="30" y="757" font-size="20" fill="#4e7288">2026年10月5日確認｜公式情報をもとに筆者作成</text></g></svg>