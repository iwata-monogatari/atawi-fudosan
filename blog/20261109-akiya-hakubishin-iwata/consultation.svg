<svg xmlns="http://www.w3.org/2000/svg" width="360" height="620" viewBox="0 0 360 620"><rect width="360" height="620" rx="12" fill="#e9f5fc"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="22" y="44" font-size="25" font-weight="bold">被害の場所から相談</text><rect x="18" y="65" width="324" height="116" rx="8" fill="white"/><text x="32" y="101" font-size="23" font-weight="bold">畑などの農作物</text><text x="32" y="136" font-size="20">農業被害の相談へ</text><text x="32" y="164" font-size="18">県資料は許可等を受けた方向け</text><rect x="18" y="199" width="324" height="118" rx="8" fill="white"/><text x="32" y="235" font-size="23" font-weight="bold">空き家の屋根裏など</text><text x="32" y="270" font-size="20">生活被害として市へ確認</text><text x="32" y="299" font-size="20">または専門業者へ相談</text><text x="160" y="356" font-size="30">↓</text><rect x="18" y="376" width="324" height="141" rx="8" fill="#0e5c8a"/><g fill="white" font-size="21"><text x="32" y="412">許可と対応範囲を確認</text><text x="32" y="449">自己判断でわなを置かない</text><text x="32" y="485" font-size="18">住宅の捕獲・貸出・補助は未確認</text></g><g font-size="18"><text x="22" y="551">出典：静岡県 1027234</text><text x="22" y="578">磐田市 1002689／本文参照</text><text x="22" y="605">2026年11月9日確認</text></g></g></svg>