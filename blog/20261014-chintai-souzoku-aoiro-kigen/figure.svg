<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" rx="24" fill="#e9f5fc"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1e3f55"><text x="48" y="65" font-size="32" font-weight="bold">親が青色申告者の場合の期限表</text><rect x="40" y="102" width="880" height="122" rx="16" fill="white" stroke="#cde2f0"/><circle cx="82" cy="144" r="24" fill="#2E9BD4"/><text x="73" y="153" font-size="24" fill="white">1</text><text x="128" y="140" font-size="23" fill="#0e5c8a">1月1日〜8月31日</text><text x="128" y="175" font-size="26" font-weight="bold">死亡日から4か月以内</text><text x="128" y="207" font-size="21">親の申告方法と承継を確認</text><rect x="40" y="242" width="880" height="122" rx="16" fill="white" stroke="#cde2f0"/><circle cx="82" cy="284" r="24" fill="#2E9BD4"/><text x="73" y="293" font-size="24" fill="white">2</text><text x="128" y="280" font-size="23" fill="#0e5c8a">9月1日〜10月31日</text><text x="128" y="315" font-size="26" font-weight="bold">その年12月31日</text><text x="128" y="347" font-size="21">休日等による実際の期限は確認</text><rect x="40" y="382" width="880" height="122" rx="16" fill="white" stroke="#cde2f0"/><circle cx="82" cy="424" r="24" fill="#2E9BD4"/><text x="73" y="433" font-size="24" fill="white">3</text><text x="128" y="420" font-size="23" fill="#0e5c8a">11月1日〜12月31日</text><text x="128" y="455" font-size="26" font-weight="bold">翌年2月15日</text><text x="128" y="487" font-size="21">申請と売却判断は分ける</text><text x="48" y="570" font-size="20">2026年10月14日確認／筆者作成。適用条件や個別の計算は専門家へ。</text></g></svg>